rules:
  # RoR forest terrains. RoR doesn't plant trees on its forest terrain by itself, so a forest: true tree
  # standing on one of these becomes that terrain's own tree (oak, palm, jungle, pine...); elsewhere it
  # becomes the RoR tree its line names.
  forest_terrains:
    [
      FOREST_OAK,
      FOREST_PALM_DESERT,
      FOREST_JUNGLE,
      FOREST_PINE,
      FOREST_MEDITERRANEAN,
      FOREST_PALM_GRASS,
    ]
  # Single road tiles and tiny clusters (AoE DE blends them into pale patches; RoR draws crisp cobbles)
  # take the most common surrounding terrain. Clusters of at least this many 8-connected tiles stay roads.
  road_terrains: [32, 33] # AoE DE Road Stone, Road Sand
  min_road_cluster: 8
  # AoE DE's 17 civilizations (Gaia..Macedonian) are RoR's first 17, in the same order.
  civs: same_order
  # Computer players follow the game's difficulty: Easiest and Standard play an easier version of the
  # translated AI (fewer villagers and soldiers, later and smaller attacks), Moderate plays it as translated,
  # Hard and up a harder one (aoe-agent-editor AI specs, levels: auto).
  ai_levels: auto
  # Missions where player 1 can build (starts with a villager or town center, or claims a base): every player's
  # population cap becomes `cap`, and each computer player macros toward it (more villagers, soldiers, production
  # buildings, town centers and dropsites in stages over `grow_minutes` on Moderate; 3x slower on Standard, 2x
  # faster on Hard). Hero and army-only missions keep their original cap.
  population: {cap: 200, grow_minutes: 60}

# Per-mission overrides. Besides terrain and objects:
#   reveal: [[x1, y1, x2, y2], ...]     areas player 1 starts with explored (map revealers, gone after a second)
#   show_base: [[x1, y1, x2, y2], ...]  areas player 1's enemy computer players start with explored
#   claim_base: {area: [x1, y1, x2, y2], player: 1, start_ai: true}
#                                       when the player's units reach the area, the Gaia buildings, villagers and
#                                       soldiers there become theirs; start_ai: the computer players do nothing
#                                       until then
missions:
  # Caesar starts alone and must find his base, Gaia's town on the south-east coast. The pirates wait for him.
  ave_caesar/01_caesars_revenge:
    claim_base: {area: [176, 3, 199, 40], player: 1, start_ai: true}
  # Missions that start the player in an established town (a town center and 6+ buildings): the enemy AIs start
  # with that town and 8 tiles around it explored, so their first attacks know where to go instead of waiting to
  # stumble on it. Only that area: no other map knowledge. Tutorials, town-less starts and starts spread over
  # most of the map (Pyrrhus, Alexander, Alesia, Zenobia, Odaenathus) are left as they were.
  # Walls and towers (the Granary's Small Wall and Watch Tower) wait for Trade, as in RoR-RIX (the user, 2026-11-12).
  ascent_of_egypt/04_the_dawn_of_a_new_age:
    disable: {1: [small_wall, small_gate, watch_tower]}
  # Skirmish: you and the Raiders start neutral, and RoR's neutral players never fight: "Defeat the Egyptian
  # Raiders" had no battle (the Egypt audit, 2026-11-12).
  ascent_of_egypt/05_skirmish:
    diplomacy: [[1, 2, ENEMY]]
  ascent_of_egypt/06_farming:                  # Lower Egypt knows where Upper Egypt is (its attacks)
    show_base: [[22, 48, 44, 68]]
    disable: {1: [small_wall, small_gate, watch_tower]}
  # Trade: your partners "could become jealous ... and attack" (the instructions). AoE1's AIs changed stance in game;
  # in RoR the neutral, passive Libyans and Canaanites sat still. The Libyan raiders (5 Scout Ships) are enemies
  # from the start, as the hints' raiders; the Canaanites turn on you at 20 minutes. The Minoans stay your ally.
  ascent_of_egypt/07_trade:                    # the Minoans and Canaanites know where you are
    show_base: [[64, 0, 95, 30]]
    diplomacy: [[1, 4, ENEMY]]
    attacks:
      3: {hostile_at: 1200, message: "The Canaanites have grown jealous of Egypt's trade. They have closed their Dock to you and declared war!"}
      4: {}
  ascent_of_egypt/08_religion:
