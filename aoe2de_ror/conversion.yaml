# AoE DE -> Age of Empires II DE: Return of Rome conversion.
#
# The converter decides everything from this file: change a line here and rebuild.
#   terrain:  AoE DE terrain id -> RoR terrain name     (e.g. make all Sand Dunes snow: 34: SNOW)
#   objects:  AoE DE object id  -> RoR object name, or `drop` to leave it out
#             {ror: NAME, forest: true} marks a forest tree (see rules.forest_terrains)
#   rules:    behaviour that isn't a one-to-one swap
#   missions: per-mission overrides, same shape as terrain/objects; they win over the global entries. Also, where
#     RoR plays AoE1's settings differently: diplomacy ([[a, b, ALLY|NEUTRAL|ENEMY]], both ways), disable
#     ({player: [ror_tech_tree.yaml names]}) and attacks ({player: {hostile_at: seconds, message: text}}: a passive
#     AoE1 AI attacks; with hostile_at it turns on the human players then). See docs/audits/.
#
# Every terrain and object the 61 campaign maps use is listed, with its AoE DE name and how often it
# appears. Names on the right are RoR names (aoe-agent-editor's RoR tables; `lookup("...", game="ror")`
# finds them). Seeded from the proof of concept's playtested mapping (aoe1-to-ror); edit by hand from here.

