              - {train: AXEMAN, count: 4}
              - {build: FARM, count: 4}
          normal:
            villagers: 14
            keep:
              - {build: ARCHERY_RANGE}
              - {research: IMPROVED_BOW}
              - {research: COMPOSITE_BOW}
              - {research: SHORT_SWORD}
              - {train: COMPOSITE_BOWMAN, count: 5}
              - {train: SHORT_SWORDSMAN, count: 5}
              - {build: FARM, count: 6}
              - {research: TOOLWORKING}
              - {research: METALWORKING}
              - {research: LEATHER_ARMOR_FOR_INFANTRY}
              - {research: LEATHER_ARMOR_FOR_ARCHERS}
              - {research: SCALE_ARMOR_FOR_INFANTRY}
              - {research: SCALE_ARMOR_FOR_ARCHERS}
              - {research: BRONZE_SHIELD}
          hard:
            villagers: 22
            keep:
              - {build: ARCHERY_RANGE, count: 2}
              - {build: STABLE, count: 2}
              - {build: MARKET}
              - {research: IMPROVED_BOW}
              - {research: COMPOSITE_BOW}
              - {research: SHORT_SWORD}
              - {research: WHEEL}
              - {train: COMPOSITE_BOWMAN, count: 5}
              - {train: SHORT_SWORDSMAN, count: 5}
              - {train: CHARIOT, count: 10}
              - {train: CHARIOT_ARCHER, count: 10}
              - {build: FARM, count: 10}
              - {research: TOOLWORKING}
              - {research: METALWORKING}
              - {research: LEATHER_ARMOR_FOR_INFANTRY}
              - {research: LEATHER_ARMOR_FOR_ARCHERS}
              - {research: LEATHER_ARMOR_FOR_CAVALRY}
              - {research: SCALE_ARMOR_FOR_INFANTRY}
              - {research: SCALE_ARMOR_FOR_ARCHERS}
              - {research: SCALE_ARMOR_FOR_CAVALRY}
              - {research: BRONZE_SHIELD}
