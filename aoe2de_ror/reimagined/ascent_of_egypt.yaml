# Ascent of Egypt, reimagined: bonus objectives by difficulty and the upgrades they unlock (progression.py).
#
# upgrades: this campaign's permanent upgrades: label (short, the popup button), text (what it does, shown in the
#   objectives list while the choice is up). Once picked, an upgrade's effects (aoe-agent-editor trigger effects,
#   for the human player unless they say otherwise) run at the start of every mission of the campaign. An effect
#   whose object_list_unit_id lists several units runs once per unit.
# missions.<NN_mission>:
#   setup: [...]                  effects on every difficulty (the mission's own rules: what can be built...)
#   players: [{number, name, civ}]  players the mission adds: enemies of all, no AI, moved by triggers
#   keep_alive: [player]          a hidden, invulnerable House keeps the player in the game (not defeated)
#   rewards: [upgrade, upgrade]   the choice offered on completing the primary objective
#   bonus:                        Moderate shows the first, Hard both
#     - text: ...                 the to-do line (shown as optional)
#       conditions: [...]         trigger conditions, all met at once (source_player is the human unless given)
#       setup: [...]              effects that change the mission on the difficulties that show this objective
#       triggers: [{name, looping, conditions, effects}]   its own triggers, on with the objective ("@name": a
#                                 sibling)
#       fail: [condition, ...]    each one alone fails the objective
#       rewards: [upgrade, upgrade]
#
# Tiers: the primary objective's choice is a quality-of-life upgrade, the Moderate bonus a good buff, the Hard
# bonus a great one.
#
# Unit ids and stats are RoR's (empires2_x2_p1.dat, read with genieutils, 2026-11-07): Town Centers 109/71/141/142
# hold 4 population in their first storage; Gazelle 22 (150 food), Gazelle King 163, Elephant 1301 (45 HP, 10
# attack, no armour, 300 food), Elephant King 333, Lion 1029 (20 HP), Crocodile 1031 (20 HP, 4 attack), Crocodile
# King 200, bears 486/2089/2090, fish 53/69/455-459, berry bushes 302/1053/1054/2733. Villagers are object class 4
# (Civilian) and attack in class 4 (melee, the hunters' spears too); hunters are units 122 (male) and 216 (female).
# Drop-off points are a per-villager list in the data that no trigger can change, so "food can be dropped off at
# Houses" isn't possible (swapped for faster hunting).
#
# Mission 2: Houses are 70/463/464/465 (30 wood); builders 118/212, woodcutters 123/218; every villager unit
# type (object class 4) costs 1 population, and RoR's own Logistics tech halves infantry by setting each unit's
# population (attribute 110, negative = takes population) to -0.5. RoR's only fishing upgrade is the Fishing Ship
# (tech 4, Bronze Age; Fishing Boat 13 -> Fishing Ship 15, both object class 21). Forage bushes are unit 59 (150
# food); fish 455-458 (250 food). The Foraging map's river runs across rows 21-37 with shallow crossings at x 14-25
# and 33-41 (terrain 4); the Town Center is at 22,18.
#
# Mission 3: Reveal Map is a player resource (203: 1 explored, 2 all visible). The Libyans (player 2, red) start
# with 2 Clubmen (281, class 6) at 15,33 and 13,31 and a Scout (448, class 47) at 39,4, and no buildings. Axe (tech
# 63) turns Clubmen into Axemen; the Storage Pit's first upgrades are Tool Working (46) and Leather Armor for
# soldiers, archers and mounted units (40, 41, 42), all Tool Age. Stable is 101, Bowman 4 (40 food, 20 wood).
# Villagers train as 83/293 (50 food, 20 s); Villager Population is resource 38. Units lost: Killed By Others
# (154), and villagers killed by Gaia or animals (226, 227).
#
# Mission 4: only the player (Town Center at 28,26), elephants at 22,10 and 6,38, and 3 Whales (2625) that hold
# 1,000 gold each. The Bronze Age (102) needs tech 75, granted by any two of Market/Archery Range/Stable (Tool Age
# buildings). Egypt can't have the Catapult (tech 54, Stone Thrower 280 -> 550), Heavy Catapult (36), Phalangite
# (Phalanx, 73) or Armored Elephant (125). Farm 50; walls 72/117/119/155; towers 79/234/235/236; Archery Range
# 87/10/14; Stable 101/86/153; Barracks 12/498/132/20; Docks 45/133/47/51; Town Centers 109/71/141/142 (200 wood).
# Gatherers: forager 120/354, hunter 122/216, farmer 259/214, fisherman 56/57, shepherd 590/592, Fishing Boat/Ship
# 13/15, woodcutter 123/218, gold miner 579/581/2333/2334, stone miner 124/220. Storage Pit: Tool Working 46,
# Leather Armor 40/41/42 (Tool), Scale Armor 43/44/45 and Metal Working 51 (Bronze).
#
# Verified in game (2026-11-07): the Hunting upgrades and setups all work, Animal Decay Prevention (resource 292)
# included; the forced Fishing Ship research works in the Stone Age. Unverified: villagers at 0 population.

upgrades:
  # Hunting, primary (quality of life)
  preserved_meat:
    label: "Preserved Meat"
    text: "Hunted animals no longer lose food over time."
    effects: [{type: modify_resource, tribute_list: 292, operation: SET, quantity: 1}]
  town_hearth:
    label: "Town Hearth"
    text: "Town Centers support 5 more population."
    effects: [{type: modify_attribute, object_list_unit_id: [109, 71, 141, 142], object_attributes: 21,
               operation: ADD, quantity: 5}]
  # Hunting, Moderate bonus (good)
  granary_stores:
    label: "Granary Stores"
    text: "+500 food at the start of every mission."
    effects: [{type: modify_resource, tribute_list: 0, operation: ADD, quantity: 500}]
  bountiful_land:
    label: "Bountiful Land"
    text: "Wild animals, fish and berry bushes hold 50 more food (farms excluded)."
    effects:
      # the animals, fish and bushes on the map (Gaia's), each object (a change to the unit type as well might add
      # the 50 twice to objects already placed)
      - {type: modify_object_attribute, source_player: 0, object_attributes: 21, operation: ADD, quantity: 50,
         object_list_unit_id: [22, 163, 1301, 333, 1029, 1031, 200, 486, 2089, 2090, 53, 69, 455, 456, 457, 458,
                               459, 302, 1053, 1054, 2733]}
  # Hunting, Hard bonus (great)
  hardened_hunters:
    label: "Hardened Hunters"
    text: "Villagers have 30 more hit points and 3 more attack."
    effects:
      - {type: modify_attribute_for_class, object_group2: 4, object_attributes: 0, operation: ADD, quantity: 30}
      - {type: modify_attribute_for_class, object_group2: 4, object_attributes: 9, operation: ADD,
         armour_attack_class: 4, armour_attack_quantity: 3}
  swift_hunters:
    label: "Swift Hunters"
    text: "Hunters gather food twice as fast."
    effects: [{type: modify_attribute, object_list_unit_id: [122, 216], object_attributes: 13,
               operation: MULTIPLY, quantity: 2}]

  # Foraging, primary (quality of life)
  cheap_housing:
    label: "Cheap Housing"
    text: "Houses cost 10 wood."
    effects: [{type: modify_attribute, object_list_unit_id: [70, 463, 464, 465], object_attributes: 104,
               operation: SET, quantity: 10}]
  quick_builders:
    label: "Quick Builders"
    text: "Villagers build 20% faster."
    effects: [{type: modify_attribute, object_list_unit_id: [118, 212], object_attributes: 13,
               operation: MULTIPLY, quantity: 1.2}]
  # Foraging, Moderate bonus (good)
  master_fishers:
    label: "Master Fishers"
    text: "Start every mission with the Fishing Ship upgrade: Fishing Boats become Fishing Ships."
    effects: [{type: research_technology, technology: 4, force_research_technology: 1}]
  timber_discount:
    label: "Timber Discount"
    text: "Buildings other than Houses cost 50 less wood."
    effects: [{type: modify_attribute, object_attributes: 104, operation: ADD, quantity: -50, object_list_unit_id: [
      12, 498, 132, 20,         # Barracks
      87, 10, 14,               # Archery Range
      103, 105, 18, 19,         # Academy
      104, 30, 31, 32,          # Temple
      45, 133, 47, 51,          # Dock
      49, 150,                  # Siege Workshop
      68, 129, 130, 131,        # Granary
      562, 563, 564, 565,       # Storage Pit
      84, 116, 137,             # Market
      101, 86, 153,             # Stable
      109, 71, 141, 142,        # Town Center
      209, 210]}]               # Government Center
  # Foraging, Hard bonus (great)
  light_footprint:
    # Half a space (-0.5, as RoR's Logistics does for infantry) had no effect in game: the trigger effect reads
    # population as a whole number (playtest 2026-11-07). So no space at all.
    label: "Light Footprint"
    # Balanced by the price: villagers (trained as 83 and 293) cost 75 food instead of 50.
    text: "Villagers take no population space, but cost 75 food."
    effects:
      - {type: modify_attribute, object_attributes: 110, operation: SET, quantity: 0, object_list_unit_id: [
         83, 293, 56, 57, 118, 120, 122, 123, 124, 156, 206, 212, 214, 216, 218, 220, 222, 259, 354, 579, 581, 590,
         592, 1891, 1892, 2333, 2334]}
      - {type: modify_attribute, object_attributes: 103, operation: SET, quantity: 75, object_list_unit_id: [83, 293]}
  swift_woodcutters:
    label: "Swift Woodcutters"
    text: "Woodcutters gather wood twice as fast."
    effects: [{type: modify_attribute, object_list_unit_id: [123, 218], object_attributes: 13,
               operation: MULTIPLY, quantity: 2}]
  # Discoveries, primary (quality of life)
  charted_lands:
    label: "Charted Lands"
    text: "Every mission starts with the whole map explored."
    effects: [{type: modify_resource, tribute_list: 203, operation: SET, quantity: 1}]
  all_seeing:
    label: "All-Seeing"
    text: "Every mission starts with the whole map visible, no fog of war."
    effects: [{type: modify_resource, tribute_list: 203, operation: SET, quantity: 2}]
  # Discoveries, Moderate bonus (good)
  early_riders:
    label: "Early Riders"
    text: "The Stable and Scouts are available from the Stone Age."
    effects:
      # Perks trump a mission's own settings: this enables them even where a mission disables the Stable.
      - {type: enable_disable_object, object_list_unit_id: [101, 448], enabled: 1}
  woodland_bows:
    label: "Woodland Bows"
    text: "Bowmen cost 60 wood and no food."
    effects:
      - {type: modify_attribute, object_list_unit_id: 4, object_attributes: 103, operation: SET, quantity: 0}
      - {type: modify_attribute, object_list_unit_id: 4, object_attributes: 104, operation: SET, quantity: 60}
  # Discoveries, Hard bonus (great)
  founding_families:
    label: "Founding Families"
    text: "Each mission, your first 10 villagers are free and train instantly."
    effects:
      # Remember the villager's price and training time (Light Footprint may have changed the price), then
      # make it free and instant until 10 more villagers are alive than at the start.
      - {type: modify_variable_by_resource, tribute_list: 38, operation: SET, variable: "RI free villagers until"}
      - {type: change_variable, variable: "RI free villagers until", operation: ADD, quantity: 10}
      - {type: modify_variable_by_attribute, object_list_unit_id: 83, object_attributes: 103, operation: SET,
         variable: "RI villager food"}
      - {type: modify_variable_by_attribute, object_list_unit_id: 83, object_attributes: 101, operation: SET,
         variable: "RI villager time"}
      - {type: modify_attribute, object_list_unit_id: [83, 293], object_attributes: 103, operation: SET, quantity: 0}
      - {type: modify_attribute, object_list_unit_id: [83, 293], object_attributes: 101, operation: SET, quantity: 0}
    triggers:
      - name: count
        looping: true
        effects: [{type: modify_variable_by_resource, tribute_list: 38, operation: SET, variable: "RI villagers"}]
      - name: done
        conditions: [{type: compare_variables, variable: "RI villagers", comparison: LARGER_OR_EQUAL,
                      variable2: "RI free villagers until"}]
        effects:
          - {type: modify_attribute_by_variable, object_list_unit_id: [83, 293], object_attributes: 103,
             operation: SET, variable: "RI villager food"}
          - {type: modify_attribute_by_variable, object_list_unit_id: [83, 293], object_attributes: 101,
             operation: SET, variable: "RI villager time"}
          - {type: deactivate_trigger, trigger_id: "@count"}
  seasoned_gear:
    label: "Seasoned Gear"
    text: "Tool Working and the three Leather Armor upgrades are researched at the start of every mission."
    effects: [{type: research_technology, technology: [46, 40, 41, 42], force_research_technology: 1}]
  # Dawn of a New Age, primary (quality of life)
  swift_advance:
    label: "Swift Advance"
    text: "Advancing to the next age is instant (it still costs the same)."
    effects: [{type: change_technology_research_time, technology: [101, 102, 103], quantity: 0}]
  free_town_center:
    label: "Free Town Center"
    text: "Each mission, your first new Town Center costs nothing."
    effects:
      # Count the Town Centers now (every age's), remember the price, build the next one for free.
      - {type: count_units_into_variable, object_list_unit_id: 109, variable2: "RI tc a"}
      - {type: count_units_into_variable, object_list_unit_id: 71, variable2: "RI tc b"}
      - {type: count_units_into_variable, object_list_unit_id: 141, variable2: "RI tc c"}
      - {type: count_units_into_variable, object_list_unit_id: 142, variable2: "RI tc d"}
      - {type: modify_variable_by_variable, variable: "RI tc until", operation: SET, variable2: "RI tc a"}
      - {type: modify_variable_by_variable, variable: "RI tc until", operation: ADD, variable2: "RI tc b"}
      - {type: modify_variable_by_variable, variable: "RI tc until", operation: ADD, variable2: "RI tc c"}
      - {type: modify_variable_by_variable, variable: "RI tc until", operation: ADD, variable2: "RI tc d"}
      - {type: change_variable, variable: "RI tc until", operation: ADD, quantity: 1}
      - {type: modify_variable_by_attribute, object_list_unit_id: 109, object_attributes: 104, operation: SET,
         variable: "RI tc wood"}
      - {type: modify_attribute, object_list_unit_id: [109, 71, 141, 142], object_attributes: 104, operation: SET,
         quantity: 0}
    triggers:
      - name: count
        looping: true
        effects:
          - {type: count_units_into_variable, object_list_unit_id: 109, variable2: "RI tc a"}
          - {type: count_units_into_variable, object_list_unit_id: 71, variable2: "RI tc b"}
          - {type: count_units_into_variable, object_list_unit_id: 141, variable2: "RI tc c"}
          - {type: count_units_into_variable, object_list_unit_id: 142, variable2: "RI tc d"}
          - {type: modify_variable_by_variable, variable: "RI tcs", operation: SET, variable2: "RI tc a"}
          - {type: modify_variable_by_variable, variable: "RI tcs", operation: ADD, variable2: "RI tc b"}
          - {type: modify_variable_by_variable, variable: "RI tcs", operation: ADD, variable2: "RI tc c"}
          - {type: modify_variable_by_variable, variable: "RI tcs", operation: ADD, variable2: "RI tc d"}
      - name: done
        conditions: [{type: compare_variables, variable: "RI tcs", comparison: LARGER_OR_EQUAL,
                      variable2: "RI tc until"}]
        effects:
          - {type: modify_attribute_by_variable, object_list_unit_id: [109, 71, 141, 142], object_attributes: 104,
             operation: SET, variable: "RI tc wood"}
          - {type: deactivate_trigger, trigger_id: "@count"}
  # Dawn of a New Age, Moderate bonus (good)
  master_fishermen:
    # The user's call: four times the load on purpose, fishers travel the farthest.
    label: "Master Fishermen"
    text: "Fishermen and Fishing Boats work 25% faster and carry 50 more food."
    effects:
      - {type: modify_attribute, object_list_unit_id: [56, 57, 13, 15], object_attributes: 14, operation: ADD,
         quantity: 50}
      - {type: modify_attribute, object_list_unit_id: [56, 57, 13, 15], object_attributes: 13, operation: MULTIPLY,
         quantity: 1.25}
  quartermasters:
    label: "Quartermasters"
    text: "The Storage Pit's Tool and Bronze Age upgrades are free, but take three times as long."
    effects:
      - {type: change_technology_cost, technology: [46, 40, 41, 42, 43, 44, 45, 51], resource_1: 0,
         resource_1_quantity: 0, resource_2: 3, resource_2_quantity: 0}
      - {type: change_technology_research_time, technology: 46, quantity: 120}
      - {type: change_technology_research_time, technology: [40, 41, 42], quantity: 90}
      - {type: change_technology_research_time, technology: [43, 44, 45], quantity: 180}
      - {type: change_technology_research_time, technology: 51, quantity: 225}
  # Dawn of a New Age, Hard bonus (great)
  resource_mastery:
    label: "Resource Mastery"
    text: "Each Market resource upgrade also gives the other gatherers 2 more carrying capacity and 5% faster work."
    triggers:
      - name: wood working
        conditions: [{type: research_technology, technology: 107}]
        effects:
          - {type: modify_attribute, object_list_unit_id: &food [120, 354, 122, 216, 259, 214, 56, 57, 590, 592, 13,
                                                                 15], object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *food, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: &gold [579, 581, 2333, 2334], object_attributes: 14,
             operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *gold, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: &stone [124, 220], object_attributes: 14, operation: ADD,
             quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *stone, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
      - name: gold mining
        conditions: [{type: research_technology, technology: 108}]
        effects:
          - {type: modify_attribute, object_list_unit_id: *food, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *food, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: &wood [123, 218], object_attributes: 14, operation: ADD,
             quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *wood, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: *stone, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *stone, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
      - name: stone mining
        conditions: [{type: research_technology, technology: 109}]
        effects:
          - {type: modify_attribute, object_list_unit_id: *food, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *food, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: *wood, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *wood, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: *gold, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *gold, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
      - name: domestication
        conditions: [{type: research_technology, technology: 81}]
        effects:
          - {type: modify_attribute, object_list_unit_id: *wood, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *wood, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: *gold, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *gold, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: *stone, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *stone, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
  nile_arsenal:
    label: "Nile Arsenal"
    text: "Egypt gains the Catapult, Heavy Catapult, Phalangite and Armored Elephant upgrades (Iron Age)."
    effects: [{type: enable_disable_technology, technology: [54, 36, 73, 125], enabled: 1}]

missions:
  01_hunting:
    rewards: [preserved_meat, town_hearth]
    bonus:
      - text: "Stockpile 500 food."
        conditions: [{type: accumulate_attribute, attribute: 0, quantity: 500}]
        setup:
          # Moderate and Hard: predators. Three lions on the open land east, south-west and north, two more
          # crocodiles by the west and east shores (the map has one, at 12,10; the Town Center is at 23,22).
          - {type: create_object, source_player: 0, object_list_unit_id: 1029, location_x: 38, location_y: 20}
          - {type: create_object, source_player: 0, object_list_unit_id: 1029, location_x: 10, location_y: 31}
          - {type: create_object, source_player: 0, object_list_unit_id: 1029, location_x: 32, location_y: 8}
          - {type: create_object, source_player: 0, object_list_unit_id: 1031, location_x: 3, location_y: 17}
          - {type: create_object, source_player: 0, object_list_unit_id: 1031, location_x: 42, location_y: 27}
        rewards: [granary_stores, bountiful_land]
      - text: "Hunt the elephant."
        conditions: [{type: own_fewer_objects, source_player: 0, object_list: 1301, quantity: 0}]
        setup:
          # Hard: the island's one elephant (at 32,1) gets 120 hit points instead of 45, and 1 melee and 2 pierce
          # armour, so the hunters' 4-damage spears do 3.
          - {type: modify_attribute, source_player: 0, object_list_unit_id: 1301, object_attributes: 0,
             operation: ADD, quantity: 75}
          - {type: modify_attribute, source_player: 0, object_list_unit_id: 1301, object_attributes: 8,
             operation: ADD, armour_attack_class: 4, armour_attack_quantity: 1}
          - {type: modify_attribute, source_player: 0, object_list_unit_id: 1301, object_attributes: 8,
             operation: ADD, armour_attack_class: 3, armour_attack_quantity: 2}
        rewards: [hardened_hunters, swift_hunters]
  02_foraging:
    rewards: [cheap_housing, quick_builders]
    bonus:
      - text: "Stockpile 500 wood."
        conditions: [{type: accumulate_attribute, attribute: 1, quantity: 500}]
        setup:
          # Moderate and Hard: no forage; fish in the river instead, either side of the crossings.
          # (removing by unit type over the map left them in place; select names the placed bushes)
          - {type: remove_object, select: {player: 0, unit: 59}}
          - {type: create_object, source_player: 0, object_list_unit_id: 455, location_x: 6, location_y: 29}
          - {type: create_object, source_player: 0, object_list_unit_id: 456, location_x: 11, location_y: 29}
          - {type: create_object, source_player: 0, object_list_unit_id: 457, location_x: 2, location_y: 32}
          - {type: create_object, source_player: 0, object_list_unit_id: 458, location_x: 29, location_y: 23}
          - {type: create_object, source_player: 0, object_list_unit_id: 455, location_x: 29, location_y: 29}
          - {type: create_object, source_player: 0, object_list_unit_id: 456, location_x: 34, location_y: 30}
          - {type: create_object, source_player: 0, object_list_unit_id: 457, location_x: 44, location_y: 29}
          - {type: create_object, source_player: 0, object_list_unit_id: 458, location_x: 43, location_y: 31}
        rewards: [master_fishers, timber_discount]
      - text: "Have 4 fishing boats."
        conditions: [{type: own_objects, object_group: 21, quantity: 4}]
        setup:
          # Hard: no starting resources (the upgrades still add theirs: they run after this). No crocodiles: the
          # user dropped them after playtests (they'd be food anyway).
          - {type: modify_resource, tribute_list: 0, operation: SET, quantity: 0}
          - {type: modify_resource, tribute_list: 1, operation: SET, quantity: 0}
          - {type: modify_resource, tribute_list: 2, operation: SET, quantity: 0}
          - {type: modify_resource, tribute_list: 3, operation: SET, quantity: 0}
        rewards: [light_footprint, swift_woodcutters]
  03_discoveries:
    rewards: [charted_lands, all_seeing]
    bonus:
      - text: "Defeat the Libyans."
        conditions:
          - {type: own_fewer_objects, source_player: 2, object_group: 6, quantity: 0}
          - {type: own_fewer_objects, source_player: 2, object_group: 47, quantity: 0}
        setup:
          # Moderate and Hard: three more Clubmen with the Libyans in the south-west, another Scout in the north.
          - {type: create_object, source_player: 2, object_list_unit_id: 281, location_x: 16, location_y: 29}
          - {type: create_object, source_player: 2, object_list_unit_id: 281, location_x: 18, location_y: 29}
          - {type: create_object, source_player: 2, object_list_unit_id: 281, location_x: 16, location_y: 31}
          - {type: create_object, source_player: 2, object_list_unit_id: 448, location_x: 38, location_y: 6}
        rewards: [early_riders, woodland_bows]
      - text: "Lose no units."
        # Complete with the main objective, unless a unit was lost first.
        conditions: [{type: variable_value, variable: "RI primary", comparison: EQUAL, quantity: 1}]
        fail:
          - {type: accumulate_attribute, attribute: 154, quantity: 1}
          - {type: accumulate_attribute, attribute: 226, quantity: 1}
          - {type: accumulate_attribute, attribute: 227, quantity: 1}
        setup:
          # Hard: the Libyans have Axemen and Leather Armor.
          - {type: research_technology, source_player: 2, technology: [63, 40, 41, 42], force_research_technology: 1}
        rewards: [founding_families, seasoned_gear]
  04_the_dawn_of_a_new_age:
    players: [{number: 2, name: "Raiders", civ: EGYPTIAN}]
    keep_alive: [2]          # on Standard they have no units: without it they'd show as defeated at the start
    setup:
      # Every difficulty: no Farms or fortifications; the Barracks with Clubmen only (no Axemen), no Archery Range,
      # Stable, Bowmen or Scouts (Early Riders still brings the Stable and Scouts: upgrades run after this).
      - {type: enable_disable_object, object_list_unit_id: [50, 72, 117, 119, 155, 79, 234, 235, 236], enabled: 0}
      - {type: enable_disable_object, object_list_unit_id: [87, 10, 14, 101, 86, 153, 4, 448], enabled: 0}
      - {type: enable_disable_object, object_list_unit_id: [12, 498, 132, 20], enabled: 1}
      - {type: enable_disable_technology, technology: 63, enabled: 0}
    rewards: [swift_advance, free_town_center]
    bonus:
      - text: "Reach a population of 25 with 2 Docks."
        conditions:
          - {type: accumulate_attribute, attribute: 11, quantity: 25}
          - {type: variable_value, variable: "RI docks", comparison: LARGER_OR_EQUAL, quantity: 2}
        triggers:
          # Docks change unit with each age: count them all.
          - name: count docks
            looping: true
            effects:
              - {type: count_units_into_variable, object_list_unit_id: 45, variable2: "RI docks a"}
              - {type: count_units_into_variable, object_list_unit_id: 133, variable2: "RI docks b"}
              - {type: count_units_into_variable, object_list_unit_id: 47, variable2: "RI docks c"}
              - {type: modify_variable_by_variable, variable: "RI docks", operation: SET, variable2: "RI docks a"}
              - {type: modify_variable_by_variable, variable: "RI docks", operation: ADD, variable2: "RI docks b"}
              - {type: modify_variable_by_variable, variable: "RI docks", operation: ADD, variable2: "RI docks c"}
        setup:
          # Moderate and Hard: Raiders guard both elephants: 2 Clubmen and a Bowman in the north, 2 Clubmen and a
          # Scout in the south-west.
          - {type: create_object, source_player: 2, object_list_unit_id: 281, location_x: 22, location_y: 8}
          - {type: create_object, source_player: 2, object_list_unit_id: 281, location_x: 24, location_y: 8}
          - {type: create_object, source_player: 2, object_list_unit_id: 4, location_x: 23, location_y: 7}
          - {type: create_object, source_player: 2, object_list_unit_id: 281, location_x: 8, location_y: 37}
          - {type: create_object, source_player: 2, object_list_unit_id: 281, location_x: 8, location_y: 39}
          - {type: create_object, source_player: 2, object_list_unit_id: 448, location_x: 9, location_y: 38}
        rewards: [master_fishermen, quartermasters]
      - text: "Reach the Bronze Age."
        conditions: [{type: accumulate_attribute, attribute: 6, quantity: 2}]
        setup:
          # Hard: the Raiders have Axemen and the first Storage Pit upgrades, and a Bowman more at each elephant.
          # The Bronze Age opens without its two Tool Age buildings (tech 75 granted); the Whales' gold pays for it.
          - {type: research_technology, source_player: 2, technology: [63, 46, 40, 41, 42], force_research_technology: 1}
          - {type: create_object, source_player: 2, object_list_unit_id: 4, location_x: 25, location_y: 7}
          - {type: create_object, source_player: 2, object_list_unit_id: 4, location_x: 9, location_y: 36}
          - {type: enable_disable_technology, technology: 102, enabled: 1}
          - {type: research_technology, technology: 75, force_research_technology: 1}
        triggers:
          # Reaching the Tool Age brings the northern group down on the Town Center, the other a minute later.
          - name: first wave
            conditions: [{type: accumulate_attribute, attribute: 6, quantity: 1}]
            effects:
              - {type: attack_move, source_player: 2, area_x1: 19, area_y1: 4, area_x2: 28, area_y2: 14,
                 location_x: 28, location_y: 26}
              - {type: display_instructions, display_time: 8, message: "Raiders from the north are coming for your Town Center!"}
              - {type: activate_trigger, trigger_id: "@second wave"}
          - name: second wave
            conditions: [{type: timer, timer: 60}]
            effects:
              - {type: attack_move, source_player: 2, area_x1: 1, area_y1: 32, area_x2: 12, area_y2: 44,
                 location_x: 28, location_y: 26}
              - {type: display_instructions, display_time: 8, message: "More Raiders, from the south-west!"}
        rewards: [resource_mastery, nile_arsenal]
