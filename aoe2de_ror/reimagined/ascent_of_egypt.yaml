  # Skirmish, primary (quality of life)
  keen_eyes:
    label: "Keen Eyes"
    text: "Bowmen shoot 1 tile farther."
    effects: [{type: modify_attribute, object_list_unit_id: [4, 24, 492], object_attributes: 12, operation: ADD,
               quantity: 1}]
