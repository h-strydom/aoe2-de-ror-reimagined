    label: "Field Dressing"
    text: "Soldiers slowly heal (15 hit points a minute)."
    # Regeneration (attribute 109, hit points per minute) for every soldier class: infantry 6, archers 0, mounted
    # archers 36, cavalry 12, Scouts 47, Slingers 44, siege 13 and 55.
    effects: [{type: modify_attribute_for_class, object_group2: [6, 0, 36, 12, 47, 44, 13, 55], object_attributes: 109,
               operation: SET, quantity: 15}]
  # Skirmish, Moderate bonus (good)
  bronze_tipped_arrows:
    label: "Bronze-tipped Arrows"
    text: "Everything that shoots arrows does 1 more damage: archers, towers and warships."
    # The arrow shooters (RoR data, projectile Arrow or Tower Arrow): Bowman 4, Improved Bowman 24, Composite Bowman
    # 492, Chariot Archer 5, Horse Archer 39, Heavy Horse Archer 474, Elephant Archer 873, War Galley 21, Scout Ship
    # 539, Watch/Sentry/Guard Tower 79/234/235. All pierce (class 3).
    effects: [{type: modify_attribute, object_attributes: 9, operation: ADD, armour_attack_class: 3,
               armour_attack_quantity: 1, object_list_unit_id: [4, 24, 492, 5, 39, 474, 873, 21, 539, 79, 234, 235]}]
  hardy_warriors:
    label: "Hardy Warriors"
    text: "Melee soldiers have 20 more hit points."
    # Infantry (6), cavalry and elephants (12), Scouts (47).
    effects: [{type: modify_attribute_for_class, object_group2: [6, 12, 47], object_attributes: 0, operation: ADD,
               quantity: 20}]
  # Skirmish, Hard bonus (great)
  battle_drill:
    label: "Battle Drill"
    text: "Soldiers train 50% faster."
    effects: [{type: modify_attribute_for_class, object_group2: [6, 0, 36, 12, 47, 44, 13, 55, 22], object_attributes: 101,
               operation: MULTIPLY, quantity: 0.67}]
  shield_wall:
    label: "Shield Wall"
    text: "Infantry have 1 more melee and pierce armour."
    effects:
      - {type: modify_attribute_for_class, object_group2: 6, object_attributes: 8, operation: ADD,
         armour_attack_class: 4, armour_attack_quantity: 1}
      - {type: modify_attribute_for_class, object_group2: 6, object_attributes: 8, operation: ADD,
         armour_attack_class: 3, armour_attack_quantity: 1}

  # Farming, primary (quality of life)
  free_farms:
    label: "Free Farms"
    text: "Farms cost nothing, but farmers gather at half speed."
    # Farm 50's wood cost (attribute 104); farmers 259 (male) and 214 (female) work rate (13).
    effects:
      - {type: modify_attribute, object_list_unit_id: 50, object_attributes: 104, operation: SET, quantity: 0}
      - {type: modify_attribute, object_list_unit_id: [259, 214], object_attributes: 13, operation: MULTIPLY,
         quantity: 0.5}
  market_day:
    label: "Market Day"
    text: "Every Market upgrade finishes in 1 second (it still costs the same)."
    # The techs researched at the Market (84) in RoR's data (read with genieutils, 2026-11-08): Wheel 28, Coinage 30,
    # Plow 31, Artisanship 32, Irrigation 80, Domestication 81, Wood Working 107, Gold Mining 108, Stone Mining 109,
    # Craftsmanship 110, Siege Craft 111. 1 second, not 0 (see swift_advance).
    effects: [{type: change_technology_research_time, technology: [28, 30, 31, 32, 80, 81, 107, 108, 109, 110, 111],
               quantity: 1}]
  # Farming, Moderate bonus (good)
  slinger_corps:
    label: "Slinger Corps"
    text: "Slingers cost no stone and throw 1 tile farther."
    # Slinger 7 (and 6, the data's other Slinger): stone cost (106), range (12).
    effects:
      - {type: modify_attribute, object_list_unit_id: [7, 6], object_attributes: 106, operation: SET, quantity: 0}
      - {type: modify_attribute, object_list_unit_id: [7, 6], object_attributes: 12, operation: ADD, quantity: 1}
  builders_tithe:
    label: "Builder's Tithe"
    text: "Finishing a building (not Farms or walls) gives 5 stone."
    # A finished building adds what its storages with store flag 4 hold (Houses give their population that way;
    # RoR's data, 2026-11-08). Every building's third storage, free in all of them, becomes 5 stone (resource 2)
    # with flag 4. Unverified in game: whether stone is given like population, and whether it's taken back when the
    # building is destroyed. Buildings: every building in ror_tech_tree.yaml but walls, gates and Farms, and the
    # Town Centers 109/71/141/142.
    effects:
      - {type: modify_attribute, object_list_unit_id: &buildings [10, 12, 14, 18, 19, 20, 30, 31, 32, 45, 47, 49, 51,
          68, 70, 79, 84, 86, 87, 101, 103, 104, 105, 116, 129, 130, 131, 132, 133, 137, 150, 153, 209, 210, 234,
          235, 236, 276, 463, 464, 465, 484, 498, 562, 563, 564, 565, 597, 617, 621, 109, 71, 141, 142],
         object_attributes: 170, operation: SET, quantity: 2}
      - {type: modify_attribute, object_list_unit_id: *buildings, object_attributes: 173, operation: SET, quantity: 4}
      - {type: modify_attribute, object_list_unit_id: *buildings, object_attributes: 27, operation: SET, quantity: 5}
  # Farming, Hard bonus (great)
  war_fleet:
    label: "War Fleet"
    text: "Warships have 40 more hit points and do 2 more damage."
    # Warships are class 22; their damage is pierce (class 3).
    effects:
      - {type: modify_attribute_for_class, object_group2: 22, object_attributes: 0, operation: ADD, quantity: 40}
      - {type: modify_attribute_for_class, object_group2: 22, object_attributes: 9, operation: ADD,
         armour_attack_class: 3, armour_attack_quantity: 2}
  field_granaries:
    label: "Field Granaries"
    text: "Farmers never walk to drop off food: it goes straight to your stockpile."
    # AoE2's Khmer farmer bonus, resource 96 (No Dropsite Farmers) = 1. Unverified in Return of Rome.
    effects: [{type: modify_resource, tribute_list: 96, operation: SET, quantity: 1}]

missions:
  01_hunting:
    rewards: [preserved_meat, town_hearth]
    bonus:
      - text: "Stockpile 500 food."
        conditions: [{type: accumulate_attribute, attribute: 0, quantity: 500}]
        setup:
          # Moderate and Hard: predators. Three lions on the open land east, south-west and north, two more
          # crocodiles by the west and east shores (the map has one, at 12,10; the Town Center is at 23,22).
          - {type: create_object, source_player: 0, object_list_unit_id: 1029, location_x: 38, location_y: 20}
          - {type: create_object, source_player: 0, object_list_unit_id: 1029, location_x: 10, location_y: 31}
          - {type: create_object, source_player: 0, object_list_unit_id: 1029, location_x: 32, location_y: 8}
          - {type: create_object, source_player: 0, object_list_unit_id: 1031, location_x: 3, location_y: 17}
          - {type: create_object, source_player: 0, object_list_unit_id: 1031, location_x: 42, location_y: 27}
        rewards: [granary_stores, bountiful_land]
      - text: "Hunt the elephant."
        conditions: [{type: own_fewer_objects, source_player: 0, object_list: 1301, quantity: 0}]
        setup:
          # Hard: the island's one elephant (at 32,1) gets 120 hit points instead of 45, and 5 melee and 5 pierce
          # armour (balance, user 2026-11-08): the hunters' 4-damage spears do the game's minimum.
          - {type: modify_attribute, source_player: 0, object_list_unit_id: 1301, object_attributes: 0,
             operation: ADD, quantity: 75}
          - {type: modify_attribute, source_player: 0, object_list_unit_id: 1301, object_attributes: 8,
             operation: ADD, armour_attack_class: 4, armour_attack_quantity: 5}
          - {type: modify_attribute, source_player: 0, object_list_unit_id: 1301, object_attributes: 8,
             operation: ADD, armour_attack_class: 3, armour_attack_quantity: 5}
        rewards: [hardened_hunters, swift_hunters]
  02_foraging:
    rewards: [cheap_housing, quick_builders]
    bonus:
      - text: "Stockpile 500 wood."
        conditions: [{type: accumulate_attribute, attribute: 1, quantity: 500}]
        setup:
          # Moderate and Hard: no forage; fish in the river instead, either side of the crossings.
          # (removing by unit type over the map left them in place; select names the placed bushes)
          - {type: remove_object, select: {player: 0, unit: 59}}
          - {type: create_object, source_player: 0, object_list_unit_id: 455, location_x: 6, location_y: 29}
          - {type: create_object, source_player: 0, object_list_unit_id: 456, location_x: 11, location_y: 29}
          - {type: create_object, source_player: 0, object_list_unit_id: 457, location_x: 2, location_y: 32}
          - {type: create_object, source_player: 0, object_list_unit_id: 458, location_x: 29, location_y: 23}
          - {type: create_object, source_player: 0, object_list_unit_id: 455, location_x: 29, location_y: 29}
          - {type: create_object, source_player: 0, object_list_unit_id: 456, location_x: 34, location_y: 30}
          - {type: create_object, source_player: 0, object_list_unit_id: 457, location_x: 44, location_y: 29}
          - {type: create_object, source_player: 0, object_list_unit_id: 458, location_x: 43, location_y: 31}
        rewards: [master_fishers, timber_discount]
      - text: "Have 4 fishing boats."
        conditions: [{type: own_objects, object_group: 21, quantity: 4}]
        setup:
          # Hard: no starting resources (the upgrades still add theirs: they run after this). No crocodiles: the
          # user dropped them after playtests (they'd be food anyway).
          - {type: modify_resource, tribute_list: 0, operation: SET, quantity: 0}
          - {type: modify_resource, tribute_list: 1, operation: SET, quantity: 0}
          - {type: modify_resource, tribute_list: 2, operation: SET, quantity: 0}
          - {type: modify_resource, tribute_list: 3, operation: SET, quantity: 0}
        rewards: [light_footprint, swift_woodcutters]
  03_discoveries:
    rewards: [charted_lands, watchful_homes]
    bonus:
      - text: "Defeat the Libyans."
        conditions:
          - {type: own_fewer_objects, source_player: 2, object_group: 6, quantity: 0}
          - {type: own_fewer_objects, source_player: 2, object_group: 47, quantity: 0}
        setup:
          # Moderate and Hard: three more Clubmen with the Libyans in the south-west, another Scout in the north.
          - {type: create_object, source_player: 2, object_list_unit_id: 281, location_x: 16, location_y: 29}
          - {type: create_object, source_player: 2, object_list_unit_id: 281, location_x: 18, location_y: 29}
          - {type: create_object, source_player: 2, object_list_unit_id: 281, location_x: 16, location_y: 31}
          - {type: create_object, source_player: 2, object_list_unit_id: 448, location_x: 38, location_y: 6}
        rewards: [early_riders, woodland_bows]
      - text: "Lose no units."
        # Complete with the main objective, unless a unit was lost first.
        conditions: [{type: variable_value, variable: "RI primary", comparison: EQUAL, quantity: 1}]
        fail:
          - {type: accumulate_attribute, attribute: 154, quantity: 1}
          - {type: accumulate_attribute, attribute: 226, quantity: 1}
          - {type: accumulate_attribute, attribute: 227, quantity: 1}
        setup:
          # Hard: the Libyans have Axemen (no Storage Pit upgrades: balance, user 2026-11-08).
          - {type: research_technology, source_player: 2, technology: 63, force_research_technology: 1}
        rewards: [founding_families, seasoned_gear]
  04_the_dawn_of_a_new_age:
    players: [{number: 2, name: "Raiders", civ: EGYPTIAN}]
    units:
      # Raiders guarding the elephants: 2 Clubmen and a Bowman in the north, 2 Clubmen and a Scout in the
      # south-west (Moderate and Hard), and a Bowman more at each on Hard. On the map from the start: created by
      # a trigger they were defeated before they appeared (playtest, 2026-11-08).
      - {player: 2, hp: 40, unit: 281, x: 22, y: 8, from: moderate, group: north}
      - {player: 2, hp: 40, unit: 281, x: 24, y: 8, from: moderate, group: north}
      - {player: 2, hp: 35, unit: 4, x: 23, y: 7, from: moderate, group: north}
      - {player: 2, hp: 35, unit: 4, x: 25, y: 7, from: hard, group: north}
      - {player: 2, hp: 40, unit: 281, x: 8, y: 37, from: moderate, group: southwest}
      - {player: 2, hp: 40, unit: 281, x: 8, y: 39, from: moderate, group: southwest}
      - {player: 2, hp: 60, unit: 448, x: 9, y: 38, from: moderate, group: southwest}
      - {player: 2, hp: 35, unit: 4, x: 9, y: 36, from: hard, group: southwest}
      # More fish (250 food each) in open water near the shores: food ran short after fighting the Raiders.
      - {player: 0, unit: 457, x: 39, y: 1}
      - {player: 0, unit: 457, x: 42, y: 9}
      - {player: 0, unit: 457, x: 34, y: 14}
      - {player: 0, unit: 457, x: 37, y: 25}
      - {player: 0, unit: 457, x: 35, y: 36}
      - {player: 0, unit: 457, x: 33, y: 41}
      - {player: 0, unit: 457, x: 1, y: 43}
      - {player: 0, unit: 457, x: 38, y: 43}
      - {player: 0, unit: 457, x: 43, y: 45}
    # What can be built comes from the campaign's tech tree (unlocks); the Raiders join the main objective from
    # Moderate (the user, 2026-11-08: no hiding behind buildings while advancing).
    primary_extra:
      text: "Defeat the Raiders."
      from: moderate
      conditions:
        # Their soldiers: Clubmen/Axemen (class 6), Bowmen (0), Scouts (47).
        - {type: own_fewer_objects, source_player: 2, object_group: 6, quantity: 0}
        - {type: own_fewer_objects, source_player: 2, object_group: 0, quantity: 0}
        - {type: own_fewer_objects, source_player: 2, object_group: 47, quantity: 0}
    rewards: [swift_advance, free_town_center]
    bonus:
      - text: "Reach a population of 25 with 2 Docks."
        conditions:
          - {type: accumulate_attribute, attribute: 11, quantity: 25}
          - {type: variable_value, variable: "RI docks", comparison: LARGER_OR_EQUAL, quantity: 2}
        triggers:
          # Docks change unit with each age: count them all.
          - name: count docks
            looping: true
            effects:
              - {type: count_units_into_variable, object_list_unit_id: 45, variable2: "RI docks a"}
              - {type: count_units_into_variable, object_list_unit_id: 133, variable2: "RI docks b"}
              - {type: count_units_into_variable, object_list_unit_id: 47, variable2: "RI docks c"}
              - {type: modify_variable_by_variable, variable: "RI docks", operation: SET, variable2: "RI docks a"}
              - {type: modify_variable_by_variable, variable: "RI docks", operation: ADD, variable2: "RI docks b"}
              - {type: modify_variable_by_variable, variable: "RI docks", operation: ADD, variable2: "RI docks c"}
        rewards: [master_fishermen, quartermasters]
      - text: "Reach the Bronze Age."
        conditions: [{type: accumulate_attribute, attribute: 6, quantity: 2}]
        setup:
          # Hard: the Raiders have Axemen and Tool Working, no armour (balance, user 2026-11-08; their extra Bowmen
          # are mission units).
          # The Bronze Age opens without its two Tool Age buildings (tech 75 granted); the Whales' gold pays for it.
          - {type: research_technology, source_player: 2, technology: [63, 46], force_research_technology: 1}
          - {type: enable_disable_technology, technology: 102, enabled: 1}
          - {type: research_technology, technology: 75, force_research_technology: 1}
        triggers:
          # A minute after the player's first age-up the northern group attacks the Town Center, the south-west group
          # a minute later. A group that's attacked, or loses a unit, attacks at once (only that group). They have
          # no AI, so their attack-move order is given again every 10 seconds (after a fight they stood idle), and
          # they see the player's town. A group attacks once: "RI <group> out" keeps a later cue from sending it
          # again.
          - name: aged
            conditions: [{type: accumulate_attribute, attribute: 6, quantity: 1}]
            effects: [{type: activate_trigger, trigger_id: "@first wave wait"}]
          - name: first wave wait
            conditions: [{type: timer, timer: 60}]
            effects:
              - {type: activate_trigger, trigger_id: "@north attack"}
              - {type: activate_trigger, trigger_id: "@second wave wait"}
          - name: second wave wait
            conditions: [{type: timer, timer: 60}]
            effects: [{type: activate_trigger, trigger_id: "@southwest attack"}]
          - name: north provoked
            conditions:
              # object_attacked's player is most likely the attacker: with the Raiders there it never fired (playtest
              # 2026-11-08). Backed up by "hurt" (hit points below full) and "killed".
              - {type: object_attacked, select: {group: north}, source_player: 1, quantity: 1}
              - {type: or}
              - {type: object_hp, select: {group: north}, comparison: LESS, quantity: full}
              - {type: or}
              - {type: destroy_object, select: {group: north}}
            effects: [{type: activate_trigger, trigger_id: "@north attack"}]
          - name: southwest provoked
            conditions:
              # object_attacked's player is most likely the attacker: with the Raiders there it never fired (playtest
              # 2026-11-08). Backed up by "hurt" (hit points below full) and "killed".
              - {type: object_attacked, select: {group: southwest}, source_player: 1, quantity: 1}
              - {type: or}
              - {type: object_hp, select: {group: southwest}, comparison: LESS, quantity: full}
              - {type: or}
              - {type: destroy_object, select: {group: southwest}}
            effects: [{type: activate_trigger, trigger_id: "@southwest attack"}]
          - name: north attack
            conditions: [{type: variable_value, variable: "RI north out", comparison: EQUAL, quantity: 0}]
            effects:
              - {type: change_variable, variable: "RI north out", operation: SET, quantity: 1}
              - {type: deactivate_trigger, trigger_id: "@north provoked"}
              - {type: set_player_visibility, source_player: 2, target_player: 1, visibility_state: VISIBLE}
              - {type: attack_move, select: {group: north}, location_x: 28, location_y: 26}
              - {type: display_instructions, display_time: 8, message: "Raiders from the north are coming for your Town Center!"}
              - {type: activate_trigger, trigger_id: "@push north"}
          - name: southwest attack
            conditions: [{type: variable_value, variable: "RI southwest out", comparison: EQUAL, quantity: 0}]
            effects:
              - {type: change_variable, variable: "RI southwest out", operation: SET, quantity: 1}
              - {type: deactivate_trigger, trigger_id: "@southwest provoked"}
              - {type: set_player_visibility, source_player: 2, target_player: 1, visibility_state: VISIBLE}
              - {type: attack_move, select: {group: southwest}, location_x: 28, location_y: 26}
              - {type: display_instructions, display_time: 8, message: "Raiders from the south-west are coming for your Town Center!"}
              - {type: activate_trigger, trigger_id: "@push southwest"}
          - name: push north
            conditions: [{type: timer, timer: 10}]
            effects:
              - {type: attack_move, select: {group: north}, location_x: 28, location_y: 26}
              - {type: activate_trigger, trigger_id: "@push north"}
          - name: push southwest
            conditions: [{type: timer, timer: 10}]
            effects:
              - {type: attack_move, select: {group: southwest}, location_x: 28, location_y: 26}
              - {type: activate_trigger, trigger_id: "@push southwest"}
        rewards: [resource_mastery, nile_arsenal]
  05_skirmish:
    # Mission 5: your 4 Axemen and 3 Bowmen around 20,23 against the Egyptian Raiders' 3 Axemen and 3 Bowmen in the
    # south-east (46,46 to 65,61). No Town Center. Water fills the north-east corner (x 46+, y 0-28); the beach
    # nearest your army is around 47,20.
    units:
      # Moderate and Hard: the Raiders' chieftain, a Short Swordsman (60 hit points).
      - {player: 2, unit: 74, x: 58, y: 51, from: moderate, group: chieftain}
    ai:
      # Red's AI sends the landing party (Hard): the units the ship drops near 47,20, hunted at your closest unit
      # and re-ordered every 10 seconds while one lives (the trigger "land" sends AI Script Goal 7).
      2:
        raids: [{units: [SLINGER, AXEMAN], count: 3, min: 1, start: {trigger: 7}, near: {x: 47, y: 20, radius: 5}}]
    rewards: [keen_eyes, field_dressing]
    bonus:
      - text: "Slay the Raider chieftain."
        conditions: [{type: destroy_object, select: {group: chieftain}}]
        setup:
          - {type: change_object_name, select: {group: chieftain}, message: "Raider Chieftain"}
        rewards: [bronze_tipped_arrows, hardy_warriors]
      - text: "Lose no more than 2 units."
        # Complete with the main objective, unless a third unit was lost first.
        conditions: [{type: variable_value, variable: "RI primary", comparison: EQUAL, quantity: 1}]
        fail:
          - {type: accumulate_attribute, attribute: 154, quantity: 3}
        triggers:
          # Hard: a countdown line in the objectives, then at 3:30 a Raider ship (theirs, red) appears in the
          # north-east water corner, sails to the beach near 47,20 (about 1:30), drops 2 Slingers and an Axeman and
          # sails back out of sight. Only if the Raiders aren't defeated yet: they're the main objective's enemy,
          # so you can win before it comes. The Raiders see the whole map.
          # The countdown counts in trigger time, which keeps game time at any speed: the game's Display Timer
          # doesn't (at high speed it still showed 222 s when the ship landed at 6:34, the user, 2026-11-08).
          # The landing party is sent by red's own AI (a raid, `ai` below): ordered by triggers, red's AI took the
          # units back ("they move left a bit and then give up", 2026-11-08). The trigger order stays as a start.
          - name: countdown
            effects:
              - {type: change_variable, variable: "RI landing", operation: SET, quantity: 300}
              - {type: display_instructions, display_time: 10, message: "Raiders are sailing in from the north-east: they land in 5 minutes."}
              - {type: modify_resource, source_player: 2, tribute_list: 203, operation: SET, quantity: 2}
              - {type: activate_trigger, trigger_id: "@tick"}
              - {type: activate_trigger, trigger_id: "@ashore"}
              - {type: activate_trigger, trigger_id: "@launch"}
          - name: tick
            conditions:
              - {type: timer, timer: 5}
              - {type: variable_value, variable: "RI landing", comparison: LARGER, quantity: 0}
            effects:
              - {type: change_variable, variable: "RI landing", operation: SUBTRACT, quantity: 5}
              - {type: activate_trigger, trigger_id: "@tick"}
          - name: ashore
            objective: "A Raider ship lands in about <RI landing> seconds."
            conditions: [{type: variable_value, variable: "RI landing", comparison: EQUAL, quantity: 0}]
          - name: launch
            conditions:
              - {type: timer, timer: 210}
              - {type: variable_value, variable: "RI primary", comparison: EQUAL, quantity: 0}
            effects:
              - {type: create_object, source_player: 2, object_list_unit_id: 545, location_x: 69, location_y: 2}
              - {type: task_object, source_player: 2, object_list_unit_id: 545, area_x1: 64, area_y1: 0, area_x2: 71,
                 area_y2: 7, location_x: 49, location_y: 20}
              - {type: display_instructions, display_time: 8, message: "A Raider ship is heading for the shore!"}
              - {type: activate_trigger, trigger_id: "@land"}
          - name: land
            conditions: [{type: objects_in_area, source_player: 2, object_list: 545, area_x1: 47, area_y1: 17,
                          area_x2: 52, area_y2: 23, quantity: 1}]
            effects:
              - {type: create_object, source_player: 2, object_list_unit_id: 7, location_x: 47, location_y: 19}
              - {type: create_object, source_player: 2, object_list_unit_id: 7, location_x: 47, location_y: 21}
              - {type: create_object, source_player: 2, object_list_unit_id: 531, location_x: 47, location_y: 20}
              - {type: attack_move, source_player: 2, area_x1: 44, area_y1: 16, area_x2: 50, area_y2: 24,
                 target: {player: 1, unit: [531, 4]}}
              # red's AI takes the landing party (raid on AI Script Goal 7) and hunts your units with it
              - {type: ai_script_goal, ai_script_goal: 7}
              - {type: change_variable, variable: "RI landing", operation: SET, quantity: 0}
              - {type: task_object, source_player: 2, object_list_unit_id: 545, area_x1: 46, area_y1: 15, area_x2: 53,
                 area_y2: 25, location_x: 69, location_y: 2}
              - {type: activate_trigger, trigger_id: "@sail away"}
          - name: sail away
            conditions: [{type: objects_in_area, source_player: 2, object_list: 545, area_x1: 64, area_y1: 0,
                          area_x2: 71, area_y2: 7, quantity: 1}]
            effects:
              - {type: remove_object, source_player: 2, object_list_unit_id: 545, area_x1: 64, area_y1: 0,
                 area_x2: 71, area_y2: 7}
        rewards: [battle_drill, shield_wall]
  06_farming:
    # Mission 6: you (Upper Egypt) start at 32,58 with a Town Center, Barracks, Granary, 3 Villagers and 3 Clubmen;
    # Lower Egypt (red) at 46,14 with a Town Center, Barracks, Dock, 3 Villagers and 4 Axemen. A river winds
    # across the map with 8 fish; no gold or stone mines (red has its 200 stone; the Market trades). Your
    # objectives: the Ruin at 10,14 and 800 food.
    # Red's original win (2000 food) is gone: it wins only by destroying you (the user, 2026-11-08).
    drop_objectives: [2]
    setup:
      # Slingers are yours, not red's (the user, 2026-11-08): the tech tree unlocks them for both.
      - {type: enable_disable_object, source_player: 2, object_list_unit_id: 7, enabled: 0}
    rewards: [free_farms, market_day]
    bonus:
      - text: "Stockpile 200 stone."
        conditions: [{type: accumulate_attribute, attribute: 2, quantity: 200}]
        rewards: [slinger_corps, builders_tithe]
      - text: "Lose no Villagers or Fishing Boats."
        # Complete with the main objective, unless one was lost first: every second the count of your villagers
        # (class 4) and fishing boats (class 21) is compared with the second before. A loss and a new one in the
        # same second would cancel out.
        conditions: [{type: variable_value, variable: "RI primary", comparison: EQUAL, quantity: 1}]
        fail:
          - {type: compare_variables, variable: "RI civilians", comparison: LESS, variable2: "RI civilians before"}
        triggers:
          - name: count
            conditions: [{type: timer, timer: 1}]
            effects:
              - {type: modify_variable_by_variable, variable: "RI civilians before", operation: SET,
                 variable2: "RI civilians"}
              - {type: count_units_into_variable, object_group: 4, variable2: "RI civilians"}
              - {type: count_units_into_variable, object_group: 21, variable2: "RI boats"}
              - {type: modify_variable_by_variable, variable: "RI civilians", operation: ADD, variable2: "RI boats"}
              - {type: activate_trigger, trigger_id: "@count"}
          - name: start counting
            effects:
              - {type: activate_trigger, trigger_id: "@count"}
        rewards: [war_fleet, field_granaries]
    # Red's AI per difficulty (the user's plan, 2026-11-08), written for this mission instead of the original
    # build list. The tech tree holds for red too, so a step it can't take is skipped, not worked around.
    #   Standard: a small economy, 5 Axemen and 3 Bowmen, 1 warship and no other ships; never attacks by itself
    #     (it still fights what comes near).
    #   Moderate: the same ships; upgrades; a 20-unit army; attacks now and then with 5 units, never before 3:00.
    #   Hard: 3 warships kept up, 5 fishing boats that are never replaced (no farming its resources by killing
    #     them), towards 100 population; raiding parties of 5 Scouts at your villagers and massive attacks of 20 or
    #     more; upgrades as soon as a defence of 8 stands at home.
    ai:
      2:
        replace: true
        name: Lower Egypt
        step_timeout: 120
        scout: false
        build_order:
          - {build: STORAGE_PIT}
          - {build: GRANARY}
          - {build: MARKET}
          - {build: FARM, count: 3}
          - {research: BATTLE_AXE}
          - {build: ARCHERY_RANGE}
        levels:
          easy:
            villagers: 10
            keep:
              - {train: AXEMAN, count: 5}
              - {train: BOWMAN, count: 3}
              - {train: SCOUT_SHIP, count: 1}
              - {build: FARM, count: 4}
          normal:
            villagers: 18
            keep:
              - {train: AXEMAN, count: 10}
              - {train: BOWMAN, count: 10}
              - {train: SCOUT_SHIP, count: 1}
              - {build: FARM, count: 7}
              - {research: TOOLWORKING}
              - {research: LEATHER_ARMOR_FOR_INFANTRY}
              - {research: LEATHER_ARMOR_FOR_ARCHERS}
              - {research: DOMESTICATION}
              - {research: WOODWORKING}
            attack: {first: 180, every: 300, min_group: 5, max_group: 5, percent: 100}
          hard:
            villagers: 40
            keep:
              - {build: BARRACKS, count: 2}
              - {build: ARCHERY_RANGE, count: 2}
              - {build: STABLE}
              - {train: AXEMAN, count: 22}
              - {train: BOWMAN, count: 20}
              - {train: SCOUT, count: 8}
              - {train: SCOUT_SHIP, count: 3}
              - {train: FISHING_BOAT, count: 5, lifetime: true}
              - {build: FARM, count: 14}
              - {research: TOOLWORKING, when: {soldiers: 8}}
              - {research: LEATHER_ARMOR_FOR_INFANTRY, when: {soldiers: 8}}
              - {research: LEATHER_ARMOR_FOR_ARCHERS, when: {soldiers: 8}}
              - {research: LEATHER_ARMOR_FOR_CAVALRY, when: {soldiers: 8}}
              - {research: DOMESTICATION, when: {soldiers: 8}}
              - {research: WOODWORKING, when: {soldiers: 8}}
            raids:
              - {units: [SCOUT], count: 5, first: 360, every: 180, target: villagers}
            attack: {first: 720, every: 360, min_group: 20, max_group: 25, percent: 100, naval: true}
