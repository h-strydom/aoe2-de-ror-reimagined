# Ascent of Egypt, reimagined: bonus objectives by difficulty and the upgrades they unlock (progression.py).
#
# upgrades: this campaign's permanent upgrades: label (short, the popup button), text (what it does, listed on
#   the mission's Scouts page with the other choices it offers). Once picked, an upgrade's effects (aoe-agent-editor trigger effects,
#   for the human player unless they say otherwise) run at the start of every mission of the campaign. An effect
#   whose object_list_unit_id lists several units runs once per unit.
# unlocks.<NN_mission>: [name, ...]   the campaign's tech tree: every mission starts with everything off but what
#   it and earlier missions unlock (names from ror_tech_tree.yaml); perks bring extras or bring things early.
#   Missions after the last one listed keep the original's settings until they're designed.
# missions.<NN_mission>:
#   setup: [...]                  effects on every difficulty (the mission's own rules: what can be built...)
#   players: [{number, name, civ}]  players the mission adds: enemies of all, no AI, moved by triggers
#   primary_extra: {text, from, conditions}   a line the main objective gains from a difficulty up (End Mission
#                                 waits for it too)
#   units: [{player, unit, x, y, from, group, hp}]   units on the map from the start; `from: moderate|hard` removes
#                                 them from easier games; `group` names them for `select: {group: name}`
#   rewards: [upgrade, upgrade]   the choice offered on completing the primary objective
#   bonus:                        Moderate shows the first, Hard both
#     - text: ...                 the to-do line (shown as optional)
#       conditions: [...]         trigger conditions, all met at once (source_player is the human unless given)
#       setup: [...]              effects that change the mission on the difficulties that show this objective
#       triggers: [{name, looping, conditions, effects}]   its own triggers, on with the objective ("@name": a
#                                 sibling)
#       fail: [condition, ...]    each one alone fails the objective
#       rewards: [upgrade, upgrade]
#
# Tiers: the primary objective's choice is a quality-of-life upgrade, the Moderate bonus a good buff, the Hard
# bonus a great one.
#
# Unit ids and stats are RoR's (empires2_x2_p1.dat, read with genieutils, 2026-11-07): Town Centers 109/71/141/142
# hold 4 population in their first storage; Gazelle 22 (150 food), Gazelle King 163, Elephant 1301 (45 HP, 10
# attack, no armour, 300 food), Elephant King 333, Lion 1029 (20 HP), Crocodile 1031 (20 HP, 4 attack), Crocodile
# King 200, bears 486/2089/2090, fish 53/69/455-459, berry bushes 302/1053/1054/2733. Villagers are object class 4
# (Civilian) and attack in class 4 (melee, the hunters' spears too); hunters are units 122 (male) and 216 (female).
# Drop-off points are a per-villager list in the data that no trigger can change, so "food can be dropped off at
# Houses" isn't possible (swapped for faster hunting).
#
# Mission 2: Houses are 70/463/464/465 (30 wood); builders 118/212, woodcutters 123/218; every villager unit
# type (object class 4) costs 1 population, and RoR's own Logistics tech halves infantry by setting each unit's
# population (attribute 110, negative = takes population) to -0.5. RoR's only fishing upgrade is the Fishing Ship
# (tech 4, Bronze Age; Fishing Boat 13 -> Fishing Ship 15, both object class 21). Forage bushes are unit 59 (150
# food); fish 455-458 (250 food). The Foraging map's river runs across rows 21-37 with shallow crossings at x 14-25
# and 33-41 (terrain 4); the Town Center is at 22,18.
#
# Mission 3: Reveal Map is a player resource (203: 1 explored, 2 everything visible; verified in game). The Libyans (player 2, red) start
# with 2 Clubmen (281, class 6) at 15,33 and 13,31 and a Scout (448, class 47) at 39,4, and no buildings. Axe (tech
# 63) turns Clubmen into Axemen; the Storage Pit's first upgrades are Tool Working (46) and Leather Armor for
# soldiers, archers and mounted units (40, 41, 42), all Tool Age. Stable is 101, Bowman 4 (40 food, 20 wood).
# Villagers train as 83/293 (50 food, 20 s); Villager Population is resource 38. Units lost: Killed By Others
# (154), and villagers killed by Gaia or animals (226, 227).
#
# Mission 4: only the player (Town Center at 28,26), elephants at 22,10 and 6,38, and 3 Whales (2625) that hold
# 1,000 gold each. The Bronze Age (102) needs tech 75, granted by any two of Market/Archery Range/Stable (Tool Age
# buildings). Egypt can't have the Catapult (tech 54, Stone Thrower 280 -> 550), Heavy Catapult (36), Phalangite
# (Phalanx, 73) or Armored Elephant (125). Farm 50; walls 72/117/119/155; towers 79/234/235/236; Archery Range
# 87/10/14; Stable 101/86/153; Barracks 12/498/132/20; Docks 45/133/47/51; Town Centers 109/71/141/142 (200 wood).
# Gatherers: forager 120/354, hunter 122/216, farmer 259/214, fisherman 56/57, shepherd 590/592, Fishing Boat/Ship
# 13/15, woodcutter 123/218, gold miner 579/581/2333/2334, stone miner 124/220. Storage Pit: Tool Working 46,
# Leather Armor 40/41/42 (Tool), Scale Armor 43/44/45 and Metal Working 51 (Bronze).
#
# Verified in game (2026-11-07): the Hunting upgrades and setups all work, Animal Decay Prevention (resource 292)
# included; the forced Fishing Ship research works in the Stone Age. Unverified: villagers at 0 population.

unlocks:
  01_hunting: [house, villager]
  02_foraging: [granary, storage_pit, dock, fishing_boat]
  03_discoveries: []
  04_the_dawn_of_a_new_age: [tool_age, toolworking, leather_armor_for_infantry, leather_armor_for_archers,
                             leather_armor_for_cavalry, barracks, clubman]
  05_skirmish: [archery_range, bowman, axeman, stable, scout]
  06_farming: [market, domestication, woodworking, gold_mining, stone_mining, slinger, scout_ship, farm]
  # A normal Bronze Age without the Temple (the user, 2026-11-08): the rest of the Tool Age, then the Bronze Age's
  # buildings, units and techs (ages from RoR's data: each tech's required age techs).
  07_trade: [city_watch, light_transport, watch_tower, small_wall, small_gate, bronze_age, government_center,
             town_center, siege_workshop, academy, sentry_tower, medium_wall, medium_gate, architecture, artisanship,
             wheel, plow, writing, urbanization, logistics, nobility, metalworking, bronze_shield,
             scale_armor_for_infantry, scale_armor_for_archers, scale_armor_for_cavalry, short_swordsman,
             broad_swordsman, hoplite, cavalry, chariot, chariot_archer, camel_rider, improved_bow, improved_bowman,
             composite_bowman, stone_thrower, war_galley, fishing_ship, trade_boat, merchant_ship, trade_cart]
  # The Temple, the Priest and the Bronze Age Temple techs (the user, 2026-11-08); the Iron Age ones stay locked.
  08_religion: [temple, priest, mysticism, astrology, polytheism]

upgrades:
  # Hunting, primary (quality of life)
  preserved_meat:
    label: "Preserved Meat"
    text: "Hunted animals no longer lose food over time."
    effects: [{type: modify_resource, tribute_list: 292, operation: SET, quantity: 1}]
  town_hearth:
    label: "Town Hearth"
    text: "Town Centers support 5 more population."
    effects: [{type: modify_attribute, object_list_unit_id: [109, 71, 141, 142], object_attributes: 21,
               operation: ADD, quantity: 5}]
  # Hunting, Moderate bonus (good)
  granary_stores:
    label: "Granary Stores"
    text: "+500 food at the start of every mission."
    effects: [{type: modify_resource, tribute_list: 0, operation: ADD, quantity: 500}]
  bountiful_land:
    label: "Bountiful Land"
    text: "Wild animals, fish and berry bushes hold 50 more food (farms excluded)."
    effects:
      # the animals, fish and bushes on the map (Gaia's), each object (a change to the unit type as well might add
      # the 50 twice to objects already placed)
      - {type: modify_object_attribute, source_player: 0, object_attributes: 21, operation: ADD, quantity: 50,
         object_list_unit_id: [22, 163, 1301, 333, 1029, 1031, 200, 486, 2089, 2090, 53, 69, 455, 456, 457, 458,
                               459, 302, 1053, 1054, 2733]}
  # Hunting, Hard bonus (great)
  hardened_hunters:
    label: "Hardened Hunters"
    # Balance (user, 2026-11-08): armour instead of +3 attack.
    text: "Villagers have 30 more hit points and 1 more melee and pierce armour."
    effects:
      - {type: modify_attribute_for_class, object_group2: 4, object_attributes: 0, operation: ADD, quantity: 30}
      - {type: modify_attribute_for_class, object_group2: 4, object_attributes: 8, operation: ADD,
         armour_attack_class: 4, armour_attack_quantity: 1}
      - {type: modify_attribute_for_class, object_group2: 4, object_attributes: 8, operation: ADD,
         armour_attack_class: 3, armour_attack_quantity: 1}
  swift_hunters:
    label: "Swift Hunters"
    text: "Hunters gather food twice as fast."
    effects: [{type: modify_attribute, object_list_unit_id: [122, 216], object_attributes: 13,
               operation: MULTIPLY, quantity: 2}]

  # Foraging, primary (quality of life)
  cheap_housing:
    label: "Cheap Housing"
    text: "Houses cost 10 wood."
    effects: [{type: modify_attribute, object_list_unit_id: [70, 463, 464, 465], object_attributes: 104,
               operation: SET, quantity: 10}]
  quick_builders:
    label: "Quick Builders"
    text: "Villagers build 20% faster."
    effects: [{type: modify_attribute, object_list_unit_id: [118, 212], object_attributes: 13,
               operation: MULTIPLY, quantity: 1.2}]
  # Foraging, Moderate bonus (good)
  master_fishers:
    label: "Master Fishers"
    text: "Start every mission with the Fishing Ship upgrade: Fishing Boats become Fishing Ships."
    effects: [{type: research_technology, technology: 4, force_research_technology: 1}]
  timber_discount:
    label: "Timber Discount"
    text: "Buildings other than Houses cost 50 less wood."
    effects: [{type: modify_attribute, object_attributes: 104, operation: ADD, quantity: -50, object_list_unit_id: [
      12, 498, 132, 20,         # Barracks
      87, 10, 14,               # Archery Range
      103, 105, 18, 19,         # Academy
      104, 30, 31, 32,          # Temple
      45, 133, 47, 51,          # Dock
      49, 150,                  # Siege Workshop
      68, 129, 130, 131,        # Granary
      562, 563, 564, 565,       # Storage Pit
      84, 116, 137,             # Market
      101, 86, 153,             # Stable
      109, 71, 141, 142,        # Town Center
      209, 210]}]               # Government Center
  # Foraging, Hard bonus (great)
  light_footprint:
    # Half a space (-0.5, as RoR's Logistics does for infantry) had no effect in game: the trigger effect reads
    # population as a whole number (playtest 2026-11-07). So no space at all.
    label: "Light Footprint"
    # Balanced by the price: villagers (trained as 83 and 293) cost 75 food instead of 50.
    text: "Villagers take no population space, but cost 75 food."
    effects:
      - {type: modify_attribute, object_attributes: 110, operation: SET, quantity: 0, object_list_unit_id: [
         83, 293, 56, 57, 118, 120, 122, 123, 124, 156, 206, 212, 214, 216, 218, 220, 222, 259, 354, 579, 581, 590,
         592, 1891, 1892, 2333, 2334]}
      - {type: modify_attribute, object_attributes: 103, operation: SET, quantity: 75, object_list_unit_id: [83, 293]}
  swift_woodcutters:
    label: "Swift Woodcutters"
    text: "Woodcutters gather wood twice as fast."
    effects: [{type: modify_attribute, object_list_unit_id: [123, 218], object_attributes: 13,
               operation: MULTIPLY, quantity: 2}]
  # Discoveries, primary (quality of life)
  charted_lands:
    label: "Charted Lands"
    text: "Every mission starts with the whole map explored."
    effects: [{type: modify_resource, tribute_list: 203, operation: SET, quantity: 1}]
  watchful_homes:
    # Replaces All-Seeing (Reveal Map 2): in game that showed everything, too strong for the quality-of-life pick.
    label: "Watchful Homes"
    text: "Houses see 20 tiles."
    effects: [{type: modify_attribute, object_list_unit_id: [70, 463, 464, 465], object_attributes: 1,
               operation: SET, quantity: 20}]
  # Discoveries, Moderate bonus (good)
  early_riders:
    label: "Early Riders"
    text: "The Stable and Scouts are available from the Stone Age."
    effects:
      # Perks trump a mission's own settings: this enables them even where a mission disables the Stable.
      - {type: enable_disable_object, object_list_unit_id: [101, 448], enabled: 1}
  woodland_bows:
    label: "Woodland Bows"
    text: "Bowmen cost 60 wood and no food."
    effects:
      - {type: modify_attribute, object_list_unit_id: 4, object_attributes: 103, operation: SET, quantity: 0}
      - {type: modify_attribute, object_list_unit_id: 4, object_attributes: 104, operation: SET, quantity: 60}
  # Discoveries, Hard bonus (great)
  founding_families:
    label: "Founding Families"
    # Balance (user, 2026-11-08): every villager trains instantly, at the usual price. Before: the first 5 (then
    # 10) free and instant, but how many came free depended on how fast you clicked.
    text: "Villagers train instantly."
    # 1 second, not 0 (see swift_advance). Villagers 83 and 293.
    effects: [{type: modify_attribute, object_list_unit_id: [83, 293], object_attributes: 101, operation: SET,
               quantity: 1}]
  seasoned_gear:
    label: "Seasoned Gear"
    text: "Tool Working and the three Leather Armor upgrades are researched at the start of every mission."
    effects: [{type: research_technology, technology: [46, 40, 41, 42], force_research_technology: 1}]
  # Dawn of a New Age, primary (quality of life)
  swift_advance:
    label: "Swift Advance"
    text: "Advancing to the next age is instant (it still costs the same)."
    # 1 second: with 0 the game put the player straight into the Bronze Age (Egypt 4 playtest, 2026-11-08);
    # a 0 research time seemingly lets it complete on its own. Unverified that 1 fixes it.
    effects: [{type: change_technology_research_time, technology: [101, 102, 103], quantity: 1}]
  free_town_center:
    label: "Free Town Center"
    text: "Each mission, your first new Town Center costs nothing. Town Centers can be built from the Bronze Age."
    # Villagers build the RTWC units (621 Stone, 617 Tool, 484 Bronze, 597 Iron), which normally need a Government
    # Center ("shadow gb->tc", tech 115): the price is theirs. Perks trump the mission: from the Bronze Age this
    # enables them even where a mission disables them (Egypt 4).
    effects:
      # Count the Town Centers now (every age's, built and buildable kinds: which one a finished Town Center is
      # isn't pinned down), remember the price, build the next one for free.
      - {type: count_units_into_variable, object_list_unit_id: 109, variable2: "RI tc a"}
      - {type: count_units_into_variable, object_list_unit_id: 71, variable2: "RI tc b"}
      - {type: count_units_into_variable, object_list_unit_id: 141, variable2: "RI tc c"}
      - {type: count_units_into_variable, object_list_unit_id: 142, variable2: "RI tc d"}
      - {type: count_units_into_variable, object_list_unit_id: 621, variable2: "RI tc e"}
      - {type: count_units_into_variable, object_list_unit_id: 617, variable2: "RI tc f"}
      - {type: count_units_into_variable, object_list_unit_id: 484, variable2: "RI tc g"}
      - {type: count_units_into_variable, object_list_unit_id: 597, variable2: "RI tc h"}
      - {type: modify_variable_by_variable, variable: "RI tc until", operation: SET, variable2: "RI tc a"}
      - {type: modify_variable_by_variable, variable: "RI tc until", operation: ADD, variable2: "RI tc b"}
      - {type: modify_variable_by_variable, variable: "RI tc until", operation: ADD, variable2: "RI tc c"}
      - {type: modify_variable_by_variable, variable: "RI tc until", operation: ADD, variable2: "RI tc d"}
      - {type: modify_variable_by_variable, variable: "RI tc until", operation: ADD, variable2: "RI tc e"}
      - {type: modify_variable_by_variable, variable: "RI tc until", operation: ADD, variable2: "RI tc f"}
      - {type: modify_variable_by_variable, variable: "RI tc until", operation: ADD, variable2: "RI tc g"}
      - {type: modify_variable_by_variable, variable: "RI tc until", operation: ADD, variable2: "RI tc h"}
      - {type: change_variable, variable: "RI tc until", operation: ADD, quantity: 1}
      - {type: modify_variable_by_attribute, object_list_unit_id: 621, object_attributes: 104, operation: SET,
         variable: "RI tc wood"}
      - {type: modify_attribute, object_list_unit_id: [621, 617, 484, 597], object_attributes: 104, operation: SET,
         quantity: 0}
    triggers:
      - name: count
        looping: true
        effects:
          - {type: count_units_into_variable, object_list_unit_id: 109, variable2: "RI tc a"}
          - {type: count_units_into_variable, object_list_unit_id: 71, variable2: "RI tc b"}
          - {type: count_units_into_variable, object_list_unit_id: 141, variable2: "RI tc c"}
          - {type: count_units_into_variable, object_list_unit_id: 142, variable2: "RI tc d"}
          - {type: count_units_into_variable, object_list_unit_id: 621, variable2: "RI tc e"}
          - {type: count_units_into_variable, object_list_unit_id: 617, variable2: "RI tc f"}
          - {type: count_units_into_variable, object_list_unit_id: 484, variable2: "RI tc g"}
          - {type: count_units_into_variable, object_list_unit_id: 597, variable2: "RI tc h"}
          - {type: modify_variable_by_variable, variable: "RI tcs", operation: SET, variable2: "RI tc a"}
          - {type: modify_variable_by_variable, variable: "RI tcs", operation: ADD, variable2: "RI tc b"}
          - {type: modify_variable_by_variable, variable: "RI tcs", operation: ADD, variable2: "RI tc c"}
          - {type: modify_variable_by_variable, variable: "RI tcs", operation: ADD, variable2: "RI tc d"}
          - {type: modify_variable_by_variable, variable: "RI tcs", operation: ADD, variable2: "RI tc e"}
          - {type: modify_variable_by_variable, variable: "RI tcs", operation: ADD, variable2: "RI tc f"}
          - {type: modify_variable_by_variable, variable: "RI tcs", operation: ADD, variable2: "RI tc g"}
          - {type: modify_variable_by_variable, variable: "RI tcs", operation: ADD, variable2: "RI tc h"}
      # The price comes back the moment a foundation is placed (object_state 0, FOUNDATION): counting only sees
      # finished buildings, so until the first one finished a second foundation was free too (playtest,
      # 2026-11-08). Objects in Area without an area is the whole map (unverified).
      - name: done
        conditions:
          - {type: compare_variables, variable: "RI tcs", comparison: LARGER_OR_EQUAL, variable2: "RI tc until"}
          - {type: or}
          - {type: objects_in_area, object_list: 621, object_state: 0, quantity: 1}
          - {type: or}
          - {type: objects_in_area, object_list: 617, object_state: 0, quantity: 1}
          - {type: or}
          - {type: objects_in_area, object_list: 484, object_state: 0, quantity: 1}
          - {type: or}
          - {type: objects_in_area, object_list: 597, object_state: 0, quantity: 1}
        effects:
          - {type: modify_attribute_by_variable, object_list_unit_id: [621, 617, 484, 597], object_attributes: 104,
             operation: SET, variable: "RI tc wood"}
          - {type: deactivate_trigger, trigger_id: "@count"}
      - name: bronze age
        conditions: [{type: accumulate_attribute, attribute: 6, quantity: 2}]
        effects: [{type: enable_disable_object, object_list_unit_id: [621, 617, 484, 597], enabled: 1}]
  # Dawn of a New Age, Moderate bonus (good)
  master_fishermen:
    # The user's call: four times the load on purpose, fishers travel the farthest.
    label: "Master Fishermen"
    text: "Fishermen and Fishing Boats work 25% faster and carry 50 more food."
    effects:
      - {type: modify_attribute, object_list_unit_id: [56, 57, 13, 15], object_attributes: 14, operation: ADD,
         quantity: 50}
      - {type: modify_attribute, object_list_unit_id: [56, 57, 13, 15], object_attributes: 13, operation: MULTIPLY,
         quantity: 1.25}
  quartermasters:
    label: "Quartermasters"
    text: "The Storage Pit's Tool and Bronze Age upgrades are free, but take three times as long."
    effects:
      - {type: enable_disable_technology, technology: [43, 44, 45, 51], enabled: 1}     # perks trump the mission
      - {type: change_technology_cost, technology: [46, 40, 41, 42, 43, 44, 45, 51], resource_1: 0,
         resource_1_quantity: 0, resource_2: 3, resource_2_quantity: 0}
      - {type: change_technology_research_time, technology: 46, quantity: 120}
      - {type: change_technology_research_time, technology: [40, 41, 42], quantity: 90}
      - {type: change_technology_research_time, technology: [43, 44, 45], quantity: 180}
      - {type: change_technology_research_time, technology: 51, quantity: 225}
  # Dawn of a New Age, Hard bonus (great)
  resource_mastery:
    label: "Resource Mastery"
    text: "Each Market resource upgrade also gives the other gatherers 2 more carrying capacity and 5% faster work."
    triggers:
      - name: wood working
        conditions: [{type: research_technology, technology: 107}]
        effects:
          - {type: modify_attribute, object_list_unit_id: &food [120, 354, 122, 216, 259, 214, 56, 57, 590, 592, 13,
                                                                 15], object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *food, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: &gold [579, 581, 2333, 2334], object_attributes: 14,
             operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *gold, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: &stone [124, 220], object_attributes: 14, operation: ADD,
             quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *stone, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
      - name: gold mining
        conditions: [{type: research_technology, technology: 108}]
        effects:
          - {type: modify_attribute, object_list_unit_id: *food, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *food, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: &wood [123, 218], object_attributes: 14, operation: ADD,
             quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *wood, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: *stone, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *stone, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
      - name: stone mining
        conditions: [{type: research_technology, technology: 109}]
        effects:
          - {type: modify_attribute, object_list_unit_id: *food, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *food, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: *wood, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *wood, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: *gold, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *gold, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
      - name: domestication
        conditions: [{type: research_technology, technology: 81}]
        effects:
          - {type: modify_attribute, object_list_unit_id: *wood, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *wood, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: *gold, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *gold, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
          - {type: modify_attribute, object_list_unit_id: *stone, object_attributes: 14, operation: ADD, quantity: 2}
          - {type: modify_attribute, object_list_unit_id: *stone, object_attributes: 13, operation: MULTIPLY,
             quantity: 1.05}
  nile_arsenal:
    label: "Nile Arsenal"
    text: "Egypt gains the Catapult, Heavy Catapult, Phalangite and Armored Elephant upgrades (Iron Age)."
    effects: [{type: enable_disable_technology, technology: [54, 36, 73, 125], enabled: 1}]
  # Skirmish, primary (quality of life)
  keen_eyes:
    label: "Keen Eyes"
    text: "Bowmen shoot 1 tile farther."
    effects: [{type: modify_attribute, object_list_unit_id: [4, 24, 492], object_attributes: 12, operation: ADD,
               quantity: 1}]
  field_dressing:
    label: "Field Dressing"
    text: "Soldiers slowly heal (15 hit points a minute)."
    # Regeneration (attribute 109, hit points per minute) for every soldier class: infantry 6, archers 0, mounted
    # archers 36, cavalry 12, Scouts 47, Slingers 44, siege 13 and 55.
    effects: [{type: modify_attribute_for_class, object_group2: [6, 0, 36, 12, 47, 44, 13, 55], object_attributes: 109,
               operation: SET, quantity: 15}]
  # Skirmish, Moderate bonus (good)
  bronze_tipped_arrows:
    label: "Bronze-tipped Arrows"
    text: "Everything that shoots arrows does 1 more damage: archers, towers and warships."
    # The arrow shooters (RoR data, projectile Arrow or Tower Arrow): Bowman 4, Improved Bowman 24, Composite Bowman
    # 492, Chariot Archer 5, Horse Archer 39, Heavy Horse Archer 474, Elephant Archer 873, War Galley 21, Scout Ship
    # 539, Watch/Sentry/Guard Tower 79/234/235. All pierce (class 3).
    effects: [{type: modify_attribute, object_attributes: 9, operation: ADD, armour_attack_class: 3,
               armour_attack_quantity: 1, object_list_unit_id: [4, 24, 492, 5, 39, 474, 873, 21, 539, 79, 234, 235]}]
  hardy_warriors:
    label: "Hardy Warriors"
    text: "Melee soldiers have 20 more hit points."
    # Infantry (6), cavalry and elephants (12), Scouts (47).
    effects: [{type: modify_attribute_for_class, object_group2: [6, 12, 47], object_attributes: 0, operation: ADD,
               quantity: 20}]
  # Skirmish, Hard bonus (great)
  battle_drill:
    label: "Battle Drill"
    text: "Soldiers train 50% faster."
    effects: [{type: modify_attribute_for_class, object_group2: [6, 0, 36, 12, 47, 44, 13, 55, 22], object_attributes: 101,
               operation: MULTIPLY, quantity: 0.67}]
  shield_wall:
    label: "Shield Wall"
    text: "Infantry have 1 more melee and pierce armour."
    effects:
      - {type: modify_attribute_for_class, object_group2: 6, object_attributes: 8, operation: ADD,
         armour_attack_class: 4, armour_attack_quantity: 1}
      - {type: modify_attribute_for_class, object_group2: 6, object_attributes: 8, operation: ADD,
         armour_attack_class: 3, armour_attack_quantity: 1}

  # Farming, primary (quality of life)
  free_farms:
    label: "Free Farms"
    text: "Farms cost nothing, but farmers gather at half speed."
    # Farm 50's wood cost (attribute 104); farmers 259 (male) and 214 (female) work rate (13).
    effects:
      - {type: modify_attribute, object_list_unit_id: 50, object_attributes: 104, operation: SET, quantity: 0}
      - {type: modify_attribute, object_list_unit_id: [259, 214], object_attributes: 13, operation: MULTIPLY,
         quantity: 0.5}
  market_day:
    label: "Market Day"
    text: "Every Market upgrade finishes in 1 second (it still costs the same)."
    # The techs researched at the Market (84) in RoR's data (read with genieutils, 2026-11-08): Wheel 28, Coinage 30,
    # Plow 31, Artisanship 32, Irrigation 80, Domestication 81, Wood Working 107, Gold Mining 108, Stone Mining 109,
    # Craftsmanship 110, Siege Craft 111. 1 second, not 0 (see swift_advance).
    effects: [{type: change_technology_research_time, technology: [28, 30, 31, 32, 80, 81, 107, 108, 109, 110, 111],
               quantity: 1}]
  # Farming, Moderate bonus (good)
  slinger_corps:
    label: "Slinger Corps"
    text: "Slingers cost no stone and throw 1 tile farther."
    # Slinger 7 (and 6, the data's other Slinger): stone cost (106), range (12).
    effects:
      - {type: modify_attribute, object_list_unit_id: [7, 6], object_attributes: 106, operation: SET, quantity: 0}
      - {type: modify_attribute, object_list_unit_id: [7, 6], object_attributes: 12, operation: ADD, quantity: 1}
  builders_tithe:
    label: "Builder's Tithe"
    text: "Finishing a building (not Farms or walls) gives 5 stone."
    # A finished building adds what its storages with store flag 4 hold (Houses give their population that way;
    # RoR's data, 2026-11-08). Every building's third storage, free in all of them, becomes 5 stone (resource 2)
    # with flag 4. Unverified in game: whether stone is given like population, and whether it's taken back when the
    # building is destroyed. Buildings: every building in ror_tech_tree.yaml but walls, gates and Farms, and the
    # Town Centers 109/71/141/142.
    effects:
      - {type: modify_attribute, object_list_unit_id: &buildings [10, 12, 14, 18, 19, 20, 30, 31, 32, 45, 47, 49, 51,
          68, 70, 79, 84, 86, 87, 101, 103, 104, 105, 116, 129, 130, 131, 132, 133, 137, 150, 153, 209, 210, 234,
          235, 236, 276, 463, 464, 465, 484, 498, 562, 563, 564, 565, 597, 617, 621, 109, 71, 141, 142],
         object_attributes: 170, operation: SET, quantity: 2}
      - {type: modify_attribute, object_list_unit_id: *buildings, object_attributes: 173, operation: SET, quantity: 4}
      - {type: modify_attribute, object_list_unit_id: *buildings, object_attributes: 27, operation: SET, quantity: 5}
  # Farming, Hard bonus (great)
  war_fleet:
    label: "War Fleet"
    text: "Warships have 40 more hit points and do 2 more damage."
    # Warships are class 22; their damage is pierce (class 3).
    effects:
      - {type: modify_attribute_for_class, object_group2: 22, object_attributes: 0, operation: ADD, quantity: 40}
      - {type: modify_attribute_for_class, object_group2: 22, object_attributes: 9, operation: ADD,
         armour_attack_class: 3, armour_attack_quantity: 2}
  master_farmers:
    label: "Master Farmers"
    text: "Farmers work 50% faster."
    # Replaces Field Granaries (the Khmer bonus, resource 96): in Return of Rome farmers still walked to the
    # Granary, only slower (playtest, 2026-11-08). Farmers 259 (male) and 214 (female), work rate (13).
    effects: [{type: modify_attribute, object_list_unit_id: [259, 214], object_attributes: 13, operation: MULTIPLY,
               quantity: 1.5}]
  # Trade, primary (quality of life)
  town_tithes:
    label: "Town Tithes"
    text: "Each Town Center gives 2 food, wood, gold and stone every 10 seconds, but you get only 5 Town Centers each mission, counting those you start with: one that is lost can't be rebuilt."
    # The user (2026-11-08): you can build 5; if they get destroyed you never get to build them again.
    # Town Centers alive (109/71/141/142, every age's): the largest of the four counts, not their sum: summed,
    # the cap came at 3 Town Centers (playtest, 2026-11-08), so a finished Town Center shows up under two of those
    # ids (which two is unverified; the largest is right as long as the starting one shares an id with them).
    # Town Centers placed: the ones at the start, plus every rise in the number of foundations (621/617/484/597 in
    # object_state 0, FOUNDATION; count_units_into_variable only sees finished buildings, so the "foundations"
    # ladders count up to 5 of each). At 5 placed the foundations are switched off for good; a foundation
    # cancelled still uses up its place.
    triggers:
      - name: start
        effects:
          - {type: count_units_into_variable, object_list_unit_id: 109, variable2: "RI tc a"}
          - {type: count_units_into_variable, object_list_unit_id: 71, variable2: "RI tc b"}
          - {type: count_units_into_variable, object_list_unit_id: 141, variable2: "RI tc c"}
          - {type: count_units_into_variable, object_list_unit_id: 142, variable2: "RI tc d"}
          - {type: modify_variable_by_variable, variable: "RI tc placed", operation: SET, variable2: "RI tc a"}
          - {type: modify_variable_by_variable, variable: "RI tc placed", operation: ADD, variable2: "RI tc b"}
          - {type: modify_variable_by_variable, variable: "RI tc placed", operation: ADD, variable2: "RI tc c"}
          - {type: modify_variable_by_variable, variable: "RI tc placed", operation: ADD, variable2: "RI tc d"}
          - {type: activate_trigger, trigger_id: "@count"}
          - {type: activate_trigger, trigger_id: "@tithe"}
      - name: count
        conditions: [{type: timer, timer: 1}]
        effects:
          # last second's results first: the max and foundation triggers below have finished with them
          - {type: modify_variable_by_variable, variable: "RI tc max", operation: SET, variable2: "RI tcs"}
          - {type: modify_variable_by_variable, variable: "RI tc f", operation: SET, variable2: "RI tf a"}
          - {type: modify_variable_by_variable, variable: "RI tc f", operation: ADD, variable2: "RI tf b"}
          - {type: modify_variable_by_variable, variable: "RI tc f", operation: ADD, variable2: "RI tf c"}
          - {type: modify_variable_by_variable, variable: "RI tc f", operation: ADD, variable2: "RI tf d"}
          - {type: modify_variable_by_variable, variable: "RI tc new", operation: SET, variable2: "RI tc f"}
          - {type: modify_variable_by_variable, variable: "RI tc new", operation: SUBTRACT, variable2: "RI tc f last"}
          - {type: modify_variable_by_variable, variable: "RI tc f last", operation: SET, variable2: "RI tc f"}
          - {type: change_variable, variable: "RI tf a", operation: SET, quantity: 0}
          - {type: change_variable, variable: "RI tf b", operation: SET, quantity: 0}
          - {type: change_variable, variable: "RI tf c", operation: SET, quantity: 0}
          - {type: change_variable, variable: "RI tf d", operation: SET, quantity: 0}
          - {type: count_units_into_variable, object_list_unit_id: 109, variable2: "RI tc a"}
          - {type: count_units_into_variable, object_list_unit_id: 71, variable2: "RI tc b"}
          - {type: count_units_into_variable, object_list_unit_id: 141, variable2: "RI tc c"}
          - {type: count_units_into_variable, object_list_unit_id: 142, variable2: "RI tc d"}
          - {type: modify_variable_by_variable, variable: "RI tcs", operation: SET, variable2: "RI tc a"}
          - {type: activate_trigger, trigger_id: "@count"}
      - name: placed
        looping: true
        conditions: [{type: variable_value, variable: "RI tc new", comparison: LARGER, quantity: 0}]
        effects:
          - {type: modify_variable_by_variable, variable: "RI tc placed", operation: ADD, variable2: "RI tc new"}
          - {type: change_variable, variable: "RI tc new", operation: SET, quantity: 0}
      - name: max b
        looping: true
        conditions: [{type: compare_variables, variable: "RI tc b", comparison: LARGER, variable2: "RI tcs"}]
        effects: [{type: modify_variable_by_variable, variable: "RI tcs", operation: SET, variable2: "RI tc b"}]
      - name: max c
        looping: true
        conditions: [{type: compare_variables, variable: "RI tc c", comparison: LARGER, variable2: "RI tcs"}]
        effects: [{type: modify_variable_by_variable, variable: "RI tcs", operation: SET, variable2: "RI tc c"}]
      - name: max d
        looping: true
        conditions: [{type: compare_variables, variable: "RI tc d", comparison: LARGER, variable2: "RI tcs"}]
        effects: [{type: modify_variable_by_variable, variable: "RI tcs", operation: SET, variable2: "RI tc d"}]
      - name: foundations 621 1
        looping: true
        conditions: [{type: objects_in_area, object_list: 621, object_state: 0, quantity: 1}]
        effects: [{type: change_variable, variable: "RI tf a", operation: SET, quantity: 1}]
      - name: foundations 621 2
        looping: true
        conditions: [{type: objects_in_area, object_list: 621, object_state: 0, quantity: 2}]
        effects: [{type: change_variable, variable: "RI tf a", operation: SET, quantity: 2}]
      - name: foundations 621 3
        looping: true
        conditions: [{type: objects_in_area, object_list: 621, object_state: 0, quantity: 3}]
        effects: [{type: change_variable, variable: "RI tf a", operation: SET, quantity: 3}]
      - name: foundations 621 4
        looping: true
        conditions: [{type: objects_in_area, object_list: 621, object_state: 0, quantity: 4}]
        effects: [{type: change_variable, variable: "RI tf a", operation: SET, quantity: 4}]
      - name: foundations 621 5
        looping: true
        conditions: [{type: objects_in_area, object_list: 621, object_state: 0, quantity: 5}]
        effects: [{type: change_variable, variable: "RI tf a", operation: SET, quantity: 5}]
      - name: foundations 617 1
        looping: true
        conditions: [{type: objects_in_area, object_list: 617, object_state: 0, quantity: 1}]
        effects: [{type: change_variable, variable: "RI tf b", operation: SET, quantity: 1}]
      - name: foundations 617 2
        looping: true
        conditions: [{type: objects_in_area, object_list: 617, object_state: 0, quantity: 2}]
        effects: [{type: change_variable, variable: "RI tf b", operation: SET, quantity: 2}]
      - name: foundations 617 3
        looping: true
        conditions: [{type: objects_in_area, object_list: 617, object_state: 0, quantity: 3}]
        effects: [{type: change_variable, variable: "RI tf b", operation: SET, quantity: 3}]
      - name: foundations 617 4
        looping: true
        conditions: [{type: objects_in_area, object_list: 617, object_state: 0, quantity: 4}]
        effects: [{type: change_variable, variable: "RI tf b", operation: SET, quantity: 4}]
      - name: foundations 617 5
        looping: true
        conditions: [{type: objects_in_area, object_list: 617, object_state: 0, quantity: 5}]
        effects: [{type: change_variable, variable: "RI tf b", operation: SET, quantity: 5}]
      - name: foundations 484 1
        looping: true
        conditions: [{type: objects_in_area, object_list: 484, object_state: 0, quantity: 1}]
        effects: [{type: change_variable, variable: "RI tf c", operation: SET, quantity: 1}]
      - name: foundations 484 2
        looping: true
        conditions: [{type: objects_in_area, object_list: 484, object_state: 0, quantity: 2}]
        effects: [{type: change_variable, variable: "RI tf c", operation: SET, quantity: 2}]
      - name: foundations 484 3
        looping: true
        conditions: [{type: objects_in_area, object_list: 484, object_state: 0, quantity: 3}]
        effects: [{type: change_variable, variable: "RI tf c", operation: SET, quantity: 3}]
      - name: foundations 484 4
        looping: true
        conditions: [{type: objects_in_area, object_list: 484, object_state: 0, quantity: 4}]
        effects: [{type: change_variable, variable: "RI tf c", operation: SET, quantity: 4}]
      - name: foundations 484 5
        looping: true
        conditions: [{type: objects_in_area, object_list: 484, object_state: 0, quantity: 5}]
        effects: [{type: change_variable, variable: "RI tf c", operation: SET, quantity: 5}]
      - name: foundations 597 1
        looping: true
        conditions: [{type: objects_in_area, object_list: 597, object_state: 0, quantity: 1}]
        effects: [{type: change_variable, variable: "RI tf d", operation: SET, quantity: 1}]
      - name: foundations 597 2
        looping: true
        conditions: [{type: objects_in_area, object_list: 597, object_state: 0, quantity: 2}]
        effects: [{type: change_variable, variable: "RI tf d", operation: SET, quantity: 2}]
      - name: foundations 597 3
        looping: true
        conditions: [{type: objects_in_area, object_list: 597, object_state: 0, quantity: 3}]
        effects: [{type: change_variable, variable: "RI tf d", operation: SET, quantity: 3}]
      - name: foundations 597 4
        looping: true
        conditions: [{type: objects_in_area, object_list: 597, object_state: 0, quantity: 4}]
        effects: [{type: change_variable, variable: "RI tf d", operation: SET, quantity: 4}]
      - name: foundations 597 5
        looping: true
        conditions: [{type: objects_in_area, object_list: 597, object_state: 0, quantity: 5}]
        effects: [{type: change_variable, variable: "RI tf d", operation: SET, quantity: 5}]
      - name: tithe
        conditions: [{type: timer, timer: 10}]
        effects:
          - {type: modify_variable_by_variable, variable: "RI tithe", operation: SET, variable2: "RI tc max"}
          - {type: change_variable, variable: "RI tithe", operation: MULTIPLY, quantity: 2}
          - {type: modify_resource_by_variable, tribute_list: [0, 1, 2, 3], operation: ADD, variable: "RI tithe"}
          - {type: activate_trigger, trigger_id: "@tithe"}
      - name: cap
        conditions: [{type: variable_value, variable: "RI tc placed", comparison: LARGER_OR_EQUAL, quantity: 5}]
        effects:
          - {type: enable_disable_object, object_list_unit_id: [621, 617, 484, 597], enabled: 0}
          - {type: display_instructions, display_time: 8, message: "Town Tithes: that was your 5th Town Center, the last one this mission."}
  grain_trade:
    label: "Grain Trade"
    text: "Trade Boats and Merchant Ships bring back half their gold again as food."
    # AoE2's Bengali trade bonus, resource 251 (Trade Food Percent). Unverified in Return of Rome.
    effects: [{type: modify_resource, tribute_list: 251, operation: SET, quantity: 50}]
  # Trade, Moderate bonus (good)
  ballista_crews:
    label: "Ballista Crews"
    text: "Ballistas can be built at the Siege Workshop before the Iron Age."
    # Ballista 279, enabled by trigger: perks trump the tech tree (unverified that an enabled unit shows its
    # button; see tree_effects).
    effects: [{type: enable_disable_object, object_list_unit_id: 279, enabled: 1}]
  elephant_archery:
    label: "Elephant Archery"
    text: "Elephant Archers do 5 more damage."
    # Elephant Archer 873; its damage is pierce (class 3).
    effects: [{type: modify_attribute, object_list_unit_id: 873, object_attributes: 9, operation: ADD,
               armour_attack_class: 3, armour_attack_quantity: 5}]
  # Trade, Hard bonus (great)
  wooden_towers:
