  04_the_dawn_of_a_new_age:
    players: [{number: 2, name: "Raiders", civ: EGYPTIAN}]
    units:
      # Raiders guarding the elephants: 2 Clubmen and a Bowman in the north, 2 Clubmen and a Scout in the
      # south-west (Moderate and Hard), and a Bowman more at each on Hard. On the map from the start: created by
      # a trigger they were defeated before they appeared (playtest, 2026-11-08).
      - {player: 2, hp: 40, unit: 281, x: 22, y: 8, from: moderate, group: north}
      - {player: 2, hp: 40, unit: 281, x: 24, y: 8, from: moderate, group: north}
      - {player: 2, hp: 35, unit: 4, x: 23, y: 7, from: moderate, group: north}
      - {player: 2, hp: 35, unit: 4, x: 25, y: 7, from: hard, group: north}
      - {player: 2, hp: 40, unit: 281, x: 8, y: 37, from: moderate, group: southwest}
      - {player: 2, hp: 40, unit: 281, x: 8, y: 39, from: moderate, group: southwest}
      - {player: 2, hp: 60, unit: 448, x: 9, y: 38, from: moderate, group: southwest}
      - {player: 2, hp: 35, unit: 4, x: 9, y: 36, from: hard, group: southwest}
      # More fish (250 food each) in open water near the shores: food ran short after fighting the Raiders.
      - {player: 0, unit: 457, x: 39, y: 1}
      - {player: 0, unit: 457, x: 42, y: 9}
      - {player: 0, unit: 457, x: 34, y: 14}
      - {player: 0, unit: 457, x: 37, y: 25}
      - {player: 0, unit: 457, x: 35, y: 36}
      - {player: 0, unit: 457, x: 33, y: 41}
      - {player: 0, unit: 457, x: 1, y: 43}
      - {player: 0, unit: 457, x: 38, y: 43}
      - {player: 0, unit: 457, x: 43, y: 45}
    # What can be built comes from the campaign's tech tree (unlocks); the Raiders join the main objective from
    # Moderate (the user, 2026-11-08: no hiding behind buildings while advancing).
    primary_extra:
      text: "Defeat the Raiders."
      from: moderate
      conditions:
        # Their soldiers: Clubmen/Axemen (class 6), Bowmen (0), Scouts (47).
        - {type: own_fewer_objects, source_player: 2, object_group: 6, quantity: 0}
        - {type: own_fewer_objects, source_player: 2, object_group: 0, quantity: 0}
        - {type: own_fewer_objects, source_player: 2, object_group: 47, quantity: 0}
    rewards: [swift_advance, free_town_center]
    bonus:
      - text: "Reach a population of 25 with 2 Docks."
        conditions:
          - {type: accumulate_attribute, attribute: 11, quantity: 25}
          - {type: variable_value, variable: "RI docks", comparison: LARGER_OR_EQUAL, quantity: 2}
        triggers:
          # Docks change unit with each age: count them all.
          - name: count docks
            looping: true
            effects:
              - {type: count_units_into_variable, object_list_unit_id: 45, variable2: "RI docks a"}
              - {type: count_units_into_variable, object_list_unit_id: 133, variable2: "RI docks b"}
              - {type: count_units_into_variable, object_list_unit_id: 47, variable2: "RI docks c"}
              - {type: modify_variable_by_variable, variable: "RI docks", operation: SET, variable2: "RI docks a"}
              - {type: modify_variable_by_variable, variable: "RI docks", operation: ADD, variable2: "RI docks b"}
              - {type: modify_variable_by_variable, variable: "RI docks", operation: ADD, variable2: "RI docks c"}
        rewards: [master_fishermen, quartermasters]
      - text: "Reach the Bronze Age."
        conditions: [{type: accumulate_attribute, attribute: 6, quantity: 2}]
        setup:
          # Hard: the Raiders have Axemen and Tool Working, no armour (balance, user 2026-11-08; their extra Bowmen
          # are mission units).
          # The Bronze Age opens without its two Tool Age buildings (tech 75 granted); the Whales' gold pays for it.
          - {type: research_technology, source_player: 2, technology: [63, 46], force_research_technology: 1}
          - {type: enable_disable_technology, technology: 102, enabled: 1}
          - {type: research_technology, technology: 75, force_research_technology: 1}
        triggers:
          # A minute after the player's first age-up the northern group attacks the Town Center, the south-west group
          # a minute later. A group that's attacked, or loses a unit, attacks at once (only that group). They have
          # no AI, so their attack-move order is given again every 10 seconds (after a fight they stood idle), and
          # they see the player's town. A group attacks once: "RI <group> out" keeps a later cue from sending it
          # again.
          - name: aged
            conditions: [{type: accumulate_attribute, attribute: 6, quantity: 1}]
            effects: [{type: activate_trigger, trigger_id: "@first wave wait"}]
          - name: first wave wait
            conditions: [{type: timer, timer: 60}]
            effects:
              - {type: activate_trigger, trigger_id: "@north attack"}
              - {type: activate_trigger, trigger_id: "@second wave wait"}
          - name: second wave wait
            conditions: [{type: timer, timer: 60}]
            effects: [{type: activate_trigger, trigger_id: "@southwest attack"}]
          - name: north provoked
            conditions:
              # object_attacked's player is most likely the attacker: with the Raiders there it never fired (playtest
              # 2026-11-08). Backed up by "hurt" (hit points below full) and "killed".
              - {type: object_attacked, select: {group: north}, source_player: 1, quantity: 1}
              - {type: or}
              - {type: object_hp, select: {group: north}, comparison: LESS, quantity: full}
              - {type: or}
              - {type: destroy_object, select: {group: north}}
            effects: [{type: activate_trigger, trigger_id: "@north attack"}]
          - name: southwest provoked
            conditions:
              # object_attacked's player is most likely the attacker: with the Raiders there it never fired (playtest
              # 2026-11-08). Backed up by "hurt" (hit points below full) and "killed".
              - {type: object_attacked, select: {group: southwest}, source_player: 1, quantity: 1}
              - {type: or}
              - {type: object_hp, select: {group: southwest}, comparison: LESS, quantity: full}
              - {type: or}
              - {type: destroy_object, select: {group: southwest}}
            effects: [{type: activate_trigger, trigger_id: "@southwest attack"}]
          - name: north attack
            conditions: [{type: variable_value, variable: "RI north out", comparison: EQUAL, quantity: 0}]
            effects:
              - {type: change_variable, variable: "RI north out", operation: SET, quantity: 1}
              - {type: deactivate_trigger, trigger_id: "@north provoked"}
              - {type: set_player_visibility, source_player: 2, target_player: 1, visibility_state: VISIBLE}
              - {type: attack_move, select: {group: north}, location_x: 28, location_y: 26}
              - {type: display_instructions, display_time: 8, message: "Raiders from the north are coming for your Town Center!"}
              - {type: activate_trigger, trigger_id: "@push north"}
          - name: southwest attack
            conditions: [{type: variable_value, variable: "RI southwest out", comparison: EQUAL, quantity: 0}]
            effects:
              - {type: change_variable, variable: "RI southwest out", operation: SET, quantity: 1}
              - {type: deactivate_trigger, trigger_id: "@southwest provoked"}
              - {type: set_player_visibility, source_player: 2, target_player: 1, visibility_state: VISIBLE}
              - {type: attack_move, select: {group: southwest}, location_x: 28, location_y: 26}
              - {type: display_instructions, display_time: 8, message: "Raiders from the south-west are coming for your Town Center!"}
              - {type: activate_trigger, trigger_id: "@push southwest"}
          - name: push north
            conditions: [{type: timer, timer: 10}]
            effects:
              - {type: attack_move, select: {group: north}, location_x: 28, location_y: 26}
              - {type: activate_trigger, trigger_id: "@push north"}
          - name: push southwest
            conditions: [{type: timer, timer: 10}]
            effects:
              - {type: attack_move, select: {group: southwest}, location_x: 28, location_y: 26}
              - {type: activate_trigger, trigger_id: "@push southwest"}
        rewards: [resource_mastery, nile_arsenal]
  05_skirmish:
    # Mission 5: your 4 Axemen and 3 Bowmen around 20,23 against the Egyptian Raiders' 3 Axemen and 3 Bowmen in the
    # south-east (46,46 to 65,61). No Town Center. Water fills the north-east corner (x 46+, y 0-28); the beach
    # nearest your army is around 47,20.
    units:
      # Moderate and Hard: the Raiders' chieftain, a Short Swordsman (60 hit points).
      - {player: 2, unit: 74, x: 58, y: 51, from: moderate, group: chieftain}
    rewards: [keen_eyes, field_dressing]
    bonus:
      - text: "Slay the Raider chieftain."
        conditions: [{type: destroy_object, select: {group: chieftain}}]
        setup:
          - {type: change_object_name, select: {group: chieftain}, message: "Raider Chieftain"}
        rewards: [bronze_tipped_arrows, hardy_warriors]
      - text: "Lose no more than 2 units."
        # Complete with the main objective, unless a third unit was lost first.
        conditions: [{type: variable_value, variable: "RI primary", comparison: EQUAL, quantity: 1}]
        fail:
          - {type: accumulate_attribute, attribute: 154, quantity: 3}
        triggers:
          # Hard: a warning, then at 3:30 a Raider ship (theirs, red) appears in the
          # north-east water corner, sails to the beach near 47,20 (about 1:30), drops 2 Slingers and an Axeman and
          # sails back out of sight. Only if the Raiders aren't defeated yet: they're the main objective's enemy,
          # so you can win before it comes. The Raiders see the whole map.
          # Only on-screen messages, no timer: the game's Display Timer doesn't keep game time (at high speed it
          # still showed 222 s when the ship landed at 6:34), and an objective line isn't needed (the user,
          # 2026-11-08). Trigger timers do keep game time.
          # The landing party attack-moves toward the chieftain's camp (58,51), the Slingers re-ordered every 10
          # seconds (the user, 2026-11-08). Aimed at your units, they "moved left a bit and gave up"; sent by red's
          # AI as a raid (aoe-agent-editor raids), they stood completely idle.
          - name: countdown
            effects:
              - {type: display_instructions, display_time: 10, message: "Raiders are sailing in from the north-east: they land in 5 minutes."}
              - {type: modify_resource, source_player: 2, tribute_list: 203, operation: SET, quantity: 2}
              - {type: activate_trigger, trigger_id: "@launch"}
          - name: launch
            conditions:
              - {type: timer, timer: 210}
              - {type: variable_value, variable: "RI primary", comparison: EQUAL, quantity: 0}
            effects:
              - {type: create_object, source_player: 2, object_list_unit_id: 545, location_x: 69, location_y: 2}
              - {type: task_object, source_player: 2, object_list_unit_id: 545, area_x1: 64, area_y1: 0, area_x2: 71,
                 area_y2: 7, location_x: 49, location_y: 20}
              - {type: display_instructions, display_time: 8, message: "A Raider ship is heading for the shore!"}
              - {type: activate_trigger, trigger_id: "@land"}
          - name: land
            conditions: [{type: objects_in_area, source_player: 2, object_list: 545, area_x1: 47, area_y1: 17,
                          area_x2: 52, area_y2: 23, quantity: 1}]
            effects:
              - {type: create_object, source_player: 2, object_list_unit_id: 7, location_x: 47, location_y: 19}
              - {type: create_object, source_player: 2, object_list_unit_id: 7, location_x: 47, location_y: 21}
              - {type: create_object, source_player: 2, object_list_unit_id: 531, location_x: 47, location_y: 20}
              - {type: attack_move, source_player: 2, area_x1: 44, area_y1: 16, area_x2: 50, area_y2: 24,
                 location_x: 58, location_y: 51}
              - {type: task_object, source_player: 2, object_list_unit_id: 545, area_x1: 46, area_y1: 15, area_x2: 53,
                 area_y2: 25, location_x: 69, location_y: 2}
              - {type: activate_trigger, trigger_id: "@sail away"}
              - {type: activate_trigger, trigger_id: "@push"}
          - name: push
            conditions: [{type: timer, timer: 10}]
            effects:
              - {type: attack_move, source_player: 2, area_x1: 0, area_y1: 0, area_x2: 71, area_y2: 45,
                 object_group: 44, location_x: 58, location_y: 51}
              - {type: activate_trigger, trigger_id: "@push"}
          - name: sail away
            conditions: [{type: objects_in_area, source_player: 2, object_list: 545, area_x1: 64, area_y1: 0,
                          area_x2: 71, area_y2: 7, quantity: 1}]
            effects:
              - {type: remove_object, source_player: 2, object_list_unit_id: 545, area_x1: 64, area_y1: 0,
                 area_x2: 71, area_y2: 7}
        rewards: [battle_drill, shield_wall]
  06_farming:
    # Mission 6: you (Upper Egypt) start at 32,58 with a Town Center, Barracks, Granary, 3 Villagers and 3 Clubmen;
    # Lower Egypt (red) at 46,14 with a Town Center, Barracks, Dock, 3 Villagers and 4 Axemen. A river winds
    # across the map with 8 fish; no gold or stone mines (red has its 200 stone; the Market trades). Your
    # objectives: the Ruin at 10,14 and 800 food.
    # Red's original win (2000 food) is gone: it wins only by destroying you (the user, 2026-11-08).
    drop_objectives: [2]
    # The original made Lower Egypt neutral; it's your enemy (the user, 2026-11-08). Red may build Watch Towers
    # (yours stay locked).
    diplomacy: [[1, 2, ENEMY]]
    ai_unlocks: {2: [watch_tower]}
    # Hard: defeating Lower Egypt is part of the main objective.
    primary_extra:
      text: "Defeat Lower Egypt."
      from: hard
      conditions: [{type: player_defeated, source_player: 2}]
    setup:
      # Slingers are yours, not red's (the user, 2026-11-08): the tech tree unlocks them for both.
      - {type: enable_disable_object, source_player: 2, object_list_unit_id: 7, enabled: 0}
    rewards: [free_farms, market_day]
    bonus:
      - text: "Stockpile 200 stone."
        conditions: [{type: accumulate_attribute, attribute: 2, quantity: 200}]
        rewards: [slinger_corps, builders_tithe]
      - text: "Lose no Villagers or Fishing Boats."
        # Complete with the main objective, unless the enemy took one first (the user, 2026-11-08: losing one to the
        # enemy is enough). Villagers: the game's villagers-killed-by-AI-player count (resource 228), unverified in
        # RoR. Fishing Boats have no such count: theirs (class 21) is compared with the second before, so a boat you
        # delete yourself counts too.
        conditions: [{type: variable_value, variable: "RI primary", comparison: EQUAL, quantity: 1}]
        fail:
          - {type: accumulate_attribute, attribute: 228, quantity: 1}
          - {type: compare_variables, variable: "RI boats", comparison: LESS, variable2: "RI boats before"}
        triggers:
          - name: count
            conditions: [{type: timer, timer: 1}]
            effects:
              - {type: modify_variable_by_variable, variable: "RI boats before", operation: SET, variable2: "RI boats"}
              - {type: count_units_into_variable, object_group: 21, variable2: "RI boats"}
              - {type: activate_trigger, trigger_id: "@count"}
          - name: start counting
            effects:
              - {type: activate_trigger, trigger_id: "@count"}
        rewards: [war_fleet, master_farmers]
    # Red's AI per difficulty (the user's plan, 2026-11-08), written for this mission instead of the original
    # build list. The tech tree holds for red too, so a step it can't take is skipped, not worked around.
    #   Standard: a small economy, 5 Axemen and 3 Bowmen, 1 warship and no other ships; never attacks by itself
    #     (it still fights what comes near).
    #   Moderate: the same ships; upgrades; a 20-unit army; attacks now and then with 5 units, never before 3:00.
    #   Hard: 3 warships kept up, 5 fishing boats that are never replaced (no farming its resources by killing
    #     them), towards 100 population; raiding parties of 5 Scouts at your villagers and massive attacks of 20 or
    #     more after 3 warning attacks of 5-8 from 5:00; upgrades as soon as a defence of 8 stands at home.
    ai:
      2:
        replace: true
        name: Lower Egypt
        step_timeout: 120
        scout: false
        # Villagers don't fish (they walked to the shore fish near you and died, playtest 2026-11-08) and gather
        # food only near a drop-off.
        strategic_numbers: {sn-allow-gathering-sea-fish-with-villagers: 0, sn-maximum-food-drop-distance: 12}
        build_order:
          - {build: STORAGE_PIT}
          - {build: GRANARY}
          - {build: MARKET}
          - {build: FARM, count: 3}
          - {research: BATTLE_AXE}
          - {build: ARCHERY_RANGE}
        levels:
          easy:
            villagers: 10
            keep:
              - {train: AXEMAN, count: 5}
              - {train: BOWMAN, count: 3}
              - {train: SCOUT_SHIP, count: 1}
              - {build: FARM, count: 4}
          normal:
            villagers: 18
            # no stone or gold mines here: it sells food and wood for gold and buys stone for its towers
            trade: {buy: {stone: 200}, sell: {food: 700, wood: 600}}
            keep:
              - {train: AXEMAN, count: 10}
              - {train: BOWMAN, count: 10}
              - {train: SCOUT_SHIP, count: 1}
              - {build: FARM, count: 7}
              - {build: WATCH_TOWER, count: 2}
              - {research: TOOLWORKING}
              - {research: LEATHER_ARMOR_FOR_INFANTRY}
              - {research: LEATHER_ARMOR_FOR_ARCHERS}
              - {research: DOMESTICATION}
              - {research: WOODWORKING}
            attack: {first: 180, every: 300, min_group: 5, max_group: 5, percent: 100}
          hard:
            villagers: 40
            # It stockpiled with 2 of each (playtest, 2026-11-08): more production, and the Market turns the
            # surplus into stone for towers.
            trade: {buy: {stone: 400}, sell: {food: 900, wood: 800}}
            keep:
              - {build: BARRACKS, count: 3}
              - {build: ARCHERY_RANGE, count: 3}
              - {build: STABLE, count: 2}
              - {build: WATCH_TOWER, count: 4}
              - {train: AXEMAN, count: 22}
              - {train: BOWMAN, count: 20}
              - {train: SCOUT, count: 8}
              - {train: SCOUT_SHIP, count: 3}
              - {train: FISHING_BOAT, count: 5, lifetime: true}
              - {build: FARM, count: 14}
              - {research: TOOLWORKING, when: {soldiers: 8}}
              - {research: LEATHER_ARMOR_FOR_INFANTRY, when: {soldiers: 8}}
              - {research: LEATHER_ARMOR_FOR_ARCHERS, when: {soldiers: 8}}
              - {research: LEATHER_ARMOR_FOR_CAVALRY, when: {soldiers: 8}}
              - {research: DOMESTICATION, when: {soldiers: 8}}
              - {research: WOODWORKING, when: {soldiers: 8}}
            raids:
              - {units: [SCOUT], count: 5, first: 360, every: 180, target: villagers, fallback: {x: 32, y: 58}}
            # A few warning attacks first, then the massive waves (the first massive one came at 17:00 and was
            # loved, but nothing came before it: playtest 2026-11-08).
            attack: {first: 300, every: 360, min_group: 20, max_group: 25, percent: 100, naval: true,
                     warm_up: {attacks: 3, min_group: 5, max_group: 8, every: 180}}
  07_trade:
    # Mission 7: you (Kingdom of Egypt) start in the north-east (Town Center 78,18, Dock 64,24) in the Tool Age.
    # Red, the Minoans (P2, Bronze Age), in the south-west (Town Center 26,88, Docks 31-32,78-82, a Market); green,
    # the Canaanites (P3, Stone Age), in the north-west (Town Center 6,8, Dock 8,14, Barracks); yellow, the Libyans
    # (P4), only a Dock at 6,44 with 5 Scout Ships, 2 Stone Throwers and 2 Bowmen. Stone: 3 piles by yellow (1-10,
    # 35-39), 9 in the east desert (81-90, 55-62). Objective: 500 stone and 500 gold.
    # The user's design (2026-11-08): red and green are your enemies, yellow neutral to you and green; red and
    # yellow allies (red's trade fleet trades with yellow's Dock; RoR's AIs trade only with allies). Green and red
    # aren't allies (neutral). You get a normal Bronze Age without the Temple; green its civ's full Tool Age, red
    # its full Bronze Age (the campaign tree doesn't hold for them).
    # Red and green are enemies, not neutral: red's trade boats traded with green's Dock (probe, 2026-11-08).
    # Both AIs attack you, never each other on purpose (attack.target: 1).
    diplomacy: [[1, 2, ENEMY], [1, 3, ENEMY], [1, 4, NEUTRAL], [2, 3, ENEMY], [2, 4, ALLY], [3, 4, NEUTRAL]]
    disabled: {1: [temple, iron_age], 2: [iron_age], 3: [bronze_age, iron_age]}
    ai_unlocks: {2: all, 3: all, 4: all}
    # Green starts in the Tool Age with food and wood for a Market and Farms: from the Stone Age its hunters
    # roamed through your base and it was still short of the Tool Age at 20:00 (probe, 2026-11-08). RoR's Farms
    # need a Market, which needs the Tool Age.
    start: {3: {age: tool_age, food: 300, wood: 400}}
    setup:
      # Red's trade also brings back wood, as much as the gold (the user, 2026-11-08: half gold, half wood).
      # Resource 252, Trade Wood Percent; unverified in Return of Rome.
      - {type: modify_resource, source_player: 2, tribute_list: 252, operation: SET, quantity: 100}
    units:
      # Red starts with Trade Boats by its Docks: 2 on Moderate, 5 on Hard (the user, 2026-11-08).
      - {player: 2, unit: 17, x: 32, y: 76, from: moderate}
      - {player: 2, unit: 17, x: 34, y: 76, from: moderate}
      - {player: 2, unit: 17, x: 35, y: 78, from: hard}
      - {player: 2, unit: 17, x: 33, y: 75, from: hard}
      - {player: 2, unit: 17, x: 35, y: 80, from: hard}
    rewards: [town_tithes, grain_trade]
    bonus:
      - text: "Defeat the Minoans and the Canaanites."
        conditions:
          - {type: player_defeated, source_player: 2}
          - {type: player_defeated, source_player: 3}
        rewards: [ballista_crews, elephant_archery]
      - text: "Mine every stone pile on the map."
        # Every Stone Mine the map places (102, Gaia's) destroyed, i.e. mined out. "Gaia owns fewer than 1" held
        # from the start (playtest, 2026-11-08).
        conditions: [{type: destroy_object, select: {player: 0, unit: 102, all: true}}]
        rewards: [wooden_towers, royal_quarries]
    ai:
      # Red, the Minoans: the water. Favours Improved and Composite Bowmen, then mixes in Cavalry (Moderate) or
      # Stone Throwers too (Hard).
      #   Standard: prowls the water with 3 War Galleys, no landings (its land soldiers never attack: the land
      #     attack needs more soldiers than it keeps).
      #   Moderate: fights for the water (Scout Ships, then 6 War Galleys, naval attacks every 4 minutes), landings
      #     growing from 2 warnings of 4-6 to waves of 6-12.
      #   Hard: pushes you off the water (Scout Ships, then 10 War Galleys, every 2:30 from 2:30), then a fleet of
      #     up to 50 Trade Boats trading with yellow; constant landings: 3 warnings of 4-6, then waves of 10-20.
      2:
        replace: true
        name: Minoans
        step_timeout: 120
        # No gold mine on its land: it gathered none on a 54% gold split (probe, 2026-11-08). Its gold comes from
        # selling food and wood at its Market (and from trade boats).
        # It starved for wood (no Granary, Barracks or Archery Range by 20:00) while 5000 gold piled up (probe):
        # more on wood, and the Market buys wood and food with spare gold.
        gatherers: {food: 45, wood: 55, gold: 0, stone: 0}
        trade: {buy: {wood: 400, food: 300}, sell: {food: 400, wood: 400}, every: 4}
        # War Galleys first: it joined the naval fight late, only once it had them (playtest, 2026-11-08).
        build_order:
          - {research: MEDIUM_WAR_SHIP}
          - {build: GRANARY}
          - {build: BARRACKS}
          - {build: ARCHERY_RANGE}
          - {research: IMPROVED_BOW}
        levels:
          easy:
            villagers: 12
            keep:
              - {build: GRANARY}
              - {build: BARRACKS}
              - {build: ARCHERY_RANGE}
              - {train: WAR_GALLEY, count: 3}
              - {train: IMPROVED_BOWMAN, count: 4}
              - {build: FARM, count: 4}
            attack: {first: 300, every: 240, min_group: 999, max_group: 999, naval: true, target: 1}
          normal:
            villagers: 22
            # Landings: the land attack, ferried by the engine in red's transports (no landings by 22:00 with 1
            # transport and 5+ idle soldiers needed, playtest 2026-11-08).
            transports: 2
            keep:
              - {build: GRANARY}
              - {build: BARRACKS}
              - {build: ARCHERY_RANGE}
              - {build: DOCK, count: 2}
              - {train: SCOUT_SHIP, count: 4}
              - {train: WAR_GALLEY, count: 6}
              - {research: COMPOSITE_BOW}
              - {train: COMPOSITE_BOWMAN, count: 8}
              - {train: IMPROVED_BOWMAN, count: 4}
              - {build: STABLE}
              - {train: CAVALRY, count: 4}
              - {build: FARM, count: 8}
              - {research: SCALE_ARMOR_FOR_ARCHERS}
              - {research: WHEEL}
            # Landings: 2 warnings of 4-6, then waves of 6-12 (the user, 2026-11-08: the warnings were good, then
            # they should scale up).
            attack: {first: 180, every: 240, min_group: 6, max_group: 12, percent: 100, naval: true, target: 1,
                     warm_up: {attacks: 2, min_group: 4, max_group: 6, every: 240}}
          hard:
            villagers: 35
            # light transports carry 5: 4 of them land a wave of 20
            transports: 4
            keep:
              - {build: GRANARY}
              - {build: BARRACKS}
              - {build: DOCK, count: 3}
              - {train: SCOUT_SHIP, count: 6}
              - {train: WAR_GALLEY, count: 10}
              - {research: COMPOSITE_BOW}
              - {build: ARCHERY_RANGE, count: 3}
              - {train: COMPOSITE_BOWMAN, count: 20}
              - {train: IMPROVED_BOWMAN, count: 10}
              - {build: STABLE}
              - {train: CAVALRY, count: 6}
              - {build: SIEGE_WORKSHOP}
              - {train: STONE_THROWER, count: 4}
              - {build: FARM, count: 12}
              - {research: SCALE_ARMOR_FOR_ARCHERS}
              - {research: SCALE_ARMOR_FOR_CAVALRY}
              - {research: WHEEL}
              - {research: ARTISANSHIP}
              - {research: PLOW}
              # the trade fleet once it rules the water: 8 War Galleys (from the start it took all the wood and
              # red had no army, probe 2026-11-08; its 5 starting boats bring the gold until then)
              - {train: TRADE_BOAT, count: 50, when: {units: {WAR_GALLEY: 8}}}
            # 3 warning landings of 4-6, then waves of 10-20; the fleet attacks from 2:30, every 2:30.
            attack: {first: 150, every: 150, min_group: 10, max_group: 20, percent: 100, naval: true, target: 1,
                     warm_up: {attacks: 3, min_group: 4, max_group: 6, every: 150}}
      # Green, the Canaanites: the land, up to the Tool Age.
      #   Standard: never attacks; at most 5 soldiers and a few villagers; 2 fishing boats.
      #   Moderate: your land enemy, basic attacks of 6-8.
      #   Hard: Egypt 6's Hard red: towards 100 population, 3 warning attacks then massive waves, Scout raids.
      3:
        replace: true
        name: Canaanites
        step_timeout: 120
        scout: false
        # No stone or gold: the reachable stone is the east desert, through your base, and its miners walked to
        # their death there (playtest, 2026-11-08). So no Slingers or towers either.
        gatherers: {food: 60, wood: 40, gold: 0, stone: 0}
        # Everything close to home: it put a Granary in your base and sent hunters through it (2026-11-08).
        # Drop-off buildings within 12 tiles of its Town Center, hunting and foraging within 8 of a drop-off.
        # Fishing on every difficulty, by boat (the user, 2026-11-08: food held it back).
        strategic_numbers: {sn-allow-gathering-sea-fish-with-villagers: 0, sn-maximum-food-drop-distance: 8,
                            sn-maximum-hunt-drop-distance: 8, sn-mill-max-distance: 12, sn-camp-max-distance: 12}
        build_order:
          - {build: GRANARY}
          - {build: MARKET}
          - {build: FARM, count: 4}
          - {build: STORAGE_PIT}
          - {build: ARCHERY_RANGE}
        levels:
          easy:
            villagers: 8
            keep:
              # the Market again whenever it's missing: the plan skipped it at 10:15 while the Granary it needs
              # was still unfinished, and it never farmed (probe, 2026-11-08)
              - {build: MARKET}
              - {train: FISHING_BOAT, count: 2}
              - {train: AXEMAN, count: 3}
              - {train: BOWMAN, count: 2}
              - {build: FARM, count: 3}
          normal:
            villagers: 18
            keep:
              - {build: MARKET}
              - {train: FISHING_BOAT, count: 4}
              # Clubmen from the start (nothing attacked by 13:00, playtest)
              - {train: CLUBMAN, count: 6}
              - {research: BATTLE_AXE}
              - {train: AXEMAN, count: 8}
              - {train: BOWMAN, count: 10}
              - {build: FARM, count: 7}
              - {research: TOOLWORKING}
              - {research: LEATHER_ARMOR_FOR_INFANTRY}
              - {research: LEATHER_ARMOR_FOR_ARCHERS}
            attack: {first: 420, every: 300, min_group: 6, max_group: 8, percent: 100, target: 1}
          hard:
            villagers: 40
            keep:
              - {build: MARKET}
              - {train: CLUBMAN, count: 8}
              - {research: BATTLE_AXE}
              - {build: BARRACKS, count: 3}
              - {build: ARCHERY_RANGE, count: 3}
              - {build: STABLE, count: 2}
              - {train: AXEMAN, count: 22}
              - {train: BOWMAN, count: 20}
              - {train: SCOUT, count: 8}
              - {train: SCOUT_SHIP, count: 2}
              - {train: FISHING_BOAT, count: 5, lifetime: true}
              - {build: FARM, count: 14}
              - {research: TOOLWORKING, when: {soldiers: 8}}
              - {research: LEATHER_ARMOR_FOR_INFANTRY, when: {soldiers: 8}}
              - {research: LEATHER_ARMOR_FOR_ARCHERS, when: {soldiers: 8}}
              - {research: LEATHER_ARMOR_FOR_CAVALRY, when: {soldiers: 8}}
              - {research: DOMESTICATION, when: {soldiers: 8}}
              - {research: WOODWORKING, when: {soldiers: 8}}
            raids:
              - {units: [SCOUT], count: 5, first: 360, every: 180, target: villagers, fallback: {x: 78, y: 18}}
            attack: {first: 300, every: 360, min_group: 20, max_group: 25, percent: 100, target: 1,
                     warm_up: {attacks: 3, min_group: 5, max_group: 8, every: 180}}
  08_religion:
    # Mission 8: you start walled in at Heliopolis (Town Center 50,48) with 4 Villagers, 1 Priest (68,42) by the
    # Temple (70,42), a Barracks, Archery Range, Stable and Market. The Libyans (P2): Town Center 8,44, 7 Bowmen,
    # 2 Villagers and the Stone Thrower (15,37). Objective: capture the Stone Thrower and bring it to the marked
    # area by your Town Center (46-52, 44-50), or defeat the Libyans.
    # The user's design (2026-11-08): the Libyans are passive but military: Bronze Age, never attack, no Siege
    # Workshop of their own making (and no Stone Throwers). Moderate and Hard: no new Priests, and losing yours
    # loses the mission; a Stone Thrower is required (defeating the Libyans isn't enough): theirs, or one you train
    # at their Siege Workshop once you've converted it. You can't build a Siege Workshop yourself.
    start: {2: {age: bronze_age, food: 1500, wood: 1500, gold: 1000, stone: 300}}
    setup:
      - {type: enable_disable_object, source_player: 2, object_list_unit_id: [280, 49, 150], enabled: 0}
      - {type: enable_disable_object, object_list_unit_id: [49, 150], enabled: 0}
    primary_extra:
      text: "Have a Stone Thrower at your Town Center: theirs, or one from their Siege Workshop (convert it)."
      conditions: [{type: objects_in_area, object_list: 280, area_x1: 46, area_y1: 44, area_x2: 52, area_y2: 50,
                    quantity: 1}]
    units:
      # The Libyans' Siege Workshop (49) between their camp and the Stone Thrower, Moderate and up: convert it
      # and train your own Stone Thrower (the user, 2026-11-08).
      - {player: 2, unit: 49, x: 12, y: 40, from: moderate}
      # Moderate: 5 Composite Bowmen (492) and 5 Short Swordsmen (74) around the Stone Thrower; Hard adds 10
      # Chariots (1370) and 10 Chariot Archers (5). The AI keeps them up.
      - {player: 2, unit: 492, x: 17, y: 38, from: moderate}
      - {player: 2, unit: 492, x: 15, y: 41, from: moderate}
      - {player: 2, unit: 492, x: 11, y: 36, from: moderate}
      - {player: 2, unit: 492, x: 16, y: 33, from: moderate}
      - {player: 2, unit: 492, x: 16, y: 41, from: moderate}
      - {player: 2, unit: 74, x: 11, y: 35, from: moderate}
      - {player: 2, unit: 74, x: 17, y: 33, from: moderate}
      - {player: 2, unit: 74, x: 10, y: 37, from: moderate}
      - {player: 2, unit: 74, x: 11, y: 34, from: moderate}
      - {player: 2, unit: 74, x: 18, y: 33, from: moderate}
      - {player: 2, unit: 1370, x: 10, y: 36, from: hard}
      - {player: 2, unit: 1370, x: 10, y: 38, from: hard}
      - {player: 2, unit: 1370, x: 16, y: 42, from: hard}
      - {player: 2, unit: 1370, x: 10, y: 35, from: hard}
      - {player: 2, unit: 1370, x: 10, y: 39, from: hard}
      - {player: 2, unit: 1370, x: 17, y: 42, from: hard}
      - {player: 2, unit: 1370, x: 11, y: 33, from: hard}
      - {player: 2, unit: 1370, x: 10, y: 34, from: hard}
      - {player: 2, unit: 1370, x: 10, y: 40, from: hard}
      - {player: 2, unit: 1370, x: 9, y: 35, from: hard}
      - {player: 2, unit: 5, x: 21, y: 39, from: hard}
      - {player: 2, unit: 5, x: 20, y: 41, from: hard}
      - {player: 2, unit: 5, x: 9, y: 34, from: hard}
      - {player: 2, unit: 5, x: 12, y: 43, from: hard}
      - {player: 2, unit: 5, x: 21, y: 40, from: hard}
      - {player: 2, unit: 5, x: 22, y: 37, from: hard}
      - {player: 2, unit: 5, x: 22, y: 36, from: hard}
      - {player: 2, unit: 5, x: 22, y: 38, from: hard}
      - {player: 2, unit: 5, x: 22, y: 39, from: hard}
      - {player: 2, unit: 5, x: 8, y: 34, from: hard}
    rewards: [zealots, pilgrims]
    bonus:
      - text: "Convert 10 enemy units."
        # Conversions, resource 41 (unverified in RoR).
        conditions: [{type: accumulate_attribute, attribute: 41, quantity: 10}]
        # Moderate and Hard rules (this objective shows on both, so its setup and triggers are theirs):
        setup:
          # no new Priests
          - {type: enable_disable_object, object_list_unit_id: 125, enabled: 0}
          # Priests may convert buildings (the Siege Workshop): in RoR that's Monotheism's resource 28 (RoR's data)
          - {type: modify_resource, tribute_list: 28, operation: SET, quantity: 1}
          # the Libyans' army is Moderate's and Hard's own, not the original's 7 Bowmen
          - {type: remove_object, select: {player: 2, unit: 4}}
        triggers:
          # Losing your Priest loses the mission: the Libyans win.
          - name: priest lost
            conditions: [{type: own_fewer_objects, object_list: 125, quantity: 0}]
            effects:
              - {type: display_instructions, display_time: 10, message: "Your Priest has fallen. Heliopolis is lost."}
              - {type: declare_victory, source_player: 2, enabled: 1}
        rewards: [prophets, temple_guard]
      - text: "Bring home the Libyans' own Stone Thrower, not one you train."
        # The original's objective as a bonus: the Libyans' Stone Thrower captured and in the marked area.
        conditions:
          - {type: capture_object, select: {player: 2, unit: 280}, source_player: 1}
          - {type: bring_object_to_area, select: {player: 2, unit: 280}, area_x1: 46, area_y1: 44, area_x2: 52,
             area_y2: 50}
        rewards: [captured_engineers, divine_mandate]
    ai:
      # The Libyans: passive (no attack), military. They fight what comes near and replace their losses.
      #   Standard: about 10 Bowmen and Axemen, a small economy, no upgrades.
      #   Moderate: 10 Composite Bowmen and Short Swordsmen, Bronze Age armour and weapon upgrades.
      #   Hard: Moderate's, plus 10 Chariots and 10 Chariot Archers (Chariots resist conversion), cavalry armour.
      2:
        replace: true
        name: Libyans
        step_timeout: 120
        scout: false
        build_order:
          - {build: HOUSE}
          - {build: BARRACKS}
          - {build: FARM, count: 3}
          - {research: BATTLE_AXE}
        levels:
          easy:
            villagers: 8
            keep:
