    effects:
      - {type: modify_attribute, object_list_unit_id: [79, 234, 235, 236], object_attributes: 106, operation: SET,
         quantity: 0}
      - {type: modify_attribute, object_list_unit_id: [79, 234, 235, 236], object_attributes: 104, operation: ADD,
         quantity: 50}
  royal_quarries:
    label: "Royal Quarries"
    text: "Stone and gold miners work twice as fast."
