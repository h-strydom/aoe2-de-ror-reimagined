    effects: [{type: modify_attribute, object_list_unit_id: [124, 220, 579, 581], object_attributes: 13,
               operation: MULTIPLY, quantity: 2}]

  # Religion, primary (quality of life)
  zealots:
    label: "Zealots"
    text: "Priests convert instantly, but their faith recharges three times slower."
    # The user's idea (2026-11-08). RoR's Priest (125, class 18): work rate (13) 1.0, faith recharge (10, "reload")
    # 2.0 (Fanaticism adds 1); Astrology multiplies the work rate by 1.3 and lowers resources 176/177 (Convert
    # Min/Max Adjustment, the seconds before a conversion can happen / is forced) by 1 each (RoR's data, read with
    # genieutils 2026-11-08). Instant: both adjustments far below zero and 10 times the work rate (unverified).
    effects:
      - {type: modify_resource, tribute_list: [176, 177], operation: SET, quantity: -20}
      - {type: modify_attribute, object_list_unit_id: 125, object_attributes: 13, operation: MULTIPLY, quantity: 10}
      - {type: modify_attribute, object_list_unit_id: 125, object_attributes: 10, operation: DIVIDE, quantity: 3}
  pilgrims:
    label: "Pilgrims"
    text: "Each Temple gives 5 gold every 5 seconds, up to 2 Temples."
    # Temples 104/30/31/32 (every age's). Every 5 seconds: pay last count's gold, count again; a looping trigger
    # keeps the count at 2 at most (the user, 2026-11-08). Repeats through the relay like Town Tithes.
    triggers:
      - name: start
        effects: [{type: activate_trigger, trigger_id: "@pay"}]
      - name: pay
        conditions: [{type: timer, timer: 5}]
        effects:
          - {type: modify_variable_by_variable, variable: "RI pilgrim gold", operation: SET, variable2: "RI temples"}
          - {type: change_variable, variable: "RI pilgrim gold", operation: MULTIPLY, quantity: 5}
          - {type: modify_resource_by_variable, tribute_list: 3, operation: ADD, variable: "RI pilgrim gold"}
          - {type: count_units_into_variable, object_list_unit_id: 104, variable2: "RI temple a"}
          - {type: count_units_into_variable, object_list_unit_id: 30, variable2: "RI temple b"}
          - {type: count_units_into_variable, object_list_unit_id: 31, variable2: "RI temple c"}
          - {type: count_units_into_variable, object_list_unit_id: 32, variable2: "RI temple d"}
          - {type: modify_variable_by_variable, variable: "RI temples", operation: SET, variable2: "RI temple a"}
          - {type: modify_variable_by_variable, variable: "RI temples", operation: ADD, variable2: "RI temple b"}
          - {type: modify_variable_by_variable, variable: "RI temples", operation: ADD, variable2: "RI temple c"}
          - {type: modify_variable_by_variable, variable: "RI temples", operation: ADD, variable2: "RI temple d"}
          - {type: activate_trigger, trigger_id: "@pay"}
      - name: two
        looping: true
        conditions: [{type: variable_value, variable: "RI temples", comparison: LARGER, quantity: 2}]
        effects: [{type: change_variable, variable: "RI temples", operation: SET, quantity: 2}]
