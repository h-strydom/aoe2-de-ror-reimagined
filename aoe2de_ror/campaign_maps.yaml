  pin_colour: blue
  missions:
    - {at: [455, 320], icon: CampaignIconVillagerBuilder}       # The Birth of Rome
    - {at: [790, 480], icon: CampaignIconWarElephantAttack}     # Pyrrhus of Epirus
    - {at: [600, 690], icon: CampaignIconHeavyCatapult}         # The Siege of Syracuse
    - {at: [520, 230], icon: CampaignIconCenturionAttack}       # The Battle of the Metaurus
    - {at: [300, 770], icon: CampaignIconWarElephantBigger}     # The Battle of Zama
    - {at: [1420, 420], icon: CampaignIconPhalanxWalk}          # Mithridates

ave_caesar:
