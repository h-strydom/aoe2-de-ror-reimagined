  pin_colour: blue
  missions:
    - {at: [990, 480], icon: CampaignIconWarGalley}             # Caesar's Revenge
    - {at: [335, 85], icon: CampaignIconHeavyTransportIdle}     # The Invasion of Britain
    - {at: [500, 225], icon: CampaignIconCenturionAttack}       # The Siege of Alesia
    - {at: [940, 420], icon: CampaignIconCavalryIdle}           # The Battle of Pharsalus

imperium_romanum:
  base: 2
  pin_colour: blue
  missions:
    - {at: [690, 480], icon: CampaignIconWarGalleyIdle}         # The Battle of Actium
    - {at: [600, 430], icon: CampaignIconTrajan}                # The Year of the Four Emperors
    - {at: [1130, 640], icon: CampaignIconArtifact}             # Ransom at Ctesiphon
    - {at: [1040, 600], icon: CampaignIconCavalryIdle}          # Zenobia, Queen of Palmyra
    - {at: [470, 250], icon: CampaignIconScout}                 # The Coming of the Huns

enemies_of_rome:
