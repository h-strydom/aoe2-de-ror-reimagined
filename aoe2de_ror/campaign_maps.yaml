# Campaign screens: our own map on RoR's blank campaign book, for every campaign.
#
# `reimagined convert` builds each campaign's layout from this file; `convert --install` also draws the
# map (from AoE DE's briefing maps, local only) onto the book and makes any custom pins.
#   base:       which mission's AoE DE briefing map becomes the page (it shows every mission's location)
#   pin_colour: red, orange, yellow, green, cyan, blue, purple or grey. RoR's pins are blue; other colours
#               recolour copies of them. AoE DE sprite pins are drawn in that player colour.
#   missions:   one entry per mission, in order
#     at:     [x, y] on the base briefing map (1511 x 850 pixels); pins too close together are spread apart
#     icon:   one of RoR's 39 campaign pins (CampaignIcon...), e.g. CampaignIconChariot
#     sprite: or an AoE DE unit/building sprite (Assets/SLP file name) drawn as a pin, with
#             frame: which frame (the facing), scale: size of the unit in its pin (default 1)
#     size:   pin size on the screen (default 260)
#     label:  where the mission's name goes, below (default) or above the pin

ascent_of_egypt:
  base: 7
  pin_colour: grey
  missions:
    - {at: [770, 300], icon: CampaignIconVillagerHunter}                  # Hunting
    - {at: [850, 290], icon: CampaignIconVillagerForagerGather}           # Foraging
    - {at: [690, 265], icon: CampaignIconScout}                           # Discoveries
    - {at: [800, 360], icon: CampaignIconVillagerFisher}                  # Advancing to the next Age
    - {at: [720, 400], icon: CampaignIconBowmanAttack}                    # Skirmish
    - {at: [800, 460], icon: CampaignIconVillagerFarmerGather}            # Farming
    - {at: [900, 215], icon: CampaignIconTradeBoat, label: above}         # Trade
    - {at: [880, 340], icon: CampaignIconPriestConverting}                # Religion
    - {at: [820, 700], icon: CampaignIconTransportShipSmall}              # The River Outpost
    - {at: [560, 230], icon: CampaignIconScoutShip, label: above}         # Naval Battle
    - {at: [860, 570], icon: CampaignIconVillagerBuilder}                 # A Wonder of the World
