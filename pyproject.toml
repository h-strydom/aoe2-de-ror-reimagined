[project]
name = "aoe2-de-ror-reimagined"
version = "0.1.0"
description = "Convert the Age of Empires: Definitive Edition campaigns to AoE2 DE Return of Rome, then reimagine them."
authors = [
    { name = "Hannes Strydom", email = "13560787+h-strydom@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    # The scenario toolkit: writes RoR scenarios/campaigns and knows RoR's names. Pinned to a release tag;
    # bump it when this project needs a new toolkit feature.
    "aoe-agent-editor @ git+https://github.com/h-strydom/aoe-agent-editor@v0.14.0",
    "lz4>=4.4.5",
    "pillow>=13.0.0",
    "opencv-python-headless>=5.0.0.93",
    "soundfile>=0.14.0",
]

[project.scripts]
reimagined = "reimagined.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
 "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/reimagined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Tests run side by side, one worker per CPU core (`-n 0` for one process, e.g. with a debugger).
addopts = "-n auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "UP", "I"]
ignore = ["E501"]
