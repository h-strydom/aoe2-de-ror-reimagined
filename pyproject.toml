[project]
name = "aoe2-de-ror-reimagined"
version = "0.1.0"
description = "Convert the Age of Empires: Definitive Edition campaigns to AoE2 DE Return of Rome, then reimagine them."
authors = [
    { name = "Hannes Strydom", email = "13560787+h-strydom@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
reimagined = "reimagined.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reimagined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "UP", "I"]
ignore = ["E501"]
