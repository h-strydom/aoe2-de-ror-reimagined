text:
  instructions: |-
    Mycenae, 1600 BCE

    The Mediterranean climate of the Peloponnese region is well suited to agriculture. To thrive and expand in an increasingly hostile world, however, your people must take possession of suitable forage lands. Three other groups already inhabit this area—of the three, the Pelasgians are the strongest. Establish five Farms to sustain the agricultural needs of your people, and destroy all Pelasgian Farms to deal a crippling blow to your most powerful neighbor. It may be necessary to eliminate the Achaeans or Danaans to obtain a foothold in this region before taking the fight to the Pelasgians.

    Objectives:
    • Destroy all Pelasgian Farms.
    • Build 5 Farms.
  hints: |-
    1. The first potential location for your Town Center is also the hardest to defend. Looking for a better place to construct your base is advisable.
    2. Attack only when you are truly ready; the Pelasgians are well prepared for an onslaught.
    3. Our rivals have claimed several important resource gathering sites. Seizing these will be vital to your success.
    4. The Mycenaeans are restricted to the Tool Age—you cannot advance to the Bronze Age.
  victory: |-
    Your victory over the neighboring chiefdoms has ensured that your people have access to the most fertile land available to sow their crops. The Pelasgians, Achaeans, and Danaans have all either submitted to your rule, or fled into neighboring regions to lick their wounds. Your people can now focus on building settlements, establishing trade routes, and spreading their influence into neighboring areas.
  loss: |-
    Your people fought valiantly, but they lacked the charismatic leadership of their adversaries. Constant enemy raids have broken your will and forced you into the barren, harsh lands that the other inhabitants find undesirable. Living off what little can be gleaned from the unforgiving landscape, your people dream of a day when a more capable leader will rise up and show them a glimpse of a brighter future.
  history: |-
    Mycenaean civilization first developed in the Argolis region of the Peloponnese, but soon spread to many of the neighboring lands. The early Mycenaean economy was primarily based on a combination of agriculture and pastoralism, centered on the cultivation of cereal crops and the keeping of livestock. When improved farming techniques increased agricultural efficiency, Mycenaean society complexified considerably, allowing for a division of labor and significant expansion. The Mycenaeans developed new industries, including—but not limited to—pottery, metalworking, shipbuilding, and trade with neighboring regions. They excelled at the smithing of bronze and other metals, crafting works of art, and forging various tools and weapons of war with which to combat their enemies. One of the most famous artifacts of the period is the so-called Mask of Agamemnon, a gold burial mask dating to the 16th century BCE.

    Although the Greek climate was generally favorable, much of the land was rugged and mountainous, and fertile farmland was limited. Competition over farmland and mineral resources fostered conflict between neighboring groups and the city-states that later emerged. Chiefdoms warred with each other constantly, and while pitched battles were rare, warfare often involved the destruction of enemy agriculture and the theft of enemy cattle—attacks designed to cripple the ability of the enemy to obtain food. Crops were burned, olive trees were felled, and livestock were stolen or slain on the spot. As a result, settlements tended to shift from locations near farmland to hilltop citadels—or akropoleon, as the Greeks called them—that were more readily defensible.

    Mycenaean societies coalesced around these fortified settlements. The common people were ruled by a warrior elite, often with a king at the head, known in the local language as a wanax. Funerary practices complexified around this time, and much of the archaeological evidence of Mycenaean culture available to historians is found in burial sites. Although conflict was common, city-states tended to show preference towards building diplomatic relationships and economic connections with their neighbors, and later expanding those overseas. Mycenaean artifacts have been discovered in numerous coastal locations around the Aegean Sea, and even as far away as Cyprus, Egypt, and the Phoenician homeland in the eastern Mediterranean.
