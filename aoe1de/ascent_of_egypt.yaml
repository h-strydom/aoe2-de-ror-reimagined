description: |-
  Take your first steps in Age of Empires by experiencing the story of the world's longest continuous civilization. As the guiding spirit of Egypt, settle along the fertile Nile River, wage war and unite the kingdoms of Upper and Lower Egypt with Narmer, build the great monuments of Hatshepsut, and venture into foreign lands to conquer the Nubians and Canaanites.

  Experienced Age of Empires players may start with Scenario 9 - The River Outpost.
