text:
  instructions: |-
    Northeast Sicily, 260 BCE

    The Romans have not ceased their meddling. More disturbingly, they have studied one of your wrecked warships and are using it as a model to build an entire fleet! These ships will allow them to protect their supply lines from Italy, keeping their armies in Sicily equipped and reinforced. The first of these new vessels are nearing your positions off the coast of Mylae. To demonstrate the futility of challenging Carthage at sea, capture the Roman supply carts and bring them back to your base. May Ba'al Hammon guide you!

    Objectives:
    • Bring two War Chests containing Roman supplies to the blue flagged area on your island.
    • Alternatively, kill your opponents.
  hints: |-
    1. Use towers and walls along the coastline to defend against the Roman navy while you construct your own navy.
    2. Explore the map to find additional resources.
  victory: |-
    Your victory has reminded the Romans that Carthage rules the waves. Despite their defeat, however, the Romans remain undaunted and have continued to work on building their fleet. With the speed with which they have already replaced their losses, you worry that even Carthaginian shores will soon be threatened.
  loss: |-
    The failure of the Carthaginian forces under your command has undone our recent victories over Rome. The people of Sicily now send tribute to Rome, not Carthage. The captain of your ship has been ordered to throw you overboard so that you can swim home through shark-infested waters to receive new orders.
  history: |-
    Although the Roman supply lines in Sicily benefited from the alliance with Syracuse, Rome could not effectively provide reinforcements from Italy, nor take the war to Carthage, without first challenging Carthaginian sea power. Polybius relates that the Romans found a wrecked Carthaginian quinquereme, a heavy warship with five rows of oars, compared to a trireme with only three, and used it as a model to rapidly build an entire fleet.

    The Romans also innovated with the corvus, Latin for crow, a boarding bridge affixed to Roman ships which allowed them to board and capture enemy vessels. This was a critical invention for the Romans who, while superior at melee combat, were less effective at the ranged combat and ramming tactics generally used by naval powers like Carthage. The emphasis on boarding allowed Rome to leverage her army's strengths by effectively turning sea battles into land battles on the decks of ships. It also provided the Romans with captured Carthaginian vessels to add to their growing navy.

    Off the coast of Mylae in Northeast Sicily, Rome and Carthage fought their first major naval battle in 260 BCE. The use of the corvus won the battle for Rome, helping the Romans seize 50 Carthaginian ships, including the Carthaginian flagship. Rather than pursue the retreating Carthaginians, the Roman commander sailed to Sicily to take command of his land troops and relieve the siege of the city of Segesta. This allowed Carthage's navy to escape to fight later battles.
