text:
  instructions: |-
    Carthaginian Coast, 255 BCE

    Frustrated by your victories in Sicily, the Romans have sent the general Regulus to attack our homeland in Africa. His army now threatens the city of Carthage while the Roman navy approaches to blockade our ports. You must defend Carthage from these attacks and turn the tides of the battle. May Ba'al Hammon protect us and grant us victory!

    Objectives:
    • Destroy the Roman Wonder.
    • Build your own Wonder in the center of Carthage, inside the blue flags.
  hints: |-
    1. The mercenary force of the Spartan soldier of fortune, Xanthippus, is available for hire if you can find it.
    2. It is not necessary to destroy the Roman shipyards, only to prevent their navy from destroying your Wonder.
    3. Use some of Carthage's best military units, including Long Swordsmen, Fire Galleys, and War Elephants.
  victory: |-
    You have snatched victory from near defeat! The Roman army has been crushed and Regulus sits in chains in your tent. Word has come that the fleeing survivors of the Roman fleet were caught in a storm and found their graves at the bottom of the sea. While your stunning victory has saved Carthage, you know that the Romans will never surrender. You fear that you have only delayed their eventual triumph.
  loss: |-
    Your failure to defeat the Roman army has forced us to accept their peace terms, which are harsh. Take note of the treaty clause requiring that you serve out your years in a Roman stone quarry.
  history: |-
    The war in Sicily increasingly became an endeavor of one lengthy siege after another. Seeking a swifter victory, the Romans planned a daring invasion of the North African coast to take the war to the Carthaginian homelands.

    At the Battle of Cape Ecnomus (256 BCE), off the southern coast of Sicily, the Romans defeated Carthage in one of the ancient world's largest naval battles. Over 600 vessels participated in the engagement, which demonstrated that Rome could now challenge Carthage at sea on an equal footing. The victory allowed the Roman army, under the command of Marcus Atilius Regulus, to land in Africa.

    At the Battle of Adys (255 BCE), Regulus defeated the Carthaginians, plundering the countryside and marching on Carthage. This weakening of the North African power incited the Numidians, a Berber people and sometime allies of Carthage, to revolt. Refugees from the pillaged countryside fled to the capital, causing an outbreak of disease and hunger.

    Fortunately for Carthage, a Spartan mercenary general named Xanthippus appeared. The Spartan recognized that Carthage's cavalry and elephants, the backbone of its army, would fight best on open ground, allowing them to maneuver. Previously, Carthaginian generals had sought to fight the Romans in sieges and on rough terrain, where the tough Roman infantry held the advantage.

    These changes were crucial to Carthaginian success at the Battle of Tunis, also known as the Battle of Bagradas, in 255 BCE. Battered by an elephant charge, flanked by the Carthaginian cavalry, and unable to defeat the Carthaginian phalanx in the center, the Romans were routed by a final cavalry charge. Regulus was captured and, according to Roman legends, was released on parole to negotiate a peace. In Rome, he urged the Senate to refuse the peace proposal and, fulfilling the terms of his parole, was said to have returned to Carthage to be tortured to death. The defeat of the Romans at Tunis was followed by the sinking of the Roman fleet in a storm, ending Rome's attempts at invading Africa during the war. The First Punic War would drag on for another fourteen years culminating in Carthage's defeat at the Battle of the Aegates in 241 BCE.

    As for Xanthippus, his final fate is uncertain. Diodorus of Sicily writes that after the Battle of Tunis, the Spartan general saved the city of Lilybaeum in Sicily from a Roman siege. Leaders in the city were jealous of their savior's success and betrayed him by giving him a leaky ship for his voyage home.
