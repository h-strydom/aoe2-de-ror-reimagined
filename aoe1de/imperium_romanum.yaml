description: |-
  Even as Rome ruled the world and attained the heights of civilization, the seeds of discord took root and cracks appeared in the imperial marble. In time, strife, rebellion, and disaster struck. Can you defeat pretenders, crush rebellions on the frontiers, and withstand the assault of the most barbarous horsemen to ever ride against civilization? Can you save Rome from falling into ruin?
