text:
  instructions: |-
    Syracuse, 214 to 212 BCE

    Roman power is threatened. The Carthaginian general Hannibal has crossed the Alps into Italy. His successes have incited factions in Syracuse to break the city's long-standing alliance with Rome—an alliance formed with the defeat of Pyrrhus. Though no general of Syracuse compares to Hannibal, take care when besieging that wealthy city. The great engineer and inventor Archimedes has constructed wondrous methods of defense against both land and sea attacks. Although he is an advisor to Rome's enemies, he must be captured alive. Take Syracuse but preserve the life of Archimedes, as he will be useful to us.

    Objectives:
    • Place 10 Roman Legion units in the Syracuse forum (raised area marked by two yellow flags).
    • Do not kill Archimedes (Priest).
  hints: |-
    1. Beware Archimedes' powerful towers. If you must face them, attack them in great numbers.
    2. Use Catapults only when necessary as the area of effect damage of their stones could accidentally kill Archimedes.
  victory: |-
    The victory over Syracuse reminds the Greeks of Sicily that Rome will punish treachery. Hannibal's efforts to spread rebellion have failed and his rampage through Italy has been slowed. Now, spies tell the Senate that Hannibal has called for reinforcements.
  loss: |-
    Your failure to retake Syracuse and the heavy losses you have sustained have infuriated the leaders of Rome. More of our old foes have been inspired to join the Carthaginians in this war. Our list of enemies grows daily. The next time you encounter a Carthaginian War Elephant, we suggest you kick it in a sensitive spot and take your medicine.
  history: |-
    Following Rome's victory over Pyrrhus, the growing Republic continued its southward expansion, seizing control of Southern Italy. Roman designs on the island of Sicily, settled by Greek colonists, brought the Republic into conflict with Carthage, a maritime power based on the coast of modern-day Tunisia. In the ensuing First Punic War (264 – 241 BCE), Rome was victorious, seizing control of Sicily save for Rome's ally, the city of Syracuse, and emerging as the preeminent land and naval power in the central Mediterranean.

    Carthage would attempt to reassert herself during the Second Punic War (218 – 202 BCE). The general Hannibal led an army from Hispania (modern Spain and Portugal), across both Gaul and the Alps, to invade Italy. Hannibal was immensely successful, destroying multiple Roman armies sent against him, but lacked the siege equipment to take the city of Rome itself. Nevertheless, his successes encouraged many southern cities with primarily Greek and Italic populations to defect from Roman rule.

    Although Syracuse had been a long-time Roman ally during the reign of King Hiero II, a former general of Pyrrhus, his teenage grandson and successor, Hieronymus, held no such loyalties. Though Hieronymus was soon assassinated in a coup, the pro-Carthaginian factions within Syracuse had decided the city's fate—Rome sent a fleet forth to take Syracuse.

    The famed inventor, engineer, and mathematician Archimedes lived in Syracuse and aided the city's defense. Legends tell that he constructed hexagonal mirrors that focused the sun's rays to set alight Roman ships, and great swinging claws that could lift ships out of the water by their rams and drop them back to the water, smashed like toys. Against these devices and the natural defenses of the Sicilian shore, the Romans were bogged down into a lengthy siege, but were ultimately victorious.

    Although the Roman commander, Marcus Marcellus, had ordered that Archimedes be spared, the great inventor would not survive the battle. As the Romans took the city, Archimedes retired to his studies but was disturbed by a Roman soldier. Archimedes protested the interruption and commanded the soldier to leave. The nameless Roman soldier, perhaps unaware of the man's identity, killed Archimedes. The Roman writer Plutarch tells us that Marcellus was greatly distressed when he learned of the pointless death of the Greek genius—one of the greatest minds the world had ever known.
