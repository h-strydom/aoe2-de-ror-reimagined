text:
  instructions: |-
    The Fourth Cataract, 1878-1860 BCE

    Objectives: Find the island and build on it.

    • Locate the island on the Nile River
    • Build a Town Center on the island
    • Build two Sentry Towers on the island

    For centuries, the Nubians of the South have attacked and pillaged our cities in Upper Egypt. Pharaoh Senusret III is determined to deal with them for good. His plan is to subdue lower Nubia by building forts along the Nile River all the way to the Fourth Cataract. To the south of your position, there is an island on the Nile which would be an ideal location for such a fort. Explore the island, clear it of enemies, and build a Town Center and two Sentry Towers there. But remember to be wary of Nubian raiders coming down the river.

    TRANSPORTING UNITS ACROSS WATER
    Villagers, military units, and Artifacts can be loaded aboard a transport vessel and moved across water. Allied units can also be transported. Each transport vessel can carry a limited number of villagers, military units, and Artifacts in each trip.

    To load a transport vessel, build a Light Transport or Heavy Transport at the Dock, click the unit to load, and then right-click the transport vessel.

    To unload a transport vessel, click the transport vessel, click the Unload button at the bottom of the game screen, and then click a location on shore or in the shallows.

    TOWERS
    To build Sentry Towers, you first have to research the technology at the Granary. Once it is completed, your Watch Towers will have upgraded to the stronger Sentry Towers.

    To display the objectives while you are playing the game, click the Objectives button in the upper-right corner of the game screen. For more tips on achieving the objective, click on Hints. To open this page again while you are playing the game, open the menu and click on the Scenario Instructions button.
  hints: |-
    1. There are towers on the island that you must destroy before you can start constructing there.
    2. To eliminate the towers, build war ships, or create a small band of infantry units, such as Axemen and transport them to the island to take them down.
    3. In order to be able to build a second Town Center, you must be in the Bronze Age and have a Government Center.
    4. You will need to build a transport to carry villagers to the island to build the Town Center. You should take several villagers because the island is inhabited by hungry lions and crocodiles, which will attack your villagers on sight.
    5. When the island is free from predators, you can build a Town Center and begin gathering the stone you need to build two Sentry Towers.
  victory: |-
    Risking their lives, your builders managed to construct the fort on the Nile River island. It is only one of many forts, but it is certainly the most important as it controls access to the river itself. Your stalwart soldiers man the fortifications, and thus the Nubians have given up on their attempts to raid Egypt. You do not believe the Nubians will be stopped permanently, but your actions have brought peace for the time being.
  loss: |-
    Attacking by night, the hostile Nubians managed to pick off your builders one by one, dooming your fort's construction. Because of the sizable gap you have allowed to appear in the Egyptian defenses, the Nubians are now able to raid Egypt at will. The pharaoh is sending you on a solo scouting mission into Nubian lands without food, water or weapons. Pray to Ra that your end is swift, and that Osiris’ judgement is lenient.
  history: |-
    Following the First Intermediate Period, prince Mentuhotep II (c. 2061 – 2010 BCE) of the 11th dynasty built on the successes of his predecessors and re-united Egypt by defeating the rulers of Herakleopolis in Lower Egypt. This ushered in a new period in Egyptian history called the Middle Kingdom. Mentuhotep II made Thebes the capital of the kingdom and is sometimes referred to as the "second Menes", in remembrance of the first ruler of the Old Kingdom, identified with Narmer, who united Egypt centuries before. Egyptian society had changed drastically since the Old Kingdom, despite the attempts by Middle Kingdom pharaohs to emulate their predecessors from the previous era. Local officials had much more power and wealth, and it had become easier for them to rise in rank. These differences are apparent in Egyptian art of the period. Pharaohs were no longer the only ones commissioning art, as local rulers and the upper class could do so as well, resulting in greater variety and diversity of artwork.

    Conflict with Egypt's southern neighbors, the Nubians, was very common in this period, but it was not until the reign of Senusret III (c. 1878 – 1860 BCE) that Egypt made significant conquests in the south. Senusret III led four military expeditions against the Nubians and managed to bring lower Nubia, in the north of the region, under Egyptian control. To consolidate these conquests, the pharaoh ordered his subordinates to build a network of fortifications along the border to block further raids by Nubians.

    Senusret III is also known to have led a military expedition into Canaan, but his main achievement was in bringing stability and prosperity to Egypt. During his reign, the cults of Osiris and Amun became increasingly popular and Osiris would become a very important god of the afterlife, where he served as ruler and judge. Senusret III also finished the construction of Amun's Temple near Karnak begun by Mentuhotep II. This temple was the largest religious building ever constructed at its time. The reigns of Senusret III and the other kings of the 12th dynasty are considered to be a golden age for Egypt.
