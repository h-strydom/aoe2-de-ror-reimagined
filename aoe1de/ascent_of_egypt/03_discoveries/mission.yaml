text:
  instructions: |-
    Island in the Nile Delta, 8000 BCE

    Objective: Find 5 Discoveries before the Libyans find them.

    • Discoveries are in the shape of a white horse
    • Walk through the Discovery to capture it
    • Create multiple villagers to protect explorers

    As your hunters venture out, they begin to encounter other cultures to the west, along the Mediterranean Coast. You have sent parties of explorers to search the borderlands to learn about these people whom you call Libyans. According to legends, there are sacred sites nearby. These can be recognized by the shape of a white horse etched into the ground.

    GROUPING UNITS
    To group units, click and drag the pointer over the units you want to group (or hold down the CTRL key and click each unit). To assign a number to a group, select a group, hold down the CTRL key and press the number you want to assign to the group. For example, to assign the number 2 to a group, press CTRL+2. The number will appear on each unit in the group. Once a group has been assigned a number, you can just press that number to select it. To add units to a group, select the unit or units you want to add to the group. Hold down the SHIFT key and press the number of the group you want to add to the unit or units to (this causes both the group and the new units to be selected). Then hold down the CTRL key and press the number of the group you want to add the unit or units to.

    EXPLORING THE MAP
    To explore the map, click a villager (or group) and then click a location in the fog of war. When your units get close to the fog of war it will start to recede and the terrain and units in it, previously hidden, will be revealed.

    FINDING DISCOVERIES
    Discoveries are in the shape of a white horse and can be controlled by multiple civilizations. To "capture" the Discovery, a unit must walk through or right next to it. Once the unit is in contact with the Discovery, a flag will rise above it. The color of the flag corresponds to the color of the unit that captures the Discovery.

    To display the objectives while you are playing the game, click the Objectives button in the upper-right corner of the game screen. For more tips on achieving the objective, click on Hints. To open this page again while you are playing the game, open the menu and click on the Scenario Instructions button.
  hints: |-
    1. The more villagers you create, the more protection you have from predators and hostile people as you explore the map in search of the Discoveries.
    2. You must hunt or forage for food to create new villagers and chop wood to build additional Houses to support the new villagers. After you have created several villagers, you can group them and explore the map in search of the five Discoveries.
    3. If you are attacked by the enemy units or predators (Lions or Crocodiles), retaliate with your group of villagers, and then resume your search for the Ruins as quickly as possible. For example, if you kill a predator, don't stop to gather the food from its carcass.
  victory: |-
    Your band of explorers has discovered the sacred sites and pushed back the invaders from the west. You do not believe this is the last you will see of these Libyans, however.
  loss: |-
    After your failure, the Libyans drove your people from their homes in the Nile Delta. Your tribe is now forced to wander the desert wastes in search of a new land. You had better start praying to the rain god.
  history: |-
    Human populations around the world expanded following the end of the last Ice Age and gradually settled in the locations where food was plentiful. Once the better spots were taken, competition began over who would hold these locations. A good site might mean the difference between survival or death during a drought.

    Geographic features took on special meaning to those groups settled permanently in an area. Waterfalls or interestingly shaped rock faces, for example, might have special properties associated with them. Ownership of these features was a source of pride for the group. Loss of control to neighbors might have been a blow to the unity or strength of the group.

    Prehistoric peoples had an affinity for the natural world that is not found in sedentary cultures. Awareness of what was going on around them was critical to the survival of a family group or tribe. Prehistoric peoples knew the territory around them well and could orientate themselves using geographic landmarks. Exploring and making new discoveries may have been pleasurable, but it was also a necessity.
