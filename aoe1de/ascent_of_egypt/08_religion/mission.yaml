text:
  instructions: |-
    Heliopolis, around 2500 BCE

    Objectives: Capture (convert) the Stone Thrower and bring it to your Town Center.

    • Use Priests to convert enemy units
    • Research at the Temple for upgrades to Priests
    • Mine gold to replace killed Priests

    Egyptian culture is flourishing and the population is growing. In order to provide for the administration of the kingdom and serve the gods, new professions have been established. Scribes and priests help the pharaoh in his dealings with the military, the people, and the gods. These new specialists have quickly gained prominence and become vital to Egyptian civilization.

    In the north, west of the Nile Delta, scouts report Libyan raiding parties are approaching one of Egypt's most sacred cities, Heliopolis, built to honor the Sun God Ra. As the lector priest of the city's main temple and army scribe of the pharaoh, you are commanded to stop these raiders at all costs. The priests in the city have offered their services to support the army. However, you must be wary of the Libyans who bring a siege engine with them to demolish the city's walls. This machine could be useful for our own armies, so instead of destroying it, the pharaoh has ordered you to capture this Stone Thrower and bring it to the Town Center at Heliopolis.

    CONVERTING ENEMY UNITS
    To convert an enemy unit, click a Priest, and then right-click the unit to convert. Or click the Convert button, and then click the enemy unit to convert. The unit is converted to the Priest's civilization. Researching Afterlife (at the Temple) increases the range of Priests for converting military units. Researching Monotheism (at the Temple) lets Priests convert buildings and enemy Priests. To convert buildings, the Priest must move adjacent to the building. Boats are twice as resistant to conversion as other units. Chariots are also resistant to conversion. Researching Astrology (at the Temple) lets Priests convert units more quickly. Priests must rejuvenate their strength after attempting a conversion. The faith percentage is shown in the status box at the bottom of the game screen. Researching Fanaticism allows Priests to recover their faith more quickly. Priests do not automatically convert nearby units, unless they are attacked. When the Priest has converted a unit, he stands idle until given another command. If a Priest converts a Light Transport or Heavy Transport carrying units, the ship is converted but its cargo is not. Converted units maintain their attributes (attack, range, etc.) at conversion; they cannot be upgraded. Technologies you research do not apply to converted units, except Monotheism, Astrology, Fanaticism, Ballistics, and Siegecraft. Priests cannot convert Town Centers, Wonders, or allied villagers, military units, or buildings.

    COUNTER UNITS
    In this game, every unit has its weaknesses and counters that prevent it from dominating a match. A good example of this in the Tool Age is the Bowman. This Tool Age ranged unit is quite cheap and can easily hit-and-run enemy units, making it a very difficult unit to beat when in large numbers. A good answer to a high number of Bowmen are Slingers. Slingers can be built at the Barracks, costing food and stone. Aside from strong pierce armor, the Slingers also have a hidden attack bonus against all ranged units, making them the perfect counter for large numbers of Bowmen.

    To display the objectives while you are playing the game, click the Objectives button in the upper-right corner of the game screen. For more tips on achieving the objective, click on Hints. To open this page again while you are playing the game, open the menu and click on the Scenario Instructions button.
  hints: |-
    1. You must convert the Stone Thrower and then prevent it from being destroyed by the enemy before you can move it to your Town Center.
    2. One possible strategy is to use your resources to build a large force to destroy all units guarding the Stone Thrower before your Priest converts it. Another option is to approach more slowly and use your Priest to convert the supporting enemy units one by one before converting the Stone Thrower.
    3. If your original Priest is killed, you can mine the deposits of gold in the area to create additional Priests.
    4. The enemy has many Bowmen. It is a good idea to train several Slingers to protect your Priests, since Slingers are strong against other ranged units such as the Bowman.
  victory: |-
    You have saved Heliopolis from the Libyan marauders, and the gods are pleased. The pharaoh is grateful and has promised to fund the creation of a statue resembling your visage. It is an honor not usually bestowed upon someone other than the pharaoh himself.
  loss: |-
    The sacred city of Heliopolis and its mighty temples have been plundered by the Libyan raiders. In anger, the pharaoh has stripped you of your titles and forces you to help work on his monument for the afterlife. In case you have forgotten, the builders are buried in the tomb with the pharaoh when he dies. It appears that you will have all of eternity to make up for your mistakes.
  history: |-
    The Egyptians developed a rich and varied religion based on the worship of around 2000 gods and goddesses. Some of these deities were worshiped throughout the country, some by a specific town, and others within the home. Many of their religious beliefs were linked to the sun and the Nile—the two entities most responsible for the agricultural bounty that was the basis for Egypt's relative affluence. The pharaohs, with the help of priests, conducted rites throughout the year to ensure the regular flood of the Nile and movements of the sun.

    For major deities, great temples were built. A temple was not a place of worship, rather it was considered a home on earth for the god or goddess to which it was associated. The cult statue representing the deity might only be shown a few times each year at special festivals. Offerings brought to the temple were collected by priests and priestesses. The people would pray to a statue of the pharaoh because it was believed to possess divine powers and might intercede on behalf of the petitioner. Questions for the god or goddess were passed to priests or priestesses for reply.

    One of the most unique religious events in Egyptian history happened during the New Kingdom. Amenhotep IV—presumably the father of the famous Tutankhamun—created a cult around Aten, the sun god. Amenhotep IV renamed himself Akhenaten, in honor of the god, and while he still acknowledged the existence of other gods, he only worshiped Aten. This created a quasi-monotheistic religion. The impact of this new cult was very limited and, after his death, it disappeared as quickly as it had appeared.

    The decline of the Old Kingdom happened during the sixth dynasty (2345-2181 BCE) when the power of the pharaoh gradually weakened in favor of regional governors. Internal disorders and a serious drought, combined with unusually low Nile floods, were the final blows to a decaying kingdom. The Old Kingdom period was followed by the First Intermediate Period, during which Egypt was divided for over a century.
