text:
  instructions: |-
    Lower Egypt, around 3800 BCE

    Objective: Destroy the invading tribe.

    • Click units to reveal capabilities
    • Idle soldiers automatically attack enemies within sight

    New technologies have allowed your tribe to grow but have also brought conflict. The spread of the Sahara's sands has forced neighboring tribes to migrate into your lands to seize control of your foraging sites and defensive positions. Raiding parties from Upper Egypt have come down the river. Intercept and destroy these invaders before they infiltrate your villages and steal your food supplies.

    REVIEWING YOUR TROOPS

    You begin the game with an assortment of military units (four Axemen and three Bowmen). To review the capabilities of your troops, click a unit. Its attributes (hit points, attack strength, melee armor, pierce armor, range) are shown in the status box at the bottom of the game screen. Notice that the Axemen have more attack strength than the Bowmen, but the Bowmen have range, which allows them to fire at the enemy from a distance.

    ENGAGING IN COMBAT
    Enemy units become visible when they are within your unit's sight. They disappear again if they exceed your unit's sight. Idle soldiers automatically attack any enemy units within their sight.

    To display the objectives while you are playing the game, click the Objectives button in the upper-right corner of the game screen. For more tips on achieving the objective, click on Hints. To open this page again while you are playing the game, open the menu and click on the Scenario Instructions button.
  hints: |-
    1. The small war party from Upper Egypt is located to the east.
    2. Keep your units together so you can take out the enemy one unit at a time.
    3. An alternative, more advanced tactic, is to split your military units into two groups (Bowmen and Axemen) so you can keep the Bowmen back to take advantage of their range, and use the Axemen for hand-to-hand combat.
    4. Bowmen firing down at the enemy from cliffs or elevation cause extra damage.
    5. If possible, concentrate your fire on one enemy to kill him quickly.
  victory: |-
    Your people have repelled the raiders and are safe for now. Your successes and the threats of powerful neighbors have encouraged smaller nearby tribes to join you for safety. They offer food and their wealth in exchange for your protection. You have begun to lay the first foundations for a new concept called kingship.
  loss: |-
    With one hit from a stone arrowhead, you were introduced to yet another new technology. Unfortunately you will not be able to do anything with this knowledge, even though your brain became very familiar with it.
  history: |-
    Archaeological evidence suggests that warfare has been part of human life for much longer than we would like to admit. Previous theories assumed that the early nomads were more peaceful than their sedentary counterparts in later years, but mass burial sites found across the world have made scientists review that theory. A mass burial in Jebel Sahaba, south of Egypt, for example, contains the remains of 61 adults and children. Some of the skeletons show evidence of hard blows or arrow points embedded in bones. This site has been dated to about 13,000 years ago. The implication of evidence such as this is that prehistoric life was a struggle against other humans, not just nature or the elements. People who possessed good hunting and foraging lands had to defend them with force or risk annihilation.
