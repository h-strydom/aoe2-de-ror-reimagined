text:
  instructions: |-
    Kii Peninsula, 210 BCE

    The Divine Emperor Qin Shi Huang dispatched you across the eastern seas to locate the elixir of life on Penglai Mountain and return it to him so that he may rule China for eternity. You are a rational person and know that you may find no elixir in the eastern lands; but you did not become court sorcerer by digging wells after you are thirsty. Before departing Shandong, you requested soldiers for your journey. These will allow you to defeat whoever might oppose you at your destination and, if necessary, allow you to settle in the east.

    Objectives:
    • Eliminate the Jomon chieftain.
  hints: |-
    1. Consider the terrain before attacking. You deal more damage from on top of a hill.
    2. Although Xu Fu is a skilled archer, he will need help to kill the Jomon Chieftain.
    3. The disciples of the Taoist sorcerer, Anqi Sheng, may be nearby. Locate them to restore your strength.
  victory: |-
    After defeating the Jomon chieftain, you scaled the mountain and found no elixir. If you were to return to China, the Emperor would be most displeased with your failure. You decide to stay and settle in this land. The Jomon will need a leader and you have much to teach them.
  loss: |-
    After failing to defeat the Jomon, you made a hasty retreat to China without the elixir. The Emperor is most displeased with your failure. He orders you to report to his mausoleum to serve him for all eternity as one of the figures in his Terracotta Army.
  history: |-
    Qin Shi Huang, the First Emperor of China, feared death and sought a way to achieve immortality. According to legends, he tasked Xu Fu, the court sorcerer and alchemist, with finding an elixir of life on the mythical Penglai Mountain in the islands east of China. According to Chinese accounts, Xu Fu landed on the Kii Peninsula of Japan, near Mount Fuji, in 210 BCE with a crew of soldiers, farmers, and craftsmen. Xu Fu never returned to China, however, presumably making himself king of the islands rather than return home empty-handed. Legends relate that Xu Fu, who became known as Jofuku in Japanese histories, taught the natives of the islands medicinal and farming techniques. He would eventually become one of the possible historical inspirations for the first Japanese emperor, Jimmu.

    While archaeological records cannot confirm these legendary events, beginning in 300 BCE, rice farmers from mainland Asia settled in the Japanese archipelago and introduced elements of Chinese culture and technology to the islands. The earlier inhabitants of Japan, whose culture is known as Jomon, were a Neolithic people who subsisted primarily through hunting, fishing, and gathering. They used basic stone and wooden tools and stitched together their clothing from the bark of the mulberry tree. The Jomon are best known for their patterned pottery, from which the culture gets its name. This earthenware is among the oldest pottery found in the world, with pieces dating to as early as 14,500 BCE.

    Around 300 BCE, the material culture of Japan became more sophisticated due to mainland influences. Over the next six centuries, a period known as the Yayoi period, Japan saw a technological revolution with the introduction of rice agriculture and metalworking. Chinese historical records from this period describe Japan as a land of hundreds of scattered tribal communities, often in conflict with one another.
