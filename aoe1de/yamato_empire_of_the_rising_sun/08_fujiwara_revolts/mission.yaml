text:
  instructions: |-
    Kyushu, 740 CE

    Emperor Shōmu, your great-grandfather, the Emperor Tenji, ended the power of the Soga clan by aligning with a minor courtier. In recognition of his aid, your ancestor bestowed the clan name Fujiwara to the courtier. Now, like the Soga they helped defeat, the Fujiwara have grown powerful and seek to dominate the Imperial throne. One of their clan leaders leads a rebellion in Kyushu. Defeat him and restore the people's faith in your divine rule.

    Objectives:
    • Destroy the Fujiwara revolt.
  hints: |-
    1. Establishing a base across the Kanmon Straits will allow you to more quickly bring troops to battle.
    2. The river in the west gives you access to the rear of the Fujiwara defenses.
  victory: |-
    You have restored peace to Japan, but wars and the intrigues of court weigh heavily on your spirit. You hope that with your victory and the weakening of the most powerful clan, you will be able to one day abdicate the throne in favor of your daughter. You will retire to a Buddhist temple to become a monk and walk the Eightfold Path. After all, with your victory, most assuredly, no clan will ever again dare to challenge the Yamato Emperor!
  loss: |-
    Though they defeated you, the Fujiwara are most gracious to you as Emperor. Although they exiled you, they did allow you to be the ruler of your new home… on the northernmost tip of Japan. Dress warmly.
  history: |-
    The Fujiwara clan originated when Nakatomi no Kamatari was rewarded with that clan name by Emperor Tenji for his role in the Isshi Incident that ended Soga power. During the rule of Emperor Tenji and his successors, the Fujiwara increased in power and married into the Imperial family, just as the Soga had done. By the 730's CE, the clan monopolized power on the Council of State with four out of ten seats held by a Fujiwara clan member. In 735 CE, however, a devastating plague swept through Japan and led to the deaths of the leading Fujiwara officials. This setback allowed other clans to gain prominence. These clans quickly pushed the Fujiwara out of power, causing Fujiwara officials to be demoted and sent to remote posts.

    Fujiwara no Hirotsugu was one such official. He had been demoted from governor of Yamato province to a remote post at Dazaifu in Kyushu in 738 CE. In September 740 CE, Hirotsugu began a rebellion, demanding the dismissal of corrupt officials he blamed for his clan's decline.

    Hirotsugu found willing followers in Kyushu. The island had suffered from the plague and repeated years of bad harvests. Government attempts to assuage the gods by constructing temples only exacerbated the conditions of the locals who were forced into providing labor for the building programs. Hirotsugu was soon able to raise an army and began establishing relations with the Korean Kingdom of Silla.

    The Emperor Shōmu responded to these actions by sending an army to Kyushu. Hirotsugu's rebellion fell apart as several of his allies defected, and the Imperial forces distributed a decree promising rewards for the death of the rebel leader. Hirotsugu led his remaining forces to battle at the Itabitsu River, where they were decisively defeated. Hirotsugu then attempted to flee to Silla by boat, but storms caused him to abort his journey, and he was finally captured and beheaded.
