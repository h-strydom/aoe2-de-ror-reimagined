text:
  instructions: |-
    Nara, 180 CE

    War has raged over the islands for many years, and the spirits are angry. Their disharmony is felt in the trembles of the earth and the waves which fall over and sweep away the coastal villages. Though you are young, Himiko, as a shaman queen, you know how to assuage the gods and restore the harmony of Japan and her people. Many proud kings remain untouched by the spirits, however. Use your magic and show them the folly of their ways.

    Objectives:
    • Destroy the four Izumo Barracks
    • Capture the War Chest and bring it to your Temple
  hints: |-
    1. A Priest's healing can help even a simple Axeman defeat many opponents.
    2. If used smartly, two Priests can defeat groups of units.
    3. Chariots are nearly immune to Priests. Use converted units against them.
  victory: |-
    Queen Himiko, you have pleased the spirits and saved untold lives from the blight of war. Japan is finally united under your rule and harmony has been restored. You will send envoys to China to establish relations with the mighty Cao Wei kingdom. And when you finally breathe your last, your people will inter your remains in a great earthen mound built to honor your illustrious life.
  loss: |-
    Maybe becoming queen of Japan was a bit too ambitious, even for a shamaness. You might be better off using your magic on something more attainable. There are some sheep who could use a leader.
  history: |-
    The introduction of rice agriculture in Japan had profound impacts on Japanese culture. Population increased tenfold from the earlier Jomon period and Yayoi sites featured large structures suggestive of grain storehouses. As in other parts of the world following the introduction of large-scale agriculture, these changes were followed by increased social stratification, tribal warfare, and the construction of military fortifications to defend grain stores and farming lands. 

    Chinese records from the 3rd century CE mention a kingdom called Yamataikoku, a possible precursor state to the later Yamato. According to these sources, the kingdom was ruled by Queen Himiko, a spiritual leader who ascended the throne as a young woman after the great civil war in the islands. It was said in the Chinese histories that Himiko used magic and her knowledge of the spirits to bewitch the people into placing her on the throne. As Queen, she established diplomatic relations with the Chinese kingdom of Cao Wei, famed for its role during the Three Kingdoms Period of Chinese history. Himiko remained unmarried during her long reign and resided in a grand palace with one thousand women and one man as attendants.

    Unlike the Chinese accounts, however, the Japanese chronicles are less certain of Himiko's existence, with the two oldest Japanese histories making no mention of the queen. In later centuries, Japanese writers would identify Himiko with other women, most notably Empress Jingū, another legendary figure who reigned as regent during the minority of her son, Homutawake, later known as the Emperor Ōjin.
