text:
  instructions: |-
    Izumo-taisha, 300 CE

    It has been many years since the reign of Queen Himiko and war once again grips Japan. Your clan, the Yamato, controls the Kansai region, where you, Homutawake, rule as king. Rival lords, however, threaten your rule in this life and the next. They compete with one another over farming lands and the construction of giant burial mounds to house their remains. But you know that the great Shinto shrines are more prized than any rice paddy or mound. Your rivals, the Izumo clan, control one such shrine. Destroy it and build a greater shrine where it once stood to weaken your rivals' influence, and receive the blessings of the gods.

    Objectives:
    • Destroy Izumo Temple.
    • Build a Temple where Izumo Temple once stood.
  hints: |-
    1. The Kibi control the resources you need for victory; attack them early before they claim these resources as their own.
    2. A combined arms approach is best for defeating the Izumo. Cavalry can chase down their Composite Bowmen and Ballistae while heavy infantry and Stone Throwers can do the rest.
  victory: |-
    The gods have blessed your reign, Emperor Homutawake. Your defeat of the Izumo and their Kibi allies has strengthened your clan, making the Yamato the predominant power on Honshu island. You have constructed shrines throughout your lands, and begun construction of a great burial mound to house your remains after your work on this earth is done.
  loss: |-
    Your sons counsel you on your failure. They recommend that you make peace with the gods by becoming a hermit. They say Mount Fuji is quite lovely in the winter.
  history: |-
    Around 300 CE, large earthen burial mounds, called Kofun tombs, began appearing in Japan. These mounds varied in size and shape, but most distinctive were those resembling a giant keyhole pattern. Rulers and the elite were buried in the tombs with weapons and other personal items. As with the construction of monuments in other parts of the ancient world, the building of these tombs coincided with political centralization and a period of warfare during which various local chiefs competed for dominance.

    The Shinto religion also emerged from previous belief systems during the Kofun period, although the oldest Shinto shrines, such as Izumo-taisha and Ise Grand Shrine, date to as early as the Yayoi period. The word Shinto, meaning "way of the gods," was adopted from the Chinese Shendao, meaning "spirit path or study." In Shinto religion, practitioners rely on diligent ritual to establish a connection to the Kami, or gods. The Kami embody the powers of nature such as the sun, wind, storms, and the sea.
