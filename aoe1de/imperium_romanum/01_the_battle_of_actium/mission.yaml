text:
  instructions: |-
    Actium, 31 BCE

    Marc Antony has taken the offensive, crossing the Gulf of Ambracia in a maneuver designed to strike quickly at your camp. Cleopatra, meanwhile, has laid anchor within the gulf, her barge protected by the Egyptian navy. Should Antony's attack be repulsed, she will likely flee to Egypt where reinforcements await. Your destiny is in your hands, Octavian. Deal a crushing blow to your enemies here, and nobody will be able to challenge your claim to the title of Princeps Civitatis!

    Objectives:
    • Destroy the Town Centers of the two enemy fortresses.
    • Sink Cleopatra's Barge.
  hints: |-
    1. You will need powerful land and naval forces for complete victory; do not rely too heavily on one or the other.
    2. You may need to relocate your camp.
  victory: |-
    Your glorious victory over the combined forces of Antony and Cleopatra has compelled them to flee to Egypt. Although some additional maneuvers will doubtless be required to secure the lands that had rebelled under Antony, the main danger is past. You have solidified your control of Rome; and you are now positioned to take more power than any Roman ever has before. Soon, the citizens of Rome will be heaping endless praise on you during your triumph!
  loss: |-
    Your loss to the combined forces of Antony and Cleopatra has compelled you to withdraw to Rome and attempt to rebuild your forces. With the eastern part of the empire now lost to our enemies, it is likely that Antony will follow up his victory by marching on Rome. A second defeat at the hands of Antony will mean the end of your career as consul and will surely allow Antony to become the first emperor of Rome.
  history: |-
    Following the assassination of Julius Caesar in 44 BCE, Rome was sent into a tailspin of conflict between various political factions. Out of the chaos emerged a triumvirate composed of Marc Antony (Caesar’s closest ally), Octavian (Caesar’s nephew), and Marcus Aemilius Lepidus, the pontifex maximus of Rome. The power of this “Second Triumvirate” was derived from the Lex Titia, a piece of legislature that granted them near-absolute authority. At the Battle of Philippi in 42 BCE, they crushed the forces of Brutus and Cassius, two of the principal figures in the plot against Caesar.

    Octavian proved to be an exceptional politician, and was a master of brokering political alliances and utilizing the sentiments of the common people to support his own aims. For a decade, the volatile political alliance between the triumvirs was largely held together by mutual pragmatic interests and by Antony's marriage to Octavian's sister, Octavia. Antony was placed in control of the East while Octavian assumed control of the West. Lepidus’ role was increasingly marginalized.

    Antony committed a grave error when he fell for Cleopatra of Egypt and shunned his wife in favor of Cleopatra (in 33 BCE). Seizing the opportunity, Octavian leveraged this insult as a means of eroding Antony’s support from within the Senate and the people of Rome. The Senate agreed to declare war on Cleopatra, which was by extension a war on Antony. After some maneuvering, the forces of Octavian and Antony clashed at Actium, near the Gulf of Ambracia, in 31 BCE. Claiming a decisive victory, Octavian added most of the Roman territory in the East to his already impressive holdings.

    Antony and Cleopatra escaped to Egypt, where they attempted to recruit a new army. The local troops defected to Octavian, however, and Antony and Cleopatra chose to commit suicide rather than be paraded through the streets of Rome in Octavian’s triumph. Antony, true to Roman tradition, literally fell on his sword; but Cleopatra held a deadly poisonous snake—the asp—to her breast, causing it to bite her. Octavian, meanwhile, went on to further consolidate his power in Rome, first being proclaimed Princeps Civitatis (first citizen), and eventually becoming the first emperor of the newly-formed Roman Empire, which he ruled under the title of Augustus Caesar.
