description: |-
  Rome. The very name conjures images of steely-eyed legionaries and opulent senators. But Rome was not built in a day. Journey back to when Rome was nothing but a modest town on the Tiber River. Follow the Romans as they overthrow their Etruscan masters, conquer Italy, and expand throughout the Mediterranean to challenge Carthage and Greece. Divide and conquer, Consul.
