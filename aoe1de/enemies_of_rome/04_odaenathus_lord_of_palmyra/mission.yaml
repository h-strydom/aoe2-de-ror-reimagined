text:
  instructions: |-
    Syria and Mesopotamia, 262 CE

    The Emperor Valerian lies captive in a Persian dungeon following his defeat at Edessa. His son and successor, Gallienus, faces revolts in Egypt and Gaul. The Empire is in turmoil, and the Persian horde continues its westward march, nearing your client kingdom of Palmyra. The emperor is entrusting you, Odaenathus, King of Palmyra, to serve Rome by defeating the Persian host. Drive the Persians from Syria and take our war to their cities and you will be acclaimed Imperator Orientis, Commander of the East.

    Objectives:
    • Destroy the Persians.
  hints: |-
    1. Supplies are very limited in the dry desert, so protect your remote camps at all costs.
    2. A defensive strategy is necessary until you have built enough troops for a successful offense.
  victory: |-
    Word of your success has reached the Emperor Gallienus. He is most pleased with his Palmyran allies and confers great titles upon you. Enjoy the spoils of victory, Odaenathus, and the company of your young sons and beautiful wife Zenobia, as the triumphs of ambitious men like yourself are often fleeting.
  loss: |-
    Your failure to drive the Persians back has added to Rome's frontier problems. Most of the eastern part of the empire is now open to further Persian raids and conquest. Though your title as Imperator Orientis has been revoked, take heart; the emperor has bestowed a new title upon you, Nausius Maximus.
  history: |-
    In 260 CE, the Persian Shahanshah (King of Kings) Shapur I raided Roman territory in Syria and northern Mesopotamia. The emperor, Valerian, met the Persian army near Edessa but suffered one of the most significant defeats in Roman history. When the defeated emperor attempted to negotiate with Shapur, he was captured. Beset by revolts elsewhere in the Empire, Rome turned to a Romanized Arab king named Odaenathus, ruler of a small but powerful client kingdom called Palmyra, to avenge the defeat.

    In the 3rd century CE, Palmyra was a wealthy Syrian city astride a prominent caravan route. Although attached to the Roman province of Syria, Palmyra enjoyed autonomy and had, under Odaenathus, been elevated to the status of a kingdom. Though the sources around Odaenathus' rise are ambiguous, his military successes against Persia earned him the trust of the Romans and significant power and influence. Odaenathus followed Valerian's defeat with stunning offensive victories in Persian territory, even twice besieging the Persian capital at Ctesiphon.

    In 267 CE, Odaenathus was forced to abandon his Mesopotamian campaign due to an influx of Heruli tribesmen raiding the Black Sea coast of Anatolia. Soon after, the Palmyran king was assassinated under unusual circumstances. The kingship then passed to Odaenathus' young son, with the dead king's widow, Zenobia, serving as regent.
