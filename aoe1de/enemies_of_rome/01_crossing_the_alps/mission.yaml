text:
  instructions: |-
    The Alps, 218 BCE

    Hannibal of Carthage, your plan to invade Italy by crossing the Alps is cunning, brilliant, and fraught with risk. The mountain passes are inhabited by fearsome Celtic tribes and Roman garrisons defend the foothills beneath the mountains. If your daring gamble is successful, however, all of Italy will lie before you. Do the unthinkable, Hannibal: cross the mountains with your elephants and you will be remembered as the greatest leader in history!

    Objectives:
    • Bring Hannibal and both Armored Elephants past the double flags in the lower corner of the map.
  hints: |-
    1. The Romans have gotten word of your arrival. Move quickly before they have time to prepare their defenses.
    2. Scouts marked the passes through the mountains but were taken prisoner. If you can free them, they will be of great use.
    3. Use waypoints to guide your troops through the narrow valleys. To use waypoints, click a unit, press SHIFT, and right-click each point along the path. The unit will immediately start following the waypoints from the first till the last one.
  victory: |-
    Your crossing of the Alps was a masterstroke in the annals of history. All of Carthage applauds you and your army. With Italy before you, Rome will feel your vengeance!
  loss: |-
    Your failure in the Alps has doomed Carthage. Only a successful invasion of Italy would have slowed the Roman advance. Now, Roman legions march into Hispania, and it will only be a matter of time before they reach Carthage itself. You were a fool to think elephants could cross the Alps, and your punishment is to be slowly crushed to death under the feet of one of your pachyderms.
  history: |-
    Following Carthage's defeat in the First Punic War (264 – 241 BCE), the North African power lost naval supremacy in the Central Mediterranean to the Romans. When hostilities between Rome and Carthage resumed in 218 BCE, Carthage was unable to challenge Roman naval power, preventing a Carthaginian seaborne invasion of Italy. A twenty-nine-year-old Carthaginian general based in Hispania, however, had a solution to Carthage's strategic challenge.

    In the spring of 218 BCE, Hannibal Barca departed Carthago Nova in eastern Hispania with an army of reportedly 40,000 infantry and 12,000 horsemen, as well as his famous elephants. Marching north, he crossed the Pyrenees, subduing mountain tribes, and then continued through southern Gaul, fighting hostile chiefs, allying with others, and bolstering his force with mercenaries. The Romans, alarmed by Hannibal's movements, sent an army under Publius Cornelius Scipio, father of Hannibal's later foil, to intercept him, but Hannibal evaded this Roman force. Reaching the Alps and with the winter approaching, Hannibal led his army—primarily composed of North Africans and Iberians unaccustomed to the extreme cold and the high altitudes—through the dangerous mountains. They suffered heavy casualties from raids by Celtic tribes, as well as from disease and exposure to the extreme elements. Many men lost their footing and plunged to their deaths in the high mountain passes. Hannibal exhorted his men onward, and finally they reached the Po Valley of Northern Italy. Hannibal and his warriors spent the next fifteen years in Italy, defeating the Romans in multiple engagements, but ultimately would fail to take their ultimate prize: the city of Rome.
