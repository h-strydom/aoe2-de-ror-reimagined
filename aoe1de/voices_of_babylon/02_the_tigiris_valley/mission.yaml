text:
  instructions: |-
    Tigris Valley, 1755 BCE

    The addition of the Sumerian and Akkadian cities to the rising Babylonian Empire pleases Hammurabi greatly. Now, he sets a more difficult task for you. One of our frontier cities was recently sacked and important treasures, including a copy of Hammurabi's law code engraved in stone, were carried off to the Tigris River. Chase the raiders to where the treasures were taken and build up a force to recover them. They must not be allowed to move the treasures upstream. The prestige of your great king remains tarnished for as long as these treasures remain in enemy hands.

    Objectives:
    • Capture the 2 missing treasures (Artifacts) and return them to your side of the river.
  hints: |-
    1. A lot of the action takes place on the Tigris River, so a strong navy is key to ensuring your victory.
    2. The Babylonians are restricted to the Bronze Age—you cannot advance to the Iron Age.
  victory: |-
    The great king Hammurabi has died. During his lifetime, you managed to prevent raids and invasions into the Babylonian heartland, ensuring Babylon's continued success. But with Hammurabi's death, the Babylonian Empire has gradually started to decline. Only time will tell when we will have another great king such as Hammurabi to once again make Babylonia a great power.
  loss: |-
    You have failed your king, and many Babylonian cities have been plundered and razed to the ground. Hammurabi has ordered you to be attached by a rope to his chariot, and dragged along when he goes on his next campaign.
  history: |-
    After succeeding in uniting all Sumerian, Amorite and Akkadian city-states along the banks of the two rivers, Hammurabi invaded and conquered Elam to the east and the kingdoms of Mari and Ebla to the northwest. This secured Babylon's eastern borders, which had always been prone to raids by its neighbors from the Zagros mountains. Late in his reign, Hammurabi attacked Assyria, then still called Subartu, and forced them to pay tribute to Babylonia, making Babylonian rule over the Euphrates and Tigris rivers complete. Under his rule, the Babylonian Empire became a great power in the region. The city of Babylon itself grew into a vast and holy city. But upon Hammurabi's death in 1750 BCE, the Empire of Babylonia gradually started to decline, disintegrating into smaller states. Nevertheless, the citadel of Babylon managed to remain a large urban center because of its strong position, reputation, and many trade routes.

    Nowadays, Hammurabi is most remembered for the Code of Hammurabi, which is one of the best-preserved law codes from ancient times. The code was carved into a great stele (stone slab), and contains 280 judgments on civil and criminal law, dealing mainly with matters related to everyday life such as corrupt administrations, theft, receiving stolen goods, robbery, looting, murder, abduction, taxes, merchant relations, slavery, divorces, dowries, and inheritances. Remarkably, the expression "An eye for an eye and a tooth for a tooth" is also inscribed in the code—a saying which has survived until the present day. Although it is not the only law code from that period, it is the most well-known and extensively researched of them all, and yields a great deal of insight into ancient societies.
