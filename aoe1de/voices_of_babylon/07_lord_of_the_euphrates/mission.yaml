text:
  instructions: |-
    The Euphrates River, 748 – 734 BCE

    Babylonia has succumbed to the continuous invasions of the Aramaeans—yet another semi-nomadic tribe from the west. The empire has been reduced to poverty and our kings hold onto little more than their grand titles. Things are about to change, however—an Assyrian general named Tiglath-Pileser has rebelled against his king and has taken the throne. He is willing to support our new king Nabonassar to retake land lost to the Aramaeans, our common enemy. Nabonassar commands you to revitalize the Babylonian armies and destroy the invaders encroaching on our territory.

    Objectives:
    • Destroy the Northern Aramaeans (Red).
    • Destroy the Western Aramaeans across the river (Yellow).
  hints: |-
    1. Prepare your defenses quickly, for there are enemies on all sides. The Babylonians have excellent walls and towers, so make use of them.
    2. Do not attack until you are prepared to face the enemy at full strength.
    3. The Assyrian king has promised you help. You can find his reinforcements in the desert to the east and on the river to the north.
  victory: |-
    You have achieved a great feat by defeating our enemies, and Nabonassar has promoted you to field general. For as long as Nabonassar lives, Babylonia will be independent. What will happen after he dies is yet to be seen.
  loss: |-
    The Babylonian army has been crushed, and yet again Babylon has come under the rule of a foreign king. The new ruler has demanded you to come to his court and entertain him as the king's buffoon.
  history: |-
    Despite many years of conflict and a raid on Babylon itself by the Assyrians, the threat of the Aramaeans and other Semitic nomadic tribes forced Babylonia and Assyria to make peace to deal with the repeated attacks of these people. Even though the Babylonian kings still assumed grand titles, they were unable to stop the disintegration of the Babylonian Empire. The years between c. 1000 BCE and c. 750 BCE were marked by Aramaean invasions; and although the Babylonians and Assyrians were struggling to repel them, the Assyrians nevertheless succeeded in managing the situation better than the Babylonians. In the 9th century BCE, the Assyrians incorporated large parts of Mesopotamia that had been conquered by the Aramaeans, encountering little resistance from the Babylonians who instead had to deal with palace intrigues and usurpers.

    After 780 BCE, the Assyrian power started to decline when considerable lands in the north and west were lost and the general Tiglath-pileser deposed the former Assyrian king, thus creating the Neo-Assyrian Empire. This gave the Babylonians a chance under their new king Nabonassar to restore some of Babylonia's former power. Nabonassar allied himself with the new Assyrian king, Tiglath-pileser III, and together they defeated the Aramaeans, after which the two kings continued to pursue amicable relationships, and Tiglath-pileser III visited the cities and temples in Babylonia. Nabonassar retained his independence, even though Assyria quickly recovered from the power change and Tiglath-pileser III brought Assyria to its greatest territorial expansion after conquering Syria, Armenia and Israel. However, when Nabonassar died, so did the friendly relationship between Babylonia and Assyria. During the reign of Nabonassar’s successors, Tiglath-pileser III conquered Babylonia, dethroned the king, and assumed a Babylonian name, making himself the king of Assyria and Babylonia, thus ending its independence and incorporating it into the Assyrian Empire.

    After Tiglath-pileser's death, the new Assyrian Empire kept on growing, expanding further into Egypt, Asia Minor, Elam and even into what is now Iran, making it the largest empire in the entirety of the Middle East at that time. After several rebellions by the Babylonians during the 7th century BCE, the Assyrian king Sennacherib retaliated against the rebellious city. In 689 BCE, Babylon was conquered and completely destroyed, its temples plundered and leveled. The waters of the Arakhtu Canal were diverted over the ruins, and the inner city remained almost completely uninhabited for eight years. These harsh measures also upset many Assyrians because they too considered Babylon to be a holy city.
