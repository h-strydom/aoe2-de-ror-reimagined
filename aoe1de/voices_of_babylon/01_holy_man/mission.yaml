text:
  instructions: |-
    Mesopotamia, 1760 BCE

    The small city state of Babylon is growing under the energetic leadership of its new king, Hammurabi. You have been sent down river to bring some enclaves of Sumerians and Akkadians into the fold. Use your powers of persuasion when you can, but do not hesitate to resort to war if they prove to be resistant.

    Objectives:
    • Convert or destroy the Sumerians.
    • Convert or destroy the Akkadians.
  hints: |-
    1. Use your Priest to convert enemy villagers and military units. It is important that your Priest does not die until you have at least converted one or more villagers and can build a base.
    2. The town to the east may be your best bet for establishing a quick foothold, as it is the weakest of the two.
    3. The Babylonians are restricted to the Bronze Age—you cannot advance to the Iron Age.
  victory: |-
    You have managed to capture both Akkad and Sumer, reestablishing a great part of Sargon's old empire. With Babylonian rule extended to the other city states, you can bring Hammurabi's law code to them, and ensure further peace and stability in the empire. However, there is no time to revel in your success. The people in the Zagros mountains are restless and threaten the peace. Hammurabi has called upon your services once again to deal with them.
  loss: |-
    In view of your failure to subdue your neighbors, the future of Babylon has become bleak. It is unlikely that it will ever grow outside its initial borders, and it will forever remain a minor city in Mesopotamia, overshadowed by other older and more powerful states like Assyria and Elam. Maybe a life in the military was not for you after all. Your fellow citizens suggest that you take a job as a bricklayer at the local Ziggurat instead.
  history: |-
    Before the rise of the Babylonian Empire, Mesopotamia had been ruled by the ancient inhabitants of Sumer, downriver from Babylon. However, with the decline of this civilization, a new people to the north, called the Akkadians, rose to prominence. Their king, Sargon, conquered the entire region and united the Sumerians and Akkadians, creating the first great empire in Mesopotamia around 2350 BCE. This empire stretched from the Persian Gulf to Anatolia, but crumbled by 2230 BCE due to internal rebellions and the invasions of Gutian tribesmen from the Zagros Mountains to the east, and semi-nomadic Amorites from the northwest. To what extent Sargon's empire was an actual empire is still debated. Sources mention trade routes with India and the Arabian Peninsula, and expeditions to Syria and the Levant; but it seems that most cities in Mesopotamia still enjoyed a large amount of autonomy, and that military expeditions were issued with the objective of securing trade and extending the Akkadian sphere of influence, rather than full-on conquest.

    After the fall of Sargon's empire, Mesopotamia came under the influence of the Gutians and Amorites. Nevertheless, the city state of Ur managed to resist them, and its leaders became the kings of Sumer and Akkad, founding the dynasty of Ur. The Gutians disappeared as a power, but the Amorites, on the other hand, were persistent and slowly displaced the local rulers. The dynasty of Ur started to decline and was replaced by small Amorite and Akkadian states. 

    Hammurabi inherited the city-state of Babylon, one of these smaller Amorite states, in 1792 BCE. At that time, Babylon only consisted of the city and its farmlands, and was surrounded by similarly small kingdoms centered on other minor cities. Hammurabi’s first act was to unite all the cities and city-states of southern Mesopotamia, forming one larger kingdom, ruled from mighty Babylon.
