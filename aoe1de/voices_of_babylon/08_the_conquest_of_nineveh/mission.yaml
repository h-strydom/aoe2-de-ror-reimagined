text:
  instructions: |-
    Nineveh, 612 BCE

    Finally, Babylonia has been liberated from Assyrian oppression. Civil wars, rebellions and foreign invasions have brought the once-mighty empire to its knees. The Assyrians have fallen back behind the imposing walls of their capital at Nineveh while an army of Babylonians and Medes converge on the capital of Assyria. Destroy the Wonder in Nineveh to break the power of the Assyrians indefinitely.

    Objectives:
    • Destroy the Wonder in Nineveh.
  hints: |-
    1. You and your allies are in a disadvantageous position. It is vital to your success to quickly turn the odds and gain control over major resource deposits.
    2. Catapults are your best chance of destroying enemy walls. Use these weapons wisely to gain control of the map.
    3. The Medes are sending their best soldiers and ships to help tear down the walls of Nineveh. Your scouts report that they will arrive from the northeast.
  victory: |-
    Nineveh has been destroyed and the Assyrian Empire has been broken. A new era has arrived—one of Babylonian rule. The coalition congratulates you on a job well done.
  loss: |-
    Our siege has failed and the coalition has broken down, bickering amongst themselves like little children. The Assyrians once more have managed to take power and re-establish their rule over our people. Somehow, you were never to be heard of again, but rumors circulate that you were sold to the Scythians where you spent the rest of your life scooping up horse manure.
  history: |-
    In the 7th century BCE, a series of wars erupted between the Assyrian Empire and the people it had subdued. The king of Babylonia, who was the brother of the Assyrian king Ashurbanipal, formed a secret alliance with the Medes, Elamites, Aramaeans, Arabs and Egyptians to overthrow his brother. When the Elamites were defeated prematurely, the king of Babylonia decided to act calling upon the alliance to go to war (in 652 BCE). However, the rebellion was crushed, and Ashurbanipal captured Babylon, eliminating his brother who died in his palace when it was set ablaze. A series of punitive attacks were launched by the Assyrians to deal with those who dared rise against them. The Arabs were quickly defeated, and Elam became an Assyrian province after their capital, Susa had been destroyed. The rest of Ashurbanipal's reign was more peaceful, and Assyria reached the zenith of its power. At this point in history, Babylonia was surpassed culturally and economically by Assyria.

    The tide turned when, in 635 BCE, a civil war erupted in the Assyrian heartland, and they could no longer fight off foreign invasions. In 626 BCE, the Chaldeans, who had settled in southern Babylonia, revolted in Uruk and occupied Babylon, while the Scythians laid waste to Syria and Palestine. In 625 BCE, Cyaxares of the Medes, began to conquer the eastern provinces of Assyria. Then, a combined army of Chaldean Babylonians and Medes marched on Nineveh. A former attempt by the Medes to take the city had been thwarted by the Scythians, but in 612 BCE the Medes and Babylonians succeeded in destroying Nineveh and, with it, the Assyrian Empire. The invaders took their revenge on the local inhabitants and, 200 years later, Xenophon (a Greek mercenary serving the king of the Persian Empire) found the country sparsely populated. In a few decades, the mighty Assyrians went from capturing Babylon (648 BCE) and Susa (639 BCE) to ceasing to exist as an empire.

    With Assyria gone as a major power, several new ones rose in its place: The Median Empire in Iran, a new Egyptian Kingdom in Egypt, and the Neo-Babylonian Empire in the rest of the Middle East. Babylonia entered its last period of glory with Nebuchadnezzar II as its most successful king, remembered best for capturing Jerusalem, capital of Judah, in 597 BCE. Following the revolt of Jerusalem in 587-586 BCE, many residents were carried off to Babylon and kept there for several generations.

    Babylon during this period was perhaps the most impressive city in the world. The wealth of trade and empire was expended on monuments, ziggurats, and palaces. The giant walls and the Ishtar Gate were described in detail by Herodotus and listed as one of the wonders of the world. The famous Hanging Gardens were built to resemble a verdant mountain to remind Nebuchadnezzar's wife of her homeland. This status stood in vast contrast with the condition of the city during Assyrian rule.

    The final Babylonian Empire lasted until 539 BCE. During that year, the people of Babylon surrendered their city without a fight to the great Persian king Cyrus II. They had grown tired of their incompetent ruler Nabonidus and were ready to accept the wise and capable Persian king. The Persian Empire would become one of the most powerful empires to have ever existed in the Middle East.
